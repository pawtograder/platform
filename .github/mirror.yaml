# Third-party charts and images copied into ghcr.io/pawtograder/mirror by
# .github/workflows/mirror-third-party.yml. Pin exact versions: a copy that
# already exists is never refreshed.

charts:
  # -> oci://ghcr.io/pawtograder/mirror/charts/<name>
  - name: forgejo
    repository: oci://code.forgejo.org/forgejo-helm
    version: 17.1.7
  - name: coder
    repository: https://helm.coder.com/v2
    version: 2.37.3
  - name: postgres
    repository: https://groundhog2k.github.io/helm-charts/
    version: 1.6.8

images:
  # -> ghcr.io/pawtograder/mirror/<path without the registry host>
  - code.forgejo.org/forgejo/forgejo:15.0.9-rootless
  - ghcr.io/coder/coder:v2.37.3
  - docker.io/postgres:18.6
  - docker.io/codercom/enterprise-base:ubuntu-20261005
