name: E2E Tests
on:
  push:
    branches:
      - main
      - staging
  pull_request_target:
  workflow_dispatch:

# Secure baseline: no permissions. Jobs that need them override explicitly.
permissions: {}

# Cancel an in-flight run when a newer one comes in for the same PR (or push
# ref). Under pull_request_target, github.ref resolves to the base branch, so
# keying on it alone would make every PR against staging collide; prefer
# pull_request.number when present so each PR has its own group.
concurrency:
  group: e2e-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether this ref may run on the self-hosted pool at all.
  #
  # e2e-local checks out the PR head and executes it: `npm ci` runs lockfile
  # install scripts, and the build, the config files and the test sources are
  # all attacker-controlled on a fork PR. The app secrets are gone from that job
  # (see the .env.local step below) and ARGOS_TOKEN is all that remains, so the
  # main exposure is now the runner itself — an untrusted PR gets arbitrary code
  # execution in a pod on the cluster, with only a container boundary between it
  # and everything else. That is a low-probability, high-cost failure, and it is
  # not worth carrying for drive-by PRs.
  #
  # This is also why the trigger stays `pull_request_target` even though the
  # job no longer wants secrets: under `pull_request`, GitHub runs the workflow
  # file from the PR head, so a fork could simply delete this gate. Under
  # `pull_request_target` the workflow — and therefore this check — always comes
  # from the base branch.
  #
  # Trust is decided on where the head branch lives, and nothing else. A branch
  # in this repo can only have been pushed by someone who already has write
  # access, so whoever supplied the latest commit is someone we already trust.
  #
  # Deliberately NOT author_association: that field describes the PR's author
  # and their standing in *this* repo, not whoever pushed the head commit that
  # is about to be checked out. Anyone with push access to the head branch can
  # update a PR and fire `synchronize`, and for a fork that set is controlled by
  # the fork's owner -- a personal fork's collaborators, or, for an org-owned
  # fork, every member with write there. Trusting a fork PR because its author
  # is a MEMBER would let any of them land code on this runner under that
  # member's standing. Current head-repo permission is not answerable from the
  # event payload either, and the API call it would need is not something a
  # fork-triggered token can be relied on to make.
  #
  # An untrusted PR gets no E2E run. To run one, a maintainer reviews the diff
  # and pushes the branch into this repo, which makes it a same-repo PR; that is
  # the same manual path canvas-e2e.yml documents. Everyone whose fork PR this
  # used to wave through -- owners, org members, collaborators -- already has
  # write access here, so that is a branch push rather than a favour to ask.
  check-trust:
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - id: check
        # Read the event through env rather than interpolating into the script:
        # these are GitHub-controlled enums today, but the habit is what keeps a
        # future field from becoming an injection.
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request_target" ]]; then
            # push to main/staging, or a maintainer's manual dispatch
            trusted=true
          elif [[ "${IS_FORK}" != "true" ]]; then
            # a branch in this repo: pushing it already required write access
            trusted=true
          else
            trusted=false
          fi
          echo "trusted=${trusted}" >> "$GITHUB_OUTPUT"
          if [[ "${trusted}" != "true" ]]; then
            echo "::notice title=E2E skipped::This PR's head branch lives in a fork, so it does not run on the self-hosted E2E pool. A maintainer can run the suite by pushing the branch into this repo after reviewing the diff."
          fi

  # Local-Supabase E2E. Spins up a clean dev environment on the runner and runs
  # the Playwright suite against it. The Coolify branch-preview job that used to
  # run alongside this one is gone — it'll come back once the deployment target
  # moves into the same k8s cluster as this runner.
  e2e-local:
    needs: check-trust
    if: needs.check-trust.outputs.trusted == 'true'
    runs-on: pawtograder-e2e
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      # Per-run project name so that two e2e-local jobs running on different
      # refs (or different runners in the same pool) don't clobber each
      # other's Supabase containers / Docker volumes. The Supabase CLI takes
      # this from `supabase/config.toml` `project_id`, so we sed-edit the
      # checkout copy below before any `supabase` invocation.
      SUPABASE_PROJECT: pawtograder-platform-${{ github.run_id }}-${{ github.run_attempt }}
      # Supabase local-dev keys are deterministic (signed with the public
      # "supabase-demo" JWT secret). Hardcoding lets us write .env.local — and
      # therefore start `next build` — before `supabase start` finishes.
      LOCAL_SUPABASE_URL: http://127.0.0.1:54321
      LOCAL_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      LOCAL_SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      # Per-run scratch dir for PID / log files. /tmp persists across jobs on
      # self-hosted runners, so namespacing on run_id+attempt prevents the
      # cleanup `kill $(cat ...pid)` from targeting a stale PID that the OS
      # has since recycled to an unrelated process.
      RUN_TMP: /tmp/e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node-22-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node-22-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '!**/node_modules/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@v1
        with:
          # Pin to a known-good version. `latest` makes runs non-reproducible —
          # bump deliberately when we want a new CLI.
          version: 2.105.0

      - name: Install dependencies
        run: npm ci

      # No repo secrets go into .env.local — every value below is a literal or
      # is generated on the runner. The suite does not need the real ones:
      #
      #   * GitHub App key / OAuth creds — E2E_MOCK_GITHUB below short-circuits
      #     the ingestion paths before they reach cloneRepository, so nothing
      #     authenticates to GitHub, and _shared/GitHubWrapper.ts only builds a
      #     JWT lazily, so a throwaway PEM satisfies the App constructor at
      #     module load. This is what AGENTS.md means by "GitHub App credentials
      #     are not required locally".
      #   * UPSTASH_REDIS_REST_* — omitted entirely. _shared/Redis.ts returns
      #     null when neither REDIS_URL nor the Upstash pair is set, and callers
      #     take the "Redis disabled" path.
      #   * SENTRY_DSN — omitted. _shared/SentryInit.ts no-ops without a DSN, so
      #     CI edge-function events no longer reach the Bugsink "Dev" project.
      #     Re-add the secret here if that reporting is wanted back.
      #
      # The remaining tokens (END_TO_END_SECRET, EDGE_FUNCTION_SECRET,
      # EVENTBRIDGE_SECRET) were already literals — they authenticate the suite
      # to a Supabase stack that lives and dies with this job.
      - name: Write .env.local
        env:
          # Identity for this run. Inert while SENTRY_DSN is unset, but cheap to
          # keep so re-adding a DSN gives usable events immediately. Quoted
          # through env: rather than interpolated into the heredoc so a branch
          # name cannot inject shell.
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
          DEPLOY_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          GITHUB_APP_ID=1
          GITHUB_OAUTH_CLIENT_ID=not-a-real-oauth-client-id
          GITHUB_OAUTH_CLIENT_SECRET=not-a-real-oauth-client-secret
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${LOCAL_SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${LOCAL_SUPABASE_ANON_KEY}
          SUPABASE_URL=${LOCAL_SUPABASE_URL}
          SUPABASE_ANON_KEY=${LOCAL_SUPABASE_ANON_KEY}
          SUPABASE_SERVICE_ROLE_KEY=${LOCAL_SUPABASE_SERVICE_ROLE_KEY}
          ENABLE_SIGNUPS=true
          NEXT_PUBLIC_PAWTOGRADER_WEB_URL=http://localhost:3001
          E2E_ENABLE=true
          # Explicit, because getExamVisionProvider now fails closed on an unset value: it used
          # to default to 'fake', which meant a real deployment silently produced placeholder
          # OCR that reported success. The exam e2e suites need the offline provider.
          EXAM_VISION_PROVIDER=fake
          # E2E_ENABLE only opens the edge functions' auth bypass. The GitHub
          # bypass is a separate flag: without it, isE2ERun still falls through
          # to cloneRepository -> getOctoKit and issues a real GitHub request,
          # which the dummy App credentials below cannot satisfy. The suites
          # that ingest submissions or webhooks (push-no-autograder,
          # pr-webhook-ingest, pr-base-tree-cache) are written for this path and
          # assert against the canned file it inserts.
          E2E_MOCK_GITHUB=true
          END_TO_END_SECRET=not-a-secret
          EDGE_FUNCTION_SECRET=some-secret-value
          # Auth gate for the github-repo-webhook EventBridge envelope. Lets the
          # webhook-direct e2e (push-no-autograder, pr-webhook-ingest) authenticate
          # and run in CI; no real GitHub (see E2E_MOCK_GITHUB above).
          EVENTBRIDGE_SECRET=some-eventbridge-secret
          GITHUB_APP_ID=${GITHUB_APP_ID}
          GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID}
          GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET}
          DEPLOY_KIND=e2e-local
          DEPLOY_BRANCH=${DEPLOY_BRANCH}
          DEPLOY_PR=${DEPLOY_PR}
          DEPLOY_RUN_ID=${GITHUB_RUN_ID}
          DEPLOY_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}
          GIT_COMMIT_SHA=${GITHUB_SHA}
          # Discord. Every REST call is redirected at the mock started below, so
          # nothing in this job can reach discord.com. `discord-mock` is a
          # container on the Supabase Docker network, so this hostname resolves
          # via Docker DNS from inside the Edge Functions runtime -- which is the
          # only consumer that has to resolve it. Host-side test code uses the
          # published port via DISCORD_MOCK_URL instead.
          #
          # The bot token and application id only have to be non-empty: the mock
          # does not check them, but the functions refuse to start a Discord call
          # without them, and a missing DISCORD_APPLICATION_ID makes
          # discord-check-bot-installation 500 rather than skip.
          DISCORD_API_BASE_URL=http://discord-mock:8788/api/v10
          DISCORD_MOCK_URL=http://127.0.0.1:8788
          DISCORD_BOT_TOKEN=mock-bot-token
          DISCORD_APPLICATION_ID=100000000000000001
          # The install callback redeems the OAuth authorization code to learn which
          # guild was actually authorized. The mock does not verify the secret, but
          # both values must be present or the exchange is skipped as unconfigured.
          DISCORD_OAUTH_CLIENT_ID=100000000000000001
          DISCORD_OAUTH_CLIENT_SECRET=mock-client-secret
          EOF
          # Throwaway App key, generated per run and never leaving the runner.
          # @octokit/auth-app parses it lazily, so it only has to be a
          # well-formed PKCS#8 RSA key for `new App(...)` in GitHubWrapper.ts to
          # construct; nothing in the suite signs a JWT that GitHub will see.
          mkdir -p "$RUN_TMP"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$RUN_TMP/dummy-app-key.pem" 2>/dev/null
          # Single-line escaped PEM — supabase functions serve --env-file does
          # not support multi-line quoted values; .env.local.staging uses the
          # same shape. The Octokit / GitHub-App SDK unescapes \n at runtime.
          KEY_ESCAPED=$(awk 'BEGIN{ORS=""} {printf "%s\\n", $0}' "$RUN_TMP/dummy-app-key.pem")
          printf 'GITHUB_PRIVATE_KEY_STRING="%s"\n' "$KEY_ESCAPED" >> .env.local

      # Make supabase/config.toml's project_id unique per run so the supabase
      # CLI tags its containers and volumes with our SUPABASE_PROJECT, not the
      # repo-default `pawtograder-platform`. Without this, two concurrent runs
      # would mutually clobber each other's stack.
      - name: Pin supabase project_id per run
        run: |
          set -euo pipefail
          sed -i.bak -E "s|^project_id = .*$|project_id = \"${SUPABASE_PROJECT}\"|" supabase/config.toml
          grep "^project_id" supabase/config.toml

      # Kick Supabase off in the background so its container pulls + migration
      # run overlap with `next build` and `playwright install`.
      - name: Start local Supabase (background, fresh)
        run: |
          set -euo pipefail
          mkdir -p "$RUN_TMP"
          rm -f "$RUN_TMP/supabase-start.exitcode"

          # `supabase start` occasionally races its own internal stop/restart and
          # dies with "failed to bind host port 0.0.0.0:54322/tcp: address already
          # in use" — a container from the in-progress attempt hasn't released the
          # fixed port before the next bind. Reset this run's containers/volumes and
          # retry. The reset is scoped to SUPABASE_PROJECT (unique per run_id +
          # attempt), so concurrent jobs sharing the runner pool are never touched.
          # Backgrounded so the container pulls + migrations overlap with the build.
          nohup bash -c '
            set -uo pipefail
            reset_supabase() {
              npx supabase stop --no-backup >/dev/null 2>&1 || true
              docker ps -aq --filter "label=com.supabase.cli.project=${SUPABASE_PROJECT}" \
                | xargs -r docker rm -f >/dev/null 2>&1 || true
              docker volume ls --filter "label=com.supabase.cli.project=${SUPABASE_PROJECT}" -q \
                | xargs -r docker volume rm >/dev/null 2>&1 || true
            }
            reset_supabase
            for attempt in $(seq 1 5); do
              echo "=== supabase start attempt ${attempt}/5 ==="
              # Exclude analytics (Logflare) + vector: the tests do not use the
              # logs UI, and these two containers are flaky to bring up healthy on
              # CI runners — they intermittently report "unhealthy" and fail the
              # whole start (and thus every retry). Skipping them keeps the schema,
              # auth, storage, realtime, and edge-runtime services the suite needs.
              if npx supabase start -x analytics,vector; then
                echo 0 > "${RUN_TMP}/supabase-start.exitcode"
                exit 0
              fi
              echo "supabase start failed on attempt ${attempt}; resetting and retrying"
              reset_supabase
              sleep $((attempt * 3))
            done
            echo 1 > "${RUN_TMP}/supabase-start.exitcode"
            exit 1
          ' > "$RUN_TMP/supabase-start.log" 2>&1 &
          echo $! > "$RUN_TMP/supabase-start.pid"

      # Background the browser install (~30-90s, mostly downloads + apt-get).
      - name: Install Playwright Browsers (background)
        run: |
          set -euo pipefail
          rm -f $RUN_TMP/playwright-install.exitcode
          nohup bash -c 'npx playwright install --with-deps \
            > $RUN_TMP/playwright-install.log 2>&1; \
            echo $? > $RUN_TMP/playwright-install.exitcode' &

      - name: Build Next.js (prod, port 3001)
        env:
          NEXT_PUBLIC_PAWTOGRADER_WEB_URL: http://localhost:3001
        run: npm run build

      - name: Wait for Playwright install
        run: |
          set -euo pipefail
          for i in $(seq 1 600); do
            [ -f $RUN_TMP/playwright-install.exitcode ] && break
            sleep 1
          done
          rc="$(cat $RUN_TMP/playwright-install.exitcode 2>/dev/null || echo 'timeout')"
          if [ "$rc" != "0" ]; then
            echo "playwright install failed (rc=$rc)"
            echo '--- playwright-install.log ---'
            cat $RUN_TMP/playwright-install.log || true
            exit 1
          fi

      - name: Wait for Supabase + finalize schema
        run: |
          set -euo pipefail
          # Poll the API until it answers. The background launcher retries
          # `supabase start` (with a reset between attempts) and writes its final
          # status to supabase-start.exitcode; if that lands non-zero, all retries
          # were exhausted, so fail fast with the log instead of polling for the
          # full timeout.
          for i in $(seq 1 600); do
            if curl -sf -o /dev/null \
                 -H "apikey: ${LOCAL_SUPABASE_ANON_KEY}" \
                 "${LOCAL_SUPABASE_URL}/rest/v1/"; then
              break
            fi
            if [ -f "$RUN_TMP/supabase-start.exitcode" ] \
               && [ "$(cat "$RUN_TMP/supabase-start.exitcode")" != "0" ]; then
              echo 'supabase start exhausted its retries and never came up'
              echo '--- supabase-start.log ---'
              cat "$RUN_TMP/supabase-start.log" || true
              exit 1
            fi
            sleep 1
          done
          # Final readiness check — fail loudly if we fell out of the loop.
          curl -sf -o /dev/null \
            -H "apikey: ${LOCAL_SUPABASE_ANON_KEY}" \
            "${LOCAL_SUPABASE_URL}/rest/v1/"

          # Ephemeral CI Postgres — trade durability for speed. The volume is
          # destroyed at job end, so fsync/full_page_writes give us nothing.
          # synchronous_commit is SIGHUP-reloadable; fsync, full_page_writes,
          # and shared_buffers require a restart (done below).
          # Notes on the psql invocation:
          #   * Each ALTER SYSTEM must run outside a transaction block, so use
          #     one -c flag per statement — `psql -c "a;b;c"` wraps multi-
          #     statement input in an implicit transaction and would fail.
          #   * Connect as supabase_admin (the actual superuser) — the
          #     `postgres` role on supabase-local is not superuser and gets
          #     `permission denied to set parameter` on ALTER SYSTEM.
          #   * Use -h 127.0.0.1 so pg_hba.conf's `host ... 127.0.0.1 trust`
          #     rule applies; the unix-socket rule requires scram-sha-256.
          docker exec -i "supabase_db_${SUPABASE_PROJECT}" \
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U supabase_admin -d postgres \
              -c "ALTER SYSTEM SET synchronous_commit = off" \
              -c "ALTER SYSTEM SET fsync = off" \
              -c "ALTER SYSTEM SET full_page_writes = off" \
              -c "ALTER SYSTEM SET shared_buffers = '512MB'" \
              -c "ALTER SYSTEM SET work_mem = '32MB'" \
              -c "ALTER SYSTEM SET maintenance_work_mem = '256MB'" \
              -c "ALTER SYSTEM SET autovacuum = off"
          docker restart "supabase_db_${SUPABASE_PROJECT}"

          # Re-wait for REST after the db bounce — PostgREST reconnects lazily
          # but Kong returns 5xx until the upstream is healthy again.
          for i in $(seq 1 120); do
            if curl -sf -o /dev/null \
                 -H "apikey: ${LOCAL_SUPABASE_ANON_KEY}" \
                 "${LOCAL_SUPABASE_URL}/rest/v1/"; then
              break
            fi
            sleep 1
          done
          curl -sf -o /dev/null \
            -H "apikey: ${LOCAL_SUPABASE_ANON_KEY}" \
            "${LOCAL_SUPABASE_URL}/rest/v1/"

          # Audit table is partitioned; seed today's partition (and the next 7 days).
          docker exec -i "supabase_db_${SUPABASE_PROJECT}" psql -U postgres -d postgres -c \
            "SELECT public.audit_maintain_partitions();"

      # Jest integration tests that hit the local Supabase API directly
      # (no Next.js / edge-functions needed). Convention: files named
      # tests/unit/issue*.test.ts gate on RUN_SUPABASE_INTEGRATION_TESTS=true
      # and self-skip otherwise — set the env var here so they actually run.
      - name: Run Jest integration tests
        env:
          SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.LOCAL_SUPABASE_SERVICE_ROLE_KEY }}
          RUN_SUPABASE_INTEGRATION_TESTS: "true"
        run: npx jest --runInBand --testPathPatterns "tests/unit/issue"

      - name: Serve Edge Functions
        run: |
          set -euo pipefail
          nohup npx supabase functions serve --env-file .env.local \
            > $RUN_TMP/edge-functions.log 2>&1 &
          echo $! > $RUN_TMP/edge-functions.pid
          # Wait until the gateway answers. `curl -s -w %{http_code}` prints
          # `000` on connect-refused, so check the exit status (or filter
          # `000`) — otherwise the loop breaks on the first tick.
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/functions/v1/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "Edge Functions never became reachable"
            tail -n 200 $RUN_TMP/edge-functions.log || true
            exit 1
          fi

      - name: Start Next.js prod server
        run: |
          set -euo pipefail
          # CSP is served in report-only mode for E2E so Playwright's
          # page.evaluate / waitForFunction (string-eval via CDP) is not
          # blocked by `script-src` strict-dynamic. The header is still
          # emitted, so tests can still assert its shape; enforcement
          # ships in prod via the default `Content-Security-Policy`.
          nohup env PORT=3001 CSP_REPORT_ONLY=1 npm run start > $RUN_TMP/next-server.log 2>&1 &
          echo $! > $RUN_TMP/next-server.pid
          ready=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3001/; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "Next.js prod server never became reachable"
            tail -n 200 $RUN_TMP/next-server.log || true
            exit 1
          fi

      # Must come after `supabase start`: the mock joins the Supabase Docker
      # network so the Edge Functions runtime can resolve `discord-mock`, and
      # that network does not exist until the stack is up.
      #
      # Without this step the Discord specs skip rather than fail -- they check
      # that the mock is reachable and that DISCORD_API_BASE_URL points at it, so
      # that a developer who has not started it gets a skip instead of a run
      # against real Discord. That is the right default locally and the wrong one
      # here, where a silent skip would report coverage this job never executed.
      - name: Start the mocked Discord API
        run: |
          set -euo pipefail
          ./scripts/start-discord-mock.sh
          # Prove it before the suite runs, so a failure here is attributed to
          # the mock rather than surfacing as 136 skipped tests.
          curl -sf http://127.0.0.1:8788/__mock/health

      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost:3001
          # A skipped Discord spec here would report coverage that never ran, which is exactly how
          # `e2e-local` went green with 136 of them silently skipped. With this set they fail instead.
          DISCORD_MOCK_REQUIRED: "1"
          SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.LOCAL_SUPABASE_SERVICE_ROLE_KEY }}
          # EDGE_FUNCTION_SECRET / END_TO_END_SECRET are sourced from .env.local
          # (written above) via the test-runner's dotenv load — single source
          # of truth so the two values can't drift.
          #
          # TEST_PASSWORD is gone: every call site already falls back to
          # "change-it", which is what the seeder writes, so the secret was only
          # ever restating the default.
          #
          # ARGOS_TOKEN is the one secret this job still takes. Visual
          # regression is worth keeping, and check-trust above means only a
          # trusted ref ever reaches this step, so the token is not exposed to
          # fork-supplied code the way the GitHub App key was. It is also the
          # mildest thing in the old set: scoped to one visual-testing project,
          # with no reach into GitHub, Redis, or any student repo.
          #
          # It has to be passed explicitly here. Argos can authenticate
          # tokenlessly on GitHub Actions via OIDC -- which is how
          # playwright-standalone.yml uploads without a token -- but that needs
          # `id-token: write`, and this job deliberately holds only
          # `contents: read`.
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
        run: npx playwright test

      - name: Tail server logs on failure
        if: failure()
        run: |
          echo '--- edge-functions.log ---'; tail -n 500 $RUN_TMP/edge-functions.log || true
          echo '--- next-server.log ---';    tail -n 500 $RUN_TMP/next-server.log || true
          echo '--- discord-mock ---';       docker logs discord-mock 2>&1 | tail -n 200 || true

      - name: Stop background services
        if: always()
        run: |
          kill "$(cat $RUN_TMP/edge-functions.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat $RUN_TMP/next-server.pid 2>/dev/null)" 2>/dev/null || true
          # Capture full Supabase container logs while the stack is still up.
          mkdir -p server-logs
          for c in $(docker ps --filter "label=com.supabase.cli.project=${SUPABASE_PROJECT}" --format '{{.Names}}'); do
            docker logs "$c" > "server-logs/${c}.log" 2>&1 || true
          done
          docker logs discord-mock > server-logs/discord-mock.log 2>&1 || true
          # This runner is self-hosted and /tmp persists, so a leaked container
          # would hold port 8788 and stay joined to a Supabase network that the
          # `supabase stop` below is about to delete.
          ./scripts/start-discord-mock.sh --stop || true
          cp -f $RUN_TMP/edge-functions.log server-logs/edge-functions.log 2>/dev/null || true
          cp -f $RUN_TMP/next-server.log    server-logs/next-server.log    2>/dev/null || true
          npx supabase stop --no-backup || true

      - name: Upload server logs
        # Use always() (not !cancelled()) so timeout-cancelled runs — exactly
        # the case where these logs are most useful — still upload.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: server-logs/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
