name: Trust gate

# Single source of truth for two questions:
#   1. may this ref execute on our self-hosted pools?          -> `trusted`
#   2. ...and, for the preview lane, was a deploy asked for?    -> `approved`
#
# Called by lint.yml, deploy.yml and preview.yml so the three lanes cannot
# drift apart. They had already drifted: deploy.yml carried ~40 lines of
# reasoning about keeping fork code off the self-hosted pool, while lint.yml
# ran every fork PR on pawtograder-ci — same cluster, same ARC pool, with the
# in-cluster registry credential seeded into the runner's docker config. The
# careful gate and the open door were in the same repo.
#
# WHY EVERY CALLER MUST USE pull_request_target
# ---------------------------------------------
# Under `pull_request`, GitHub runs the workflow *file* from the PR head, so a
# fork can delete its own gate in the same commit it attacks. Under
# `pull_request_target` the workflow — and therefore this check — always comes
# from the base branch. The cost is that CI changes in a PR do not take effect
# until merged; that is the same property that makes the gate unbypassable.
#
# Callers must therefore set `ref:` on their checkout EXPLICITLY, to
# `${{ github.event.pull_request.head.sha || github.sha }}`. Under
# pull_request_target the default checkout is the base branch, which silently
# tests the wrong code rather than failing loudly.
#
# That expression is read inline at each call site rather than handed down as
# an output of this workflow. Routing it through a job output is equivalent —
# the event payload is immutable for the life of a run, so there is no
# check-then-use window to close — but it costs: CodeQL cannot see where an
# opaque `needs.*.outputs.*` value came from, so it taints every consuming
# checkout and reports actions/cache-poisoning and untrusted-checkout on paths
# that are not reachable. Inline keeps the provenance visible to the analysis.
#
# WHAT "trusted" MEANS
# --------------------
# Effective write permission on this repository, resolved live from the API.
#
# Deliberately NOT `author_association`: that describes the PR's author and
# their standing here, not whoever pushed the head commit that is about to be
# executed. Anyone with push access to the head branch can fire `synchronize`.
#
# Deliberately NOT "is an org member" either. On this org
# `default_repository_permission` is `none`, so plain membership grants nothing
# on this repo — as of writing, 7 of 15 members resolve to `read`, the same
# level a total stranger gets on a public repo. Membership is "did we ever add
# them"; write permission is "do we trust them now". Write arrives via the
# `pawtograder-contributors` team, so granting a student CI is a team addition
# and revoking it takes effect on their next push.
#
# For a fork PR we require write for EVERY principal we can identify:
#   * pull_request.user — the PR author; the only one of the three that is
#                         stable across every event on the PR
#   * head.repo.owner   — whoever owns the fork controls who may push to it
#                         (a personal fork only; see the principal list below)
#   * sender            — whoever fired this event (on `synchronize`, the
#                         pusher; on `labeled`, whoever added the label)
#
# Residual risk, accepted deliberately: a collaborator on a trusted user's
# personal fork can land code that runs here without holding write themselves.
# Closing that would mean refusing fork PRs altogether, which is the workflow
# we want for a large, mostly-trusted class.

on:
  workflow_call:
    inputs:
      require_label:
        description: >-
          When non-empty, `approved` additionally requires this label on the PR.
          Used by the preview lane so a full-stack namespace is never created
          unasked — trust decides who MAY deploy, the label decides who DID ask.
        required: false
        type: string
        default: ""
    secrets:
      trust_token:
        description: >-
          Optional escape hatch, not currently needed. A token with
          `Metadata: read` on this repo, used for the permission lookup
          instead of GITHUB_TOKEN.
          VERIFIED 2026-09-18: the built-in GITHUB_TOKEN *is* accepted by the
          collaborators endpoint from a job holding `contents/pull-requests/
          issues: read` — a probe run resolved a team member to `write`, a
          non-team org member to `read`, and a stranger to `read`. Wire this
          secret only if that ever regresses; the gate will say so via the
          "could not resolve" warning below.
        required: false
    outputs:
      trusted:
        description: "true when the head commit came from someone with write access here"
        value: ${{ jobs.gate.outputs.trusted }}
      approved:
        description: "trusted, AND (require_label empty OR that label is on the PR)"
        value: ${{ jobs.gate.outputs.approved }}

permissions: {}

jobs:
  gate:
    # `ubuntu-latest` and the absence of any `actions/checkout` are both
    # load-bearing. This job decides whether untrusted code may touch the
    # self-hosted pool, so it runs on an ephemeral GitHub-hosted VM with no PR
    # content on disk: there is no build, no lockfile, no config file and no
    # test source from the PR that could influence the decision. Never add a
    # checkout here, and never move it to pawtograder-ci.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      trusted: ${{ steps.trust.outputs.trusted }}
      approved: ${{ steps.approve.outputs.approved }}
    steps:
      - id: trust
        name: Resolve trust
        env:
          # Event fields go through env: rather than being interpolated into
          # the script. These are GitHub-controlled today, but a login is
          # attacker-chosen in the general case and the habit is what keeps a
          # future field from becoming a shell injection.
          GH_TOKEN: ${{ secrets.trust_token || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          # full_name, not the `fork` flag. `head.repo` is NULL in the
          # payload when the head repository has been deleted or is otherwise
          # unavailable, which made the old `fork != true` test read an empty
          # string and classify the PR as a same-repo branch — i.e. trusted.
          # The commit stays reachable through refs/pull/N/head, so a later
          # `reopened` or `labeled` event could then run fork-supplied code on
          # the self-hosted pool with neither principal checked. Identify the
          # head repo positively and treat absent metadata as untrusted.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          # "User" or "Organization". An organization has no collaborator
          # record on this repo — the permission endpoint returns `none` for
          # one, verified against the live API — so running the owner check on
          # an org-owned fork marked EVERY such PR untrusted regardless of who
          # pushed. Fails closed, so it was a usability bug rather than a hole,
          # but it silently excluded a legitimate contribution path.
          HEAD_OWNER_TYPE: ${{ github.event.pull_request.head.repo.owner.type }}
          SENDER: ${{ github.event.sender.login }}
          # Stable across every event on the PR, unlike `sender`. See the
          # principal list below for why that matters on org-owned forks.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # Resolve one login to write/no-write. Any API failure is a hard
          # "no" (fail closed) with an actionable warning, rather than a
          # silent pass.
          # Reads `.permission`, not `.role_name`. Per the REST docs the
          # legacy `permission` field collapses the granular roles onto
          # admin/write/read/none, "where the maintain role is mapped to write
          # and the triage role is mapped to read" — which is exactly the
          # predicate wanted here: write + maintain + admin pass, triage and
          # read do not. It also resolves a CUSTOM repository role to its base
          # role, whereas `role_name` returns the custom role's own name and
          # would silently drop such a contributor to untrusted. (Custom roles
          # are not available on this org's current plan, so that part is
          # future-proofing.) role_name is still logged, for diagnosis.
          has_write() {
            local user="$1" out perm role
            # One request, both fields. Fetching them in two calls doubled the
            # requests per principal for a log line.
            if ! out=$(gh api "repos/${REPO}/collaborators/${user}/permission" --jq '"\(.permission) \(.role_name)"' 2>/dev/null); then
              echo "::warning title=Trust check failed::Could not resolve repo permission for '${user}'. Treating this PR as untrusted. If the built-in GITHUB_TOKEN is not accepted by this endpoint, set a CI_TRUST_TOKEN secret (Metadata: read) and pass it as trust_token."
              return 1
            fi
            perm="${out%% *}"
            role="${out#* }"
            echo "  ${user}: permission=${perm} (role_name=${role})"
            case "$perm" in
              admin | write) return 0 ;;
              *) return 1 ;;
            esac
          }

          if [[ "$EVENT_NAME" != "pull_request_target" ]]; then
            # push to a protected branch, or a maintainer's manual dispatch:
            # both run from a ref that already required write access.
            trusted=true
            reason="event '${EVENT_NAME}' runs from a ref in ${REPO}"
          elif [[ -z "${HEAD_REPO:-}" ]]; then
            trusted=false
            reason="head repository metadata is absent (fork deleted or unavailable), so neither principal can be identified"
          elif [[ "$HEAD_REPO" == "$REPO" ]]; then
            trusted=true
            reason="head branch lives in ${REPO}, so pushing it already required write access"
          else
            # Check the fork owner and the event sender. Usually the same
            # person; dedupe so the common case is one API call.
            # The owner check exists because whoever owns a fork controls who
            # may push to it. That reasoning only holds for a PERSONAL fork:
            # for an org-owned one the owner is an org, "write access for an
            # organization" is not a thing this endpoint can answer, and the
            # equivalent question (who in that org can push) is not visible to
            # us at all. So for org-owned forks the owner is dropped from the
            # principal list and the PR author plus the sender carry it.
            #
            # The residual risk is the same shape as the one already accepted
            # for personal forks: another principal with push access to the
            # fork can merge code that runs here, just with a larger set
            # behind it. Worth knowing when adding org-owned forks.
            #
            # The PR AUTHOR is always a principal, and on an org-owned fork it
            # is the only one tied to the code. `sender` is the pusher on
            # `synchronize`, but on `reopened`, `labeled` and `unlabeled` it is
            # whoever performed that action, which is normally a maintainer.
            # Without the author, a maintainer adding the `preview` label to a
            # PR from a throwaway org-owned fork would resolve the gate against
            # the maintainer's own write access and run fork code here with no
            # check on who supplied it. Personal forks were already covered by
            # the head-owner check; this closes the org-owned path.
            principals=()
            [[ -n "${PR_AUTHOR:-}" ]] && principals+=("$PR_AUTHOR")
            if [[ "$HEAD_OWNER_TYPE" == "Organization" ]]; then
              echo "note: head repo is org-owned (${HEAD_OWNER}); checking the PR author and the sender"
            elif [[ -n "${HEAD_OWNER:-}" && "$HEAD_OWNER" != "${PR_AUTHOR:-}" ]]; then
              principals+=("$HEAD_OWNER")
            fi
            if [[ -n "${SENDER:-}" ]]; then
              already=false
              for p in ${principals[@]+"${principals[@]}"}; do
                [[ "$p" == "$SENDER" ]] && already=true && break
              done
              [[ "$already" == "true" ]] || principals+=("$SENDER")
            fi
            if [[ ${#principals[@]} -eq 0 ]]; then
              trusted=false
              reason="no identifiable principal on this fork PR"
              echo "trusted=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Untrusted ref::${reason}"
              exit 0
            fi
            echo "fork PR — checking write access for: ${principals[*]}"
            trusted=true
            reason="every identifiable principal on this fork PR has write on ${REPO}"
            for u in "${principals[@]}"; do
              if ! has_write "$u"; then
                trusted=false
                reason="'${u}' does not have write access to ${REPO}"
                break
              fi
            done
          fi

          echo "trusted=${trusted}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

          if [[ "$trusted" == "true" ]]; then
            echo "::notice title=Trusted::${reason}"
          else
            echo "::notice title=Untrusted ref::${reason}. Self-hosted lanes (lint, unit tests, E2E, preview) are skipped. To grant access, add the contributor to the pawtograder-contributors team; it takes effect on their next push."
          fi

      - id: approve
        name: Apply label requirement
        env:
          GH_TOKEN: ${{ secrets.trust_token || secrets.GITHUB_TOKEN }}
          TRUSTED: ${{ steps.trust.outputs.trusted }}
          REQUIRE_LABEL: ${{ inputs.require_label }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "$TRUSTED" != "true" ]]; then
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${REQUIRE_LABEL}" || -z "${PR_NUMBER:-}" ]]; then
            # No label requirement, or not a PR event (push / dispatch).
            echo "approved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Read labels from the API, not from the event payload: on a re-run
          # the payload is a snapshot from when the event fired, so a label
          # added afterwards would not be seen.
          if ! labels=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name' 2>/dev/null); then
            echo "::warning title=Label check failed::Could not list labels on PR #${PR_NUMBER}; treating the preview as not requested."
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Fxq -- "$REQUIRE_LABEL" <<<"$labels"; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Preview requested::label '${REQUIRE_LABEL}' is present"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No preview::Add the '${REQUIRE_LABEL}' label to this PR to deploy a preview environment."
          fi
