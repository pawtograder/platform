name: Lint
permissions:
  contents: read
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
jobs:
  lint:
    runs-on: pawtograder-ci
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node-22-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node-22-
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Run linting check
        run: npm run lint

  # Guard-rail render tests: assert templates/validations.yaml still REFUSES a
  # dangerous production values combination (e2e bypasses, plaintext/
  # non-recoverable secrets, seeding, resetOnDrift, floating image tags,
  # unauthenticated Studio). See charts/pawtograder/PRODUCTION-READINESS.md §4.
  chart-guardrails:
    runs-on: pawtograder-ci
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.20.2
      - name: Run chart guard-rail render tests
        run: charts/pawtograder/tests/render-guardrails.sh

  # Alert-rule tests. `promtool check rules` is syntax only, and every alert this
  # chart ships already passes it — including, before this job existed, ones that
  # were permanently inert. `promtool test rules` is the only check that runs the
  # expressions against series and asserts on what fires and when, which is what
  # the worker-tier rules' `or absent(...)` and `(... or vector(0)) == 0` arms
  # need: both are silent-by-default shapes where the failure mode is "never
  # fires" rather than "fails to parse". See charts/pawtograder/tests/alert-rules.sh.
  chart-alert-rules:
    runs-on: pawtograder-ci
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.20.2
      # promtool ships inside the Prometheus release tarball; there is no
      # first-party action for it. Pinned rather than `latest` so a Prometheus
      # release cannot change unit-test semantics under us on an unrelated push.
      #
      # Installed into RUNNER_TEMP and put on PATH via GITHUB_PATH rather than
      # into /usr/local/bin: the `pawtograder-ci` runner executes unprivileged
      # and the system path is not writable, so `install … /usr/local/bin` fails
      # with "Permission denied" before the tests ever run. RUNNER_TEMP is
      # per-job and cleaned up by the runner, so nothing leaks between jobs.
      # There is no sudo here and none is wanted.
      - name: Install promtool
        env:
          # The fixtures were run green against this exact version and against
          # 2.53.3, so the suite is not relying on a behaviour specific to either.
          PROM_VERSION: "3.14.0"
          # SHA-256 of prometheus-3.14.0.linux-amd64.tar.gz, pinned because this
          # job downloads a tarball over the network and then EXECUTES what comes
          # out of it, on a self-hosted runner, in a repo where every other
          # toolchain arrives through a pinned action. Without this the version
          # check below is the only gate, and a version string is something the
          # artifact asserts about itself.
          #
          # Established from three independent sources that agree, 2026-09-02:
          #   1. the release's own sha256sums.txt
          #      (github.com/prometheus/prometheus/releases/download/v3.14.0/)
          #   2. GitHub's asset `digest` field from the releases API, which GitHub
          #      computes server-side from the stored blob rather than reading the
          #      publisher's checksum file
          #   3. sha256sum of a locally downloaded copy
          # Bump this WITH PROM_VERSION -- a stale digest fails the job loudly,
          # which is the intended failure mode and not a reason to delete it.
          PROM_SHA256: "f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/promtool-bin"
          # BOUNDED. `curl -fsSL` with no timeouts will sit on a half-open
          # connection indefinitely, and this runner is `pawtograder-ci` -- a
          # single self-hosted pool, so one stalled GitHub endpoint parks a runner
          # slot until the workflow timeout and every other job queues behind it.
          # --connect-timeout bounds the handshake, --max-time bounds each whole
          # attempt (the tarball is ~102MiB, so 180s is generous rather than
          # tight), and the retries are capped so the worst case is ~9m and
          # arithmetic rather than "until something gives up".
          curl -fsSL \
            --connect-timeout 10 --max-time 180 \
            --retry 3 --retry-delay 5 --retry-connrefused \
            -o "$RUNNER_TEMP/prom.tar.gz" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          # Verify BEFORE extracting, not after: a tar of a hostile archive is
          # itself the exposure, so the digest has to gate the extraction rather
          # than the execution. `sha256sum -c` prints "FAILED" and exits non-zero
          # on a mismatch, and the extra echo is there so the reason is in the log
          # at the point of failure instead of only in the exit status.
          echo "${PROM_SHA256}  ${RUNNER_TEMP}/prom.tar.gz" | sha256sum -c - \
            || { echo "::error::promtool tarball digest does not match the pinned PROM_SHA256 -- refusing to extract"; exit 1; }
          tar -xzf "$RUNNER_TEMP/prom.tar.gz" -C "$RUNNER_TEMP" \
            "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          install -m 0755 \
            "$RUNNER_TEMP/prometheus-${PROM_VERSION}.linux-amd64/promtool" \
            "$RUNNER_TEMP/promtool-bin/promtool"
          echo "$RUNNER_TEMP/promtool-bin" >>"$GITHUB_PATH"
          # Assert the pin landed. alert-rules.sh hard-fails when promtool is
          # absent from PATH, so a broken install can never silently skip the
          # suite -- but check here too, because GITHUB_PATH only takes effect
          # in LATER steps and this is the last chance to fail on the version.
          "$RUNNER_TEMP/promtool-bin/promtool" --version
          "$RUNNER_TEMP/promtool-bin/promtool" --version 2>&1 \
            | grep -qF "$PROM_VERSION" \
            || { echo "promtool is not the pinned ${PROM_VERSION}"; exit 1; }
      - name: Run chart alert-rule tests
        run: charts/pawtograder/tests/alert-rules.sh

  # Fast, deterministic unit tests for the gradebook recalc computation (the math the
  # gradebook-calculations e2e fixtures exercise end-to-end through the async pipeline).
  # These run the real edge-function expression functions directly — no DB, no pipeline.
  deno-unit-tests:
    runs-on: pawtograder-ci
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Deno unit tests
        run: npm run test:functions
