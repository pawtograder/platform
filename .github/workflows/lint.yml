name: Lint
permissions:
  contents: read
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
jobs:
  lint:
    runs-on: pawtograder-ci
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node-22-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node-22-
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Run linting check
        run: npm run lint

  # Fast, deterministic unit tests for the gradebook recalc computation (the math the
  # gradebook-calculations e2e fixtures exercise end-to-end through the async pipeline).
  # These run the real edge-function expression functions directly — no DB, no pipeline.
  deno-unit-tests:
    runs-on: pawtograder-ci
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Deno unit tests
        run: npm run test:functions
      # test:functions runs with --no-check (the generated _shared/SupabaseTypes.d.ts carries a
      # long-standing illegal ambient `export const Constants`, which cannot be hand-edited and is
      # regenerated from the schema). Without this step, type errors in the release-aware expression
      # code (is_released / assignment_released / DependencySource) would be caught nowhere in CI.
      # Run a real type-check and fail on any error whose location is NOT that one generated file.
      - name: Type-check Deno expression functions
        working-directory: supabase/functions/gradebook-column-recalculate
        run: |
          output="$(deno check **/*.ts 2>&1 || true)"
          echo "$output"
          # Every Deno type error prints an "at <file>:line:col" location line. Keep only those that
          # point somewhere other than the known-bad generated SupabaseTypes.d.ts.
          real_errors="$(printf '%s\n' "$output" | grep -E '^\s*at .+:[0-9]+:[0-9]+' | grep -v 'SupabaseTypes.d.ts' || true)"
          if [ -n "$real_errors" ]; then
            echo "::error::Deno type errors found in expression functions (excluding the known generated-file issue):"
            printf '%s\n' "$real_errors"
            exit 1
          fi
