name: Forgejo/Coder SSO E2E

# Manual dispatch only: it runs the branch's code with repo secrets.
on:
  workflow_dispatch:

concurrency:
  group: forgejo-coder-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  forgejo-coder-e2e:
    runs-on: pawtograder-e2e
    timeout-minutes: 45
    env:
      CI: "true"
      ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keep in sync with deploy.yml: the CLI pins the GoTrue under test.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Ensure docker compose v2
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            mkdir -p "$HOME/.docker/cli-plugins"
            curl -fsSL "https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-$(uname -m)" \
              -o "$HOME/.docker/cli-plugins/docker-compose"
            chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          fi
          docker compose version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Forgejo/Coder SSO E2E suite
        run: npm run test:e2e:forgejo-coder

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-forgejo-coder
          path: |
            playwright-report-forgejo-coder/
            tests/e2e/forgejo-coder/.logs/
          retention-days: 30
