name: Report unmask review

# ADR 6 of the bug reporter: a component unmasks text in bug-report recordings only by carrying
# `data-report-unmask`, and any diff that adds that attribute needs sign-off from the unmask owners.
#
# CODEOWNERS matches paths, not content, so it cannot express "any line adding this attribute".
# Instead this workflow reads the PR's diff through the API and, when an added line contains
# `data-report-unmask`, runs a job in the `report-unmask-review` environment. That environment's
# required reviewers (repository settings, Environments) are the unmask owners, so the job waits
# until one of them approves it ("Review deployments" on the PR), the same mechanism `_trust-gate.yml`
# uses for `ci-approval`. An approval covers the head SHA in the event payload; every new push
# starts a new run that must be approved again. Rejecting it fails the check.
#
# HUMAN SETUP (not done by this file):
#   1. Create the `report-unmask-review` environment and set its required reviewers to the unmask
#      owners team. Until then the environment is created on first use with no reviewers, and the
#      approval job passes without waiting.
#   2. Make `Report unmask review / owner-approval` a required status check on staging and main. A
#      skipped job (no added attribute) reports success, which is the intended pass.
#
# pull_request_target, for the reason lint.yml gives: the workflow file comes from the default
# branch, so a PR cannot edit this check away in the same commit that adds the attribute. Nothing
# here checks out or runs PR code; the diff is read as data through the REST API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: report-unmask-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      found: ${{ steps.scan.outputs.found }}
    steps:
      - id: scan
        name: Look for added data-report-unmask lines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # One line per file: <added matching lines, or -1 when the API gives no patch> TAB <path>.
          # The API omits `patch` for binary files and for diffs too large to inline; a text source
          # file without a patch cannot be checked, so it counts as a hit rather than a pass.
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" --jq '
            .[] | select(.status != "removed") |
            (if .patch == null then -1
             else ([.patch | split("\n")[] | select(startswith("+") and contains("data-report-unmask"))] | length)
             end) as $n | "\($n)\t\(.filename)"' > files.tsv
          total=$(wc -l < files.tsv)
          hits=$(awk -F'\t' '$1 > 0' files.tsv)
          unchecked=$(awk -F'\t' '$1 == -1 && $2 ~ /\.(tsx?|jsx?|mjs|cjs|html?|mdx?|svg)$/' files.tsv)
          found=false
          if [[ -n "$hits" ]]; then
            found=true
            while IFS=$'\t' read -r n f; do
              echo "::warning file=${f},title=data-report-unmask added::${n} added line(s) contain data-report-unmask; an unmask owner must approve (ADR 6)."
            done <<< "$hits"
          fi
          if [[ -n "$unchecked" ]]; then
            found=true
            while IFS=$'\t' read -r _ f; do
              echo "::warning file=${f},title=Diff not inspectable::GitHub returned no patch for this file, so it may add data-report-unmask; an unmask owner must approve."
            done <<< "$unchecked"
          fi
          # The files endpoint lists at most 3000 files; beyond that the scan is incomplete.
          if (( total >= 3000 )); then
            found=true
            echo "::warning title=Diff truncated::This PR changes 3000 or more files, more than the API lists, so the scan is incomplete; an unmask owner must approve."
          fi
          echo "found=${found}" >> "$GITHUB_OUTPUT"
          echo "found=${found} (${total} files scanned)"

  owner-approval:
    needs: detect
    # Skipped (reported as success) when nothing adds the attribute. `!cancelled()` plus the
    # explicit result test so that a detect job that FAILED leaves this red instead of skipped.
    if: ${{ !cancelled() && (needs.detect.result != 'success' || needs.detect.outputs.found == 'true') }}
    runs-on: ubuntu-latest
    environment: report-unmask-review
    permissions: {}
    steps:
      - name: Require a successful scan
        if: ${{ needs.detect.result != 'success' }}
        run: |
          echo "::error title=Unmask scan failed::The diff scan did not finish, so it is unknown whether this PR adds data-report-unmask. Re-run the workflow."
          exit 1
      - name: Unmask owner approved
        run: echo "An unmask owner approved this run for ${{ github.event.pull_request.head.sha }}."
