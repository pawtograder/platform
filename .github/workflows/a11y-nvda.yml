# Real-AT accessibility lane (Windows): replays the promoted SR task plans
# (tests/e2e/a11y-tasks/) through REAL NVDA + REAL Chromium against a PR's
# deploy preview. The Windows counterpart of a11y-voiceover.yml; complements the
# Linux virtual-screen-reader lane (npm run a11y:tasks).
#
# Manually dispatched only: the runner is a single out-of-cluster Windows VM
# (labels self-hosted/Windows/nvda — setup + the localtime/foreground/firewall
# gotchas: ops/ripley-cluster.md → Windows screen-reader runner). It drives
# Chromium+NVDA against the remote preview and pulls the preview's e2e env from
# OpenBao, where preview.yml's secrets job published it.
name: a11y NVDA (real Chromium)

on:
  workflow_dispatch:
    inputs:
      preview_id:
        description: PR number of a deployed preview (pr-<id>.preview.pawtograder.net)
        required: true
      task_filter:
        description: substring filter on pageId__taskId (empty = all promoted tasks)
        required: false
        default: ""
      record:
        description: capture per-task screen recordings (.mp4 artifacts; needs ffmpeg)
        type: boolean
        default: true
      calibrate:
        description: calibration mode — log VSR→NVDA phrasing drift instead of failing on milestones
        type: boolean
        default: false

permissions:
  contents: read

# One Windows box, one interactive NVDA session: queue dispatches, never kill a
# run mid-flight (an interrupted NVDA session can wedge the desktop's AT state).
concurrency:
  group: a11y-nvda-win
  cancel-in-progress: false

jobs:
  nvda:
    runs-on: [self-hosted, Windows, nvda]
    timeout-minutes: 120
    env:
      BASE_URL: https://pr-${{ inputs.preview_id }}.preview.pawtograder.net
      SUPABASE_URL: https://pr-${{ inputs.preview_id }}-api.preview.pawtograder.net
      BAO_ADDR: ${{ vars.BAO_ADDR }}
      PREVIEW_ID: ${{ inputs.preview_id }}
      TASK_FILTER: ${{ inputs.task_filter }}
    steps:
      - name: Validate preview id
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PREVIEW_ID" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]{0,38}$ ]]; then
            echo "::error::invalid preview_id '$PREVIEW_ID'"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Preflight (NVDA / Chromium / clipboard / OpenBao)
        run: npm run a11y:nvda:doctor

      - name: Run NVDA replay suite
        shell: bash
        env:
          A11Y_NVDA_RUN_ID: pr-${{ inputs.preview_id }}-run-${{ github.run_id }}
        run: |
          set -euo pipefail
          eval "$(./scripts/export-preview-e2e-from-bao.sh "$PREVIEW_ID" --shell)"
          flags=(--filter "$TASK_FILTER")
          if ${{ inputs.record }}; then flags+=(--record); fi
          if ${{ inputs.calibrate }}; then flags+=(--calibrate); fi
          npm run a11y:nvda -- "${flags[@]}"

      - name: Upload artifacts (spoken logs, junit, recordings)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: a11y-nvda-pr-${{ inputs.preview_id }}
          path: a11y-nvda-artifacts/
          retention-days: 30
          if-no-files-found: warn
