name: Deploy preview

# Per-PR ephemeral previews of the full pawtograder stack on ripley.
#
# Trigger model (all PR events are pull_request_target — see below):
#   PR labelled `preview`                 → build + deploy preview, comment URL
#   PR sync/reopen WHILE labelled         → rebuild the preview
#   PR label `preview` removed            → tear down preview
#   PR closed                             → tear down preview
#   workflow_dispatch (action=deploy)     → same as labelled, with manual preview_id
#   workflow_dispatch (action=destroy)    → manual teardown
#
# Previews are opt-in by label, not automatic. Two reasons: a full-stack
# namespace per open PR is real pressure on ripley once the contributor pool is
# class-sized, and the deploy path is the one lane that holds cluster
# credentials, so it should not be the default path for every push.
#
# Trust vs. intent are separate gates and both must pass:
#   trust  — does the pusher hold write access here (see _trust-gate.yml)
#   intent — is the `preview` label on the PR
#
# Cluster access: provided via KUBECONFIG_BASE64 repo secret (base64 of a
# kubeconfig that can helm install + create namespaces in
# pawtograder-preview-*). The deploy step uses helm directly against the
# chart in this checkout — no OCI publish step required for previews.
#
# Image storage: ghcr.io/pawtograder/{web,edge-functions,migrations}:pr-${id}-${sha}.
# Ephemeral; cleanup of old tags is out of scope here (use a periodic
# package-cleanup workflow if image bloat becomes a problem).

on:
  # pull_request_target, NOT pull_request, and this is what makes fork previews
  # possible at all. Under `pull_request` a fork PR gets no secrets and a
  # read-only token, so the `secrets` job below died on an empty
  # KUBECONFIG_BASE64 and the comment step could not even say why — every fork
  # PR showed a red "Deploy preview" check its author could not fix.
  # `pull_request_target` runs in base context, so the secrets exist, the
  # workflow file (and therefore the gate) comes from the base branch, and a
  # fork cannot edit its way past it.
  #
  # The flip side: PR-supplied code is built and deployed by jobs that hold
  # cluster credentials. That is only acceptable behind the gate, which is why
  # every job below is conditioned on `needs.gate.outputs.approved`.
  #
  # `labeled`/`unlabeled` own the namespace lifecycle alongside `closed`.
  pull_request_target:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]
  # For a one-off branch deploy without a PR, use workflow_dispatch with
  # action=deploy (don't add a push trigger — it would race the synchronize
  # event and deploy two near-identical previews from one SHA).
  workflow_dispatch:
    inputs:
      preview_id:
        description: "Preview id (URL suffix: pr-<id>.preview.pawtograder.net). Use the PR number, or any safe slug."
        required: true
      action:
        description: deploy or destroy
        required: true
        type: choice
        options: [deploy, destroy]
        default: deploy

permissions:
  contents: read
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}
  PREVIEW_DOMAIN: preview.pawtograder.net
  # The label that opts a PR into a preview. Must match the `require_label`
  # passed to the gate above.
  PREVIEW_LABEL: preview
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  # Adding or removing an UNRELATED label now fires this workflow (the trigger
  # list gained labeled/unlabeled), and with cancel-in-progress a run in the
  # same group kills the one before it. Such a run resolves to mode=noop and
  # schedules nothing, so left in the main group it would cancel an in-flight
  # helm upgrade and leave the release half-applied with no successor to
  # finish it — the "Recover stuck helm release" step only runs on a
  # subsequent deploy, which may never come. Give those runs their own group.
  #
  # Label events for PREVIEW_LABEL itself deliberately stay in the main group:
  # labeling is a deploy and unlabeling is a teardown, and both SHOULD
  # supersede a running deploy. (The literal is repeated here because the
  # `env` context is not available to `concurrency`; keep it in sync with
  # PREVIEW_LABEL and the gate's require_label.)
  group: preview-${{ github.event.pull_request.number || inputs.preview_id || github.ref_name }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'preview' && '-labelnoop' || '' }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # gate — may this ref reach the cluster, and was a preview actually asked
  # for? Shared with lint.yml and deploy.yml; see _trust-gate.yml.
  # --------------------------------------------------------------------------
  gate:
    # Granted explicitly: a reusable workflow can only intersect with the
    # caller's token, never elevate, and this workflow's top-level grant
    # includes writes the gate must not inherit.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: ./.github/workflows/_trust-gate.yml
    with:
      # Literal rather than an env var: the `env` context is not available in
      # a reusable-workflow `with:` block. Keep in sync with PREVIEW_LABEL
      # below, which the meta job uses for the same label.
      require_label: preview

  # --------------------------------------------------------------------------
  # meta — derive preview id, hostnames, image tag, namespace, etc.
  # --------------------------------------------------------------------------
  meta:
    needs: gate
    # Nothing here reads or writes anything: no checkout, no API calls. This
    # job runs for every fork PR event, so it must not inherit the
    # workflow-level pull-requests:write / packages:write.
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      preview_id: ${{ steps.v.outputs.preview_id }}
      hostname: ${{ steps.v.outputs.hostname }}
      api_hostname: ${{ steps.v.outputs.api_hostname }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
      namespace: ${{ steps.v.outputs.namespace }}
      mode: ${{ steps.v.outputs.mode }}
    steps:
      - id: v
        # Move attacker-influenceable inputs (workflow_dispatch input,
        # branch name) into env: so they're shell variables rather than
        # template-expanded literals. A preview_id containing $(...) or
        # quotes would otherwise inject into downstream `run:` blocks
        # that interpolate `${{ needs.meta.outputs.namespace }}`.
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_PR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_PR_ACTION: ${{ github.event.action }}
          # Which label was added/removed on a labeled/unlabeled event.
          GH_LABEL_NAME: ${{ github.event.label.name }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_PREVIEW_ID: ${{ inputs.preview_id }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          if [[ "$GH_EVENT_NAME" == "pull_request_target" ]]; then
            preview_id="$GH_PR_NUMBER"
            sha="$GH_PR_SHA"
            case "$GH_PR_ACTION" in
              closed)
                mode="destroy"
                ;;
              labeled)
                # Only the preview label starts a deploy. Without this, adding
                # any unrelated label to a PR that already carries `preview`
                # would kick off a full rebuild.
                if [[ "$GH_LABEL_NAME" == "$PREVIEW_LABEL" ]]; then
                  mode="deploy"
                else
                  mode="noop"
                fi
                ;;
              unlabeled)
                # Removing the label is the explicit "tear this down" signal,
                # so a reviewer can reclaim the namespace without closing the
                # PR. Any other label being removed is not our business.
                if [[ "$GH_LABEL_NAME" == "$PREVIEW_LABEL" ]]; then
                  mode="destroy"
                else
                  mode="noop"
                fi
                ;;
              *)
                # opened / synchronize / reopened: deploy, but only if the
                # label is already on the PR. The gate reports that as
                # `approved`, which every deploy-path job below also checks;
                # mode stays "deploy" here so an unlabelled PR simply has no
                # jobs to run rather than showing a skipped destroy.
                mode="deploy"
                ;;
            esac
          elif [[ "$GH_EVENT_NAME" == "push" ]]; then
            # Push trigger: use branch name as the preview id. URL becomes
            # pr-<branch>.preview.pawtograder.net. No PR comment is posted.
            preview_id="$GH_REF_NAME"
            sha="${GITHUB_SHA}"
            mode="deploy"
          else
            preview_id="$INPUT_PREVIEW_ID"
            sha="${GITHUB_SHA}"
            mode="$INPUT_ACTION"
          fi
          # preview_id flows into k8s namespace, DNS hostname, image tag,
          # and several shell-interpolated commands downstream. Require a
          # strict DNS-safe slug to close the injection surface for both
          # workflow_dispatch input and branch-name push triggers.
          if [[ ! "$preview_id" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]{0,38}$ ]]; then
            echo "::error::invalid preview_id '$preview_id' (must match ^[a-zA-Z0-9][a-zA-Z0-9-]{0,38}$)" >&2
            exit 1
          fi
          short_sha="${sha:0:7}"
          hostname="pr-${preview_id}.${PREVIEW_DOMAIN}"
          # Single-label api host so the *.preview.pawtograder.net wildcard cert
          # covers it (matches the chart's pawtograder.api.hostname helper /
          # global.apiHostnameFlatten). Was api.pr-${preview_id}.${PREVIEW_DOMAIN}.
          api_hostname="pr-${preview_id}-api.${PREVIEW_DOMAIN}"
          tag="pr-${preview_id}-${short_sha}"
          release="pawtograder"
          namespace="pawtograder-preview-pr-${preview_id}"
          {
            echo "preview_id=${preview_id}"
            echo "hostname=${hostname}"
            echo "api_hostname=${api_hostname}"
            echo "tag=${tag}"
            echo "release=${release}"
            echo "namespace=${namespace}"
            echo "mode=${mode}"
          } | tee -a "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # secrets — ensure the preview namespace has all chart-required secrets
  # before build / deploy. The cluster is the source of truth: subsequent
  # jobs READ from the namespace rather than receive secret values via job
  # outputs (GH Actions strips outputs that match registered secret masks).
  #
  # First install: generate fresh values via GenerateJwtKeys.ts and write
  # pawtograder-{jwt,postgres,e2e,s3}.
  # Subsequent installs: leave existing Secrets alone — same DB password +
  # anon key persist across PR-sync pushes.
  # --------------------------------------------------------------------------
  secrets:
    needs: [meta, gate]
    if: needs.meta.outputs.mode == 'deploy' && needs.gate.outputs.approved == 'true'
    # Cluster apiserver isn't reachable from gh-hosted runners (private LB);
    # use the in-cluster runner pool. Same goes for the deploy job below.
    runs-on: pawtograder-ci
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0
      - name: Write kubeconfig + ensure namespace
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_BASE64 }}
          NS: ${{ needs.meta.outputs.namespace }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "::error::KUBECONFIG_BASE64 is required"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
      - name: Ensure secrets in namespace
        env:
          NS: ${{ needs.meta.outputs.namespace }}
          MINIO_ACCESS: ${{ secrets.MINIO_PREVIEW_ACCESS_KEY }}
          MINIO_SECRET: ${{ secrets.MINIO_PREVIEW_SECRET_KEY }}
        run: |
          set -euo pipefail
          # Two-tier secret semantics:
          #   atomic[]    — JWT keys, DB passwords, MinIO creds. Rotating
          #                 any one mid-flight breaks every running pod, so
          #                 these are all-or-nothing: partial state is a
          #                 hard error.
          #   topup[]     — edge-functions stub. Only the edge runtime reads
          #                 it, restarting it is cheap, and the chart didn't
          #                 require it pre-helm — so it's safe to back-fill
          #                 against a pre-existing atomic set.
          atomic=(pawtograder-jwt pawtograder-postgres pawtograder-e2e pawtograder-s3)
          topup=(pawtograder-edge-functions)
          present=()
          missing=()
          for s in "${atomic[@]}"; do
            if kubectl -n "$NS" get secret "$s" >/dev/null 2>&1; then
              present+=("$s")
            else
              missing+=("$s")
            fi
          done
          # Top-up: ensure each topup[] secret exists, generating just the
          # missing ones. Idempotent — if it's already there, we leave it
          # alone.
          for s in "${topup[@]}"; do
            if kubectl -n "$NS" get secret "$s" >/dev/null 2>&1; then
              echo "topup: $s exists, skipping"
              continue
            fi
            case "$s" in
              pawtograder-edge-functions)
                echo "topup: creating $s with stub GitHub credentials"
                stub_pem=$(openssl genrsa 2048 2>/dev/null)
                kubectl -n "$NS" create secret generic pawtograder-edge-functions \
                  --from-literal=GITHUB_PRIVATE_KEY_STRING="$stub_pem" \
                  --from-literal=GITHUB_APP_ID="1" \
                  --from-literal=GITHUB_OAUTH_CLIENT_ID="stub" \
                  --from-literal=GITHUB_OAUTH_CLIENT_SECRET="stub" \
                  --from-literal=GITHUB_WEBHOOK_SECRET="stub-webhook-secret"
                ;;
              *) echo "::error::no top-up generator for $s"; exit 1 ;;
            esac
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All atomic secrets present in $NS — reusing"
            exit 0
          fi
          if [ "${#present[@]}" -ne 0 ]; then
            echo "::error::Namespace $NS has a partial atomic secret set. Present: ${present[*]}. Missing: ${missing[*]}. Refusing to auto-fill — delete the remaining atomic secrets (or the whole namespace) and re-run to regenerate."
            exit 1
          fi
          if [ -z "${MINIO_ACCESS:-}" ] || [ -z "${MINIO_SECRET:-}" ]; then
            echo "::error::MINIO_PREVIEW_ACCESS_KEY / MINIO_PREVIEW_SECRET_KEY required for first install"
            exit 1
          fi
          echo "First install for $NS — generating + creating secrets"
          # Source generated KEY=VALUE pairs into the shell.
          while IFS='=' read -r k v; do
            [ -n "$k" ] && export "$k=$v"
          done < <(npx -y tsx scripts/GenerateJwtKeys.ts --env)
          kubectl -n "$NS" create secret generic pawtograder-jwt \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=ANON_KEY="$ANON_KEY" \
            --from-literal=SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            --from-literal=JWT_PRIVATE_JWKS="$JWT_PRIVATE_JWKS" \
            --from-literal=JWT_PUBLIC_JWKS="$JWT_PUBLIC_JWKS" \
            --from-literal=JWT_REALTIME_JWKS="$JWT_REALTIME_JWKS" \
            --from-literal=REALTIME_ENC_KEY="$REALTIME_ENC_KEY" \
            --from-literal=PG_META_CRYPTO_KEY="$PG_META_CRYPTO_KEY" \
            --from-literal=PGSODIUM_ROOT_KEY="$PGSODIUM_ROOT_KEY"
          kubectl -n "$NS" create secret generic pawtograder-postgres \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=PAWTOGRADER_PASSWORD="$PAWTOGRADER_PASSWORD"
          kubectl -n "$NS" create secret generic pawtograder-e2e \
            --from-literal=END_TO_END_SECRET="$END_TO_END_SECRET" \
            --from-literal=EDGE_FUNCTION_SECRET="$EDGE_FUNCTION_SECRET" \
            --from-literal=CACHE_INVALIDATION_SECRET="$CACHE_INVALIDATION_SECRET"
          kubectl -n "$NS" create secret generic pawtograder-s3 \
            --from-literal=AWS_ACCESS_KEY_ID="$MINIO_ACCESS" \
            --from-literal=AWS_SECRET_ACCESS_KEY="$MINIO_SECRET"
          # pawtograder-edge-functions is created by the top-up loop above
          # (whether or not we hit this first-install path).

      # Mirror the e2e bundle (Supabase keys, END_TO_END_SECRET, derived
      # URLs) into OpenBao so out-of-cluster runners — the a11y VoiceOver
      # Mac (a11y-voiceover.yml) — can fetch it without cluster access.
      # Best-effort by design: Bao downtime or missing config must never
      # break the preview hot path. Removed again by the destroy job.
      - name: Publish e2e bundle to OpenBao (best-effort)
        continue-on-error: true
        env:
          PREVIEW_ID: ${{ needs.meta.outputs.preview_id }}
          BAO_ADDR: ${{ vars.BAO_ADDR }}
          BAO_ROLE_ID: ${{ secrets.BAO_PUBLISHER_ROLE_ID }}
          BAO_SECRET_ID: ${{ secrets.BAO_PUBLISHER_SECRET_ID }}
          BAO_VERSION: 2.2.0
        run: |
          set -euo pipefail
          if [ -z "${BAO_ADDR:-}" ] || [ -z "${BAO_ROLE_ID:-}" ] || [ -z "${BAO_SECRET_ID:-}" ]; then
            echo "::warning::OpenBao e2e publish skipped — vars.BAO_ADDR / secrets.BAO_PUBLISHER_ROLE_ID / secrets.BAO_PUBLISHER_SECRET_ID not configured"
            exit 0
          fi
          if ! command -v bao >/dev/null 2>&1 && ! command -v vault >/dev/null 2>&1; then
            curl -fsSL "https://github.com/openbao/openbao/releases/download/v${BAO_VERSION}/bao_${BAO_VERSION}_Linux_x86_64.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP" bao
            chmod +x "$RUNNER_TEMP/bao"
            export PATH="$RUNNER_TEMP:$PATH"
          fi
          BAO_TOKEN=$(bao write -field=token auth/approle/login role_id="$BAO_ROLE_ID" secret_id="$BAO_SECRET_ID")
          export BAO_TOKEN
          ./scripts/publish-preview-e2e-to-bao.sh "$PREVIEW_ID"

  # --------------------------------------------------------------------------
  # build-* — per-PR images. web is the only one whose build args change
  # across previews (NEXT_PUBLIC_* is inlined). edge-functions & migrations
  # are PR-content-dependent only, no per-preview args.
  # --------------------------------------------------------------------------
  build-web:
    needs: [meta, gate, secrets]
    if: needs.meta.outputs.mode == 'deploy' && needs.gate.outputs.approved == 'true'
    runs-on: pawtograder-ci
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0
      - name: Read anon key from cluster
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_BASE64 }}
          NS: ${{ needs.meta.outputs.namespace }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          ANON=$(kubectl -n "$NS" get secret pawtograder-jwt -o jsonpath='{.data.ANON_KEY}' | base64 -d)
          [ -n "$ANON" ] || { echo "::error::ANON_KEY missing in $NS/pawtograder-jwt"; exit 1; }
          echo "::add-mask::$ANON"
          # Stash in env for the build step. Within a single job env is
          # mask-aware but not subject to the cross-job output stripping.
          echo "ANON_KEY=$ANON" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/web:${{ needs.meta.outputs.tag }}
          # NEXT_PUBLIC_SUPABASE_ANON_KEY is inlined into the client bundle
          # by Next.js. We read the same value the cluster uses (created in
          # the secrets job) so build/runtime match.
          build-args: |
            NEXT_PUBLIC_PAWTOGRADER_WEB_URL=https://${{ needs.meta.outputs.hostname }}
            NEXT_PUBLIC_SUPABASE_URL=https://${{ needs.meta.outputs.api_hostname }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.ANON_KEY }}
            NEXT_PUBLIC_GIT_COMMIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
            NEXT_PUBLIC_ENABLE_SIGNUPS=true
            SENTRY_RELEASE=${{ needs.meta.outputs.tag }}
            SUPABASE_URL=https://${{ needs.meta.outputs.api_hostname }}
          # Cache image lives in the in-cluster registry (auth seeded into
          # the runner's ~/.docker/config.json by the gha-runner-scale-set
          # init container — see k8s/apps/arc/values-pawtograder-ci.yaml).
          #
          # Per-branch scoping: every preview build used to read AND write the
          # single shared `:latest` tag, so concurrent PRs clobbered each
          # other's layers and missed the cache they should have hit. Now each
          # preview gets its own `:pr-<id>` cache (stable across that PR's
          # sync pushes), with `:latest` as a warm fallback for a branch's
          # first build. We still write `:latest` (mode=max) so the shared
          # baseline stays fresh for new branches — but active builds read
          # their own scoped tag first, so cross-branch writes to `:latest`
          # no longer cause misses on layers a branch already has.
          cache-from: |
            type=registry,ref=registry.work.ripley.cloud/pawtograder/web-buildcache:pr-${{ needs.meta.outputs.preview_id }}
            type=registry,ref=registry.work.ripley.cloud/pawtograder/web-buildcache:latest
          cache-to: |
            type=registry,ref=registry.work.ripley.cloud/pawtograder/web-buildcache:pr-${{ needs.meta.outputs.preview_id }},mode=max
            type=registry,ref=registry.work.ripley.cloud/pawtograder/web-buildcache:latest,mode=max

  build-edge-functions:
    needs: [meta, gate]
    if: needs.meta.outputs.mode == 'deploy' && needs.gate.outputs.approved == 'true'
    runs-on: pawtograder-ci
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: charts/pawtograder/images/edge-functions/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/edge-functions:${{ needs.meta.outputs.tag }}
          # Per-branch scoping — see the "Build & push web" step for rationale.
          cache-from: |
            type=registry,ref=registry.work.ripley.cloud/pawtograder/edge-functions-buildcache:pr-${{ needs.meta.outputs.preview_id }}
            type=registry,ref=registry.work.ripley.cloud/pawtograder/edge-functions-buildcache:latest
          cache-to: |
            type=registry,ref=registry.work.ripley.cloud/pawtograder/edge-functions-buildcache:pr-${{ needs.meta.outputs.preview_id }},mode=max
            type=registry,ref=registry.work.ripley.cloud/pawtograder/edge-functions-buildcache:latest,mode=max

  build-migrations:
    needs: [meta, gate]
    if: needs.meta.outputs.mode == 'deploy' && needs.gate.outputs.approved == 'true'
    runs-on: pawtograder-ci
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: charts/pawtograder/images/migrations/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/migrations:${{ needs.meta.outputs.tag }}
          # Per-branch scoping — see the "Build & push web" step for rationale.
          cache-from: |
            type=registry,ref=registry.work.ripley.cloud/pawtograder/migrations-buildcache:pr-${{ needs.meta.outputs.preview_id }}
            type=registry,ref=registry.work.ripley.cloud/pawtograder/migrations-buildcache:latest
          cache-to: |
            type=registry,ref=registry.work.ripley.cloud/pawtograder/migrations-buildcache:pr-${{ needs.meta.outputs.preview_id }},mode=max
            type=registry,ref=registry.work.ripley.cloud/pawtograder/migrations-buildcache:latest,mode=max

  # --------------------------------------------------------------------------
  # build-seeder — Node + TS sources + node_modules + psql. Used only by
  # the post-install seed Job, so it's a separate image from migrations.
  # Stays out of the per-pod runtime path (~600 MiB vs migrations ~50 MiB).
  # --------------------------------------------------------------------------
  build-seeder:
    needs: [meta, gate]
    if: needs.meta.outputs.mode == 'deploy' && needs.gate.outputs.approved == 'true'
    runs-on: pawtograder-ci
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: charts/pawtograder/images/seeder/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/seeder:${{ needs.meta.outputs.tag }}
          # Per-branch scoping — see the "Build & push web" step for rationale.
          cache-from: |
            type=registry,ref=registry.work.ripley.cloud/pawtograder/seeder-buildcache:pr-${{ needs.meta.outputs.preview_id }}
            type=registry,ref=registry.work.ripley.cloud/pawtograder/seeder-buildcache:latest
          cache-to: |
            type=registry,ref=registry.work.ripley.cloud/pawtograder/seeder-buildcache:pr-${{ needs.meta.outputs.preview_id }},mode=max
            type=registry,ref=registry.work.ripley.cloud/pawtograder/seeder-buildcache:latest,mode=max

  # --------------------------------------------------------------------------
  # deploy — helm install/upgrade against ripley
  # --------------------------------------------------------------------------
  deploy:
    env:
      # Raise the client-side API throttle for every helm call in this job
      # (upgrade, the recovery uninstall/rollback, smoke test, teardown).
      #
      # Helm defaults to burst 100 and QPS 0 — and QPS 0 means client-go's
      # default of 5 req/s. The initial apply spends the burst, then everything
      # after it (notably --wait/--wait-for-jobs polling every resource in the
      # release) crawls at 5 req/s until the operation context expires:
      #   UPGRADE FAILED: client rate limiter Wait returned an error
      # That error is the client queueing behind its own limiter, not the API
      # server rejecting anything, so the fix is on this side.
      HELM_QPS: "50"
      HELM_BURST_LIMIT: "300"
    needs: [meta, gate, secrets, build-web, build-edge-functions, build-migrations, build-seeder]
    if: needs.meta.outputs.mode == 'deploy' && needs.gate.outputs.approved == 'true'
    runs-on: pawtograder-ci
    steps:
      - uses: actions/checkout@v5
        with:
          # Explicit head SHA. This checkout supplies the HELM CHART, and under
          # `pull_request` it used to resolve to the merge commit, so a PR's
          # chart changes were part of the preview. A bare checkout under
          # pull_request_target is the base branch, which would keep deploying
          # green while never exercising the chart under review. Deploying a
          # PR-supplied chart with cluster credentials is only sane behind the
          # gate — which is exactly what `approved` below asserts.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0

      - name: Write kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "::error::KUBECONFIG_BASE64 secret is missing — set it under repo settings → Secrets and variables → Actions"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl version --client=true --output=yaml | head -20

      - name: Recover stuck helm release
        # A preview deploy that gets interrupted mid-`helm upgrade` — most
        # commonly when `concurrency.cancel-in-progress: true` SIGKILLs the
        # runner because a newer push to the same PR arrived, but also any
        # runner crash/OOM — leaves the release in a `pending-*` state. Helm
        # never clears that on its own, so every later deploy aborts instantly
        # with "UPGRADE FAILED: another operation (install/upgrade/rollback) is
        # in progress", permanently bricking the PR's preview until someone
        # intervenes by hand. Uninstall the stuck release so the upgrade below
        # recreates it cleanly. Safe for previews: `helm uninstall` does NOT
        # delete the Postgres PVC (see the destroy job), so DB data survives,
        # and the migration/seed jobs re-run on every deploy anyway.
        env:
          RELEASE: ${{ needs.meta.outputs.release }}
          NAMESPACE: ${{ needs.meta.outputs.namespace }}
        run: |
          set -euo pipefail
          status=$(helm status "$RELEASE" -n "$NAMESPACE" 2>/dev/null | sed -n 's/^STATUS: //p' || true)
          echo "current helm release status: ${status:-<none>}"
          case "$status" in
            pending-install|pending-upgrade|pending-rollback)
              echo "::warning::release '$RELEASE' is stuck in '$status' (a previous deploy was interrupted). Uninstalling so this deploy can recreate it; Postgres PVC is preserved."
              helm uninstall "$RELEASE" -n "$NAMESPACE" --wait --timeout 10m || true
              ;;
          esac

      - name: Start hook-job log capture
        # `kubectl logs job/x` after the fact only works while a pod still
        # exists, and a failed hook job's pod does not survive: once the Job
        # hits its backoff limit the Job controller deletes the pod, typically
        # a couple of seconds after the container exits. So the failure
        # snapshot below reliably lost exactly the output we needed — a seed
        # failure showed up as nothing but `error: timed out waiting for the
        # condition`, and diagnosing it meant re-running the job by hand
        # against the live preview.
        #
        # Follow every batch job pod from the moment it appears instead, and
        # spool it to disk. `--pod-running-timeout` makes each follower wait
        # out ContainerCreating rather than erroring on a not-yet-started
        # container, and `-f` returns on its own when the pod ends or is
        # deleted, so the followers wind themselves up.
        env:
          NS: ${{ needs.meta.outputs.namespace }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hook-logs"
          cat > "$RUNNER_TEMP/follow-hook-logs.sh" <<'EOS'
          #!/usr/bin/env bash
          # usage: follow-hook-logs.sh <namespace> <output-dir>
          ns="$1"; dir="$2"

          follow_pod() {
            local pod="$1" out="$2" phase i
            for i in $(seq 1 900); do
              phase=$(kubectl -n "$ns" get pod "$pod" -o jsonpath='{.status.phase}' 2>/dev/null || true)
              # Pod is gone (deleted, or never observed) — nothing left to read.
              [ -z "$phase" ] && return 0
              # `kubectl logs -f <pod>` does NOT wait out ContainerCreating: it
              # errors immediately with "is waiting to start", and
              # --pod-running-timeout only applies to selector/controller
              # lookups, not a named pod. So poll until the container exists.
              if [ "$phase" = "Pending" ]; then sleep 1; continue; fi
              # Succeeded/Failed pods that still exist return their full log and
              # exit 0 immediately; Running pods stream until the pod ends.
              kubectl -n "$ns" logs -f --all-containers --timestamps "$pod" >>"$out" 2>/dev/null && return 0
              sleep 1
            done
          }

          while :; do
            for pod in $(kubectl -n "$ns" get pods -l batch.kubernetes.io/job-name \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null); do
              marker="$dir/.$pod.following"
              [ -e "$marker" ] && continue
              : > "$marker"
              follow_pod "$pod" "$dir/$pod.log" &
            done
            sleep 2
          done
          EOS
          chmod +x "$RUNNER_TEMP/follow-hook-logs.sh"
          nohup "$RUNNER_TEMP/follow-hook-logs.sh" "$NS" "$RUNNER_TEMP/hook-logs" \
            > "$RUNNER_TEMP/hook-logs/.watcher.out" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/hook-logs/.watcher.pid"
          echo "following batch job pods in $NS (pid $(cat "$RUNNER_TEMP/hook-logs/.watcher.pid"))"

      - name: helm upgrade --install
        env:
          RELEASE: ${{ needs.meta.outputs.release }}
          NAMESPACE: ${{ needs.meta.outputs.namespace }}
          HOSTNAME: ${{ needs.meta.outputs.hostname }}
          TAG: ${{ needs.meta.outputs.tag }}
          # Stamped onto every edge-function Sentry event so a Bugsink record names the branch and PR
          # it came from. Held in env: rather than templated into the run: block below — a branch name
          # is attacker-influenceable and these flow into a shell command.
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
          DEPLOY_PR: ${{ github.event.pull_request.number }}
          # The HEAD sha, not $GITHUB_SHA. Under pull_request_target
          # $GITHUB_SHA is the base branch tip, and this value reaches the
          # edge functions as GIT_COMMIT_SHA (see the chart's
          # _edge-functions-workload.tpl), which Sentry uses as its commit
          # tag — so stamping $GITHUB_SHA attributes every preview error to
          # the wrong revision. `github.head_ref` above is already the PR's
          # branch, so only the commit was wrong.
          DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # helm --set splits on commas and interprets dots as key nesting, so a branch name reaches it
          # only after being reduced to a charset that cannot restructure the flag. Informational tag —
          # dropping an odd character is preferable to a failed deploy.
          SAFE_BRANCH=$(printf '%s' "$DEPLOY_BRANCH" | tr -cd 'A-Za-z0-9._/-' | cut -c1-100)
          # secrets.create=false: chart consumes the pawtograder-{jwt,
          # postgres,e2e,s3} Secrets created by the `secrets` job.
          # secrets.autogenerate=false: skip the in-cluster bootstrap Job
          # (we already provisioned everything from CI).
          helm upgrade --install "$RELEASE" \
            ./charts/pawtograder \
            --namespace "$NAMESPACE" \
            -f charts/pawtograder/examples/values-preview.yaml \
            --set global.hostname="$HOSTNAME" \
            --set web.image.tag="$TAG" \
            --set edgeFunctions.image.tag="$TAG" \
            --set migrations.image.tag="$TAG" \
            --set seed.image.tag="$TAG" \
            --set secrets.autogenerate=false \
            --set secrets.create=false \
            --set-string global.deploy.branch="$SAFE_BRANCH" \
            --set-string global.deploy.pr="$DEPLOY_PR" \
            --set-string global.deploy.runId="$GITHUB_RUN_ID" \
            --set-string global.deploy.runAttempt="$GITHUB_RUN_ATTEMPT" \
            --set-string global.deploy.commit="$DEPLOY_SHA" \
            --wait --wait-for-jobs --timeout 20m

      - name: Status snapshot on failure
        if: failure()
        env:
          NS: ${{ needs.meta.outputs.namespace }}
        run: |
          kubectl -n "$NS" get pods,jobs 2>&1 | head -50

          # Captured live by the follower above, so this survives the Job
          # controller deleting a failed pod. Print the tail of every hook pod
          # we managed to follow, failures last-and-loudest.
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/hook-logs/*.log; do
            echo "=== $(basename "$f" .log) (captured live) ==="
            tail -200 "$f"
          done

          # Best-effort fallback for anything the follower missed (a pod that
          # came and went inside one poll interval, or a job whose pod is
          # somehow still around).
          for j in $(kubectl -n "$NS" get jobs -o name); do
            pod_logs=$(kubectl -n "$NS" logs "$j" --all-containers --tail=200 2>/dev/null || true)
            [ -z "$pod_logs" ] && continue
            echo "=== $j (live pod) ==="
            printf '%s\n' "$pod_logs" | tail -200
          done

          # Whatever the seed/migration containers printed, the Job's own
          # failure reason (BackoffLimitExceeded, DeadlineExceeded, an image
          # pull that never resolved) is only on the Job object and its events.
          for j in $(kubectl -n "$NS" get jobs -o name); do
            echo "=== $j conditions ==="
            kubectl -n "$NS" get "$j" -o jsonpath='{range .status.conditions[*]}{.type}: {.reason} — {.message}{"\n"}{end}' 2>&1 || true
          done
          echo "=== recent events ==="
          kubectl -n "$NS" get events --sort-by=.lastTimestamp 2>&1 | tail -30

      - name: Status snapshot
        if: always()
        env:
          NS: ${{ needs.meta.outputs.namespace }}
        run: |
          # Wind up the log follower before the runner does it for us — an
          # `kubectl logs -f` left attached keeps the job alive to its cleanup
          # phase and shows up as "Cleaning up orphan processes".
          if [ -f "$RUNNER_TEMP/hook-logs/.watcher.pid" ]; then
            pkill -P "$(cat "$RUNNER_TEMP/hook-logs/.watcher.pid")" 2>/dev/null || true
            kill "$(cat "$RUNNER_TEMP/hook-logs/.watcher.pid")" 2>/dev/null || true
          fi
          kubectl -n "$NS" get pods,svc,ingress 2>&1 | head -50

      - name: Comment URL on PR
        if: github.event_name == 'pull_request_target'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            🚀 **Preview deployed** for `${{ needs.meta.outputs.tag }}`

            - App:    https://${{ needs.meta.outputs.hostname }}
            - API:    https://${{ needs.meta.outputs.api_hostname }}
            - Studio: `kubectl -n ${{ needs.meta.outputs.namespace }} port-forward svc/pawtograder-studio 3010:3000`
            - Logs:   `kubectl -n ${{ needs.meta.outputs.namespace }} logs -l app.kubernetes.io/instance=${{ needs.meta.outputs.release }}`

            ### Sample login emails

            | Role       | Email                              |
            | ---------- | ---------------------------------- |
            | Instructor | `instructor@pawtograder.net`       |
            | Grader     | `grader@pawtograder.net`           |
            | Student    | `student@pawtograder.net`          |

            Shared password lives in OpenBao at `kv/apps/pawtograder/preview-shared` (key `seed_user_password`). 

            The preview tears down automatically when this PR closes.

  # --------------------------------------------------------------------------
  # destroy — helm uninstall + namespace delete on PR close (or manual)
  # --------------------------------------------------------------------------
  destroy:
    env:
      # Raise the client-side API throttle for every helm call in this job
      # (upgrade, the recovery uninstall/rollback, smoke test, teardown).
      #
      # Helm defaults to burst 100 and QPS 0 — and QPS 0 means client-go's
      # default of 5 req/s. The initial apply spends the burst, then everything
      # after it (notably --wait/--wait-for-jobs polling every resource in the
      # release) crawls at 5 req/s until the operation context expires:
      #   UPGRADE FAILED: client rate limiter Wait returned an error
      # That error is the client queueing behind its own limiter, not the API
      # server rejecting anything, so the fix is on this side.
      HELM_QPS: "50"
      HELM_BURST_LIMIT: "300"
    needs: [meta, gate]
    # Deliberately NOT gated on trust, unlike every deploy-path job above.
    # This job does no checkout and runs no PR-supplied code — just pinned
    # setup actions and helm/kubectl/bao against a namespace whose name comes
    # only from the PR number — so the kubeconfig here is never reachable by
    # fork code. Requiring trust would instead strand a namespace and its PVCs
    # whenever someone's write access is revoked between deploying a preview
    # and closing the PR: teardown would silently skip and nothing would ever
    # retry it. Cleanup must not be revocable.
    if: needs.meta.outputs.mode == 'destroy'
    runs-on: pawtograder-ci
    steps:
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0

      - name: Write kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: helm uninstall + delete namespace
        env:
          NS: ${{ needs.meta.outputs.namespace }}
          RELEASE: ${{ needs.meta.outputs.release }}
        run: |
          set -euo pipefail
          if kubectl get ns "$NS" >/dev/null 2>&1; then
            helm uninstall "$RELEASE" --namespace "$NS" --ignore-not-found || true
            # PVCs are not deleted by helm uninstall — clean them up so
            # the namespace can actually go away.
            kubectl -n "$NS" delete pvc --all --wait=false || true
            kubectl delete namespace "$NS" --wait=false
            echo "preview ${NS} torn down"
          else
            echo "preview ${NS} already absent — nothing to do"
          fi

      # Counterpart of the secrets job's OpenBao publish: drop the mirrored
      # e2e bundle with the preview. Best-effort — a stale bundle is dead
      # weight anyway once the namespace is gone.
      - name: Remove e2e bundle from OpenBao (best-effort)
        continue-on-error: true
        env:
          PREVIEW_ID: ${{ needs.meta.outputs.preview_id }}
          BAO_ADDR: ${{ vars.BAO_ADDR }}
          BAO_ROLE_ID: ${{ secrets.BAO_PUBLISHER_ROLE_ID }}
          BAO_SECRET_ID: ${{ secrets.BAO_PUBLISHER_SECRET_ID }}
          BAO_VERSION: 2.2.0
        run: |
          set -euo pipefail
          if [ -z "${BAO_ADDR:-}" ] || [ -z "${BAO_ROLE_ID:-}" ] || [ -z "${BAO_SECRET_ID:-}" ]; then
            echo "OpenBao not configured — nothing to remove"
            exit 0
          fi
          if ! command -v bao >/dev/null 2>&1 && ! command -v vault >/dev/null 2>&1; then
            curl -fsSL "https://github.com/openbao/openbao/releases/download/v${BAO_VERSION}/bao_${BAO_VERSION}_Linux_x86_64.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP" bao
            chmod +x "$RUNNER_TEMP/bao"
            export PATH="$RUNNER_TEMP:$PATH"
          fi
          BAO_TOKEN=$(bao write -field=token auth/approle/login role_id="$BAO_ROLE_ID" secret_id="$BAO_SECRET_ID")
          export BAO_TOKEN
          bao kv metadata delete -mount=kv "apps/pawtograder/preview-e2e/pr-${PREVIEW_ID}" \
            && echo "removed e2e bundle for pr-${PREVIEW_ID}" \
            || echo "no e2e bundle to remove for pr-${PREVIEW_ID}"

      - name: Update PR comment
        if: github.event_name == 'pull_request_target'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            🧹 **Preview torn down** — namespace `${{ needs.meta.outputs.namespace }}` deleted.
