# TEMPORARY diagnostic — DELETE after validating the VoiceOver Mac runner.
# rev 2: re-trigger after enabling VoiceOver AppleScript control + doctor JS fix.
#
# Validates the runner's assistive-tech chain (runbook §7) by running
# `a11y:vo:doctor` under Runner.Listener — the TCC-granted binary — which is the
# only context where the VoiceOver/Safari AppleScript grants actually apply.
# Uses `on: push` (not workflow_dispatch) so it runs from THIS branch without
# needing to land on the default branch first. The `paths` filter means only a
# change to this file triggers it, so it won't re-run on every push to the PR.
name: a11y VO doctor (diagnostic — DELETE ME)

on:
  push:
    branches: [a11y/wcag-aa-student-pages]
    paths: ['.github/workflows/a11y-vo-doctor-diagnostic.yml']

permissions:
  contents: read

# Share the real lane's single-VoiceOver-session queue.
concurrency:
  group: a11y-voiceover-mac
  cancel-in-progress: false

jobs:
  doctor:
    runs-on: [self-hosted, macOS, voiceover]
    timeout-minutes: 20
    env:
      BAO_ADDR: https://bao.work.ripley.cloud
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: VoiceOver / Safari / OpenBao doctor
        run: npm run a11y:vo:doctor
