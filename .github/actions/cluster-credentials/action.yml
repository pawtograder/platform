name: Cluster credentials
description: >-
  Write $HOME/.kube/config for the preview cluster, either from a short-lived
  OIDC-federated ServiceAccount token minted through OpenBao, or from the
  legacy static kubeconfig secret.

# Two paths, selected by the PREVIEW_CLUSTER_AUTH repo variable:
#
#   oidc   — the job mints a GitHub OIDC JWT, exchanges it at OpenBao's JWT
#            auth endpoint for a Bao token, and uses that to mint a Kubernetes
#            ServiceAccount token from the Kubernetes secrets engine. Nothing
#            long-lived exists: the token dies with the job, and authority is
#            derived from verified OIDC claims (repository, environment,
#            job_workflow_ref) rather than from a value in repo settings.
#
#   static — decode KUBECONFIG_BASE64 (or the read-only variant). What we did
#            before OIDC, kept so this lands inert and flips with one variable.
#
# The switch is DELIBERATELY explicit rather than "try OIDC, fall back on
# error". A silent fallback would turn any OpenBao misconfiguration into a
# quiet downgrade to the long-lived credential, which is the failure mode this
# whole change exists to remove — and it would look identical to success.
# See docs/operations/preview-oidc-cluster-credentials.md.

inputs:
  mode:
    description: "oidc | static. Pass vars.PREVIEW_CLUSTER_AUTH; empty means static."
    required: false
    default: ""
  bao_addr:
    description: "OpenBao address (vars.BAO_ADDR). Required for mode=oidc."
    required: false
    default: ""
  bao_role:
    description: "OpenBao JWT auth role to log in as (mode=oidc)."
    required: false
    default: ""
  k8s_role:
    description: "OpenBao Kubernetes secrets engine role to mint from (mode=oidc)."
    required: false
    default: ""
  namespace:
    description: "Namespace the minted token should be scoped to (mode=oidc)."
    required: false
    default: ""
  ttl:
    description: >-
      Lifetime of the minted ServiceAccount token. Must outlast the longest
      operation in the job — the deploy job runs `helm --wait --timeout 20m`,
      so its floor is well above 20m.
    required: false
    default: "40m"
  api_server:
    description: >-
      Cluster API server URL (vars.PREVIEW_CLUSTER_API_SERVER). Not a secret.
      Falls back to the in-cluster endpoint when the runner has a mounted
      ServiceAccount.
    required: false
    default: ""
  ca_base64:
    description: >-
      base64 cluster CA bundle (vars.PREVIEW_CLUSTER_CA_BASE64). Not a secret —
      it is a public certificate. Falls back to the runner's mounted CA.
    required: false
    default: ""
  kubeconfig_base64:
    description: "Static kubeconfig, base64 (mode=static)."
    required: false
    default: ""
  bao_version:
    description: "OpenBao CLI version to fetch when not already present."
    required: false
    default: "2.2.0"

runs:
  using: composite
  steps:
    - name: Write kubeconfig
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BAO_ADDR: ${{ inputs.bao_addr }}
        BAO_ROLE: ${{ inputs.bao_role }}
        K8S_ROLE: ${{ inputs.k8s_role }}
        NS: ${{ inputs.namespace }}
        TTL: ${{ inputs.ttl }}
        API_SERVER: ${{ inputs.api_server }}
        CA_B64: ${{ inputs.ca_base64 }}
        KUBECONFIG_B64: ${{ inputs.kubeconfig_base64 }}
        BAO_VERSION: ${{ inputs.bao_version }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.kube"

        if [ "${MODE:-static}" != "oidc" ]; then
          # ---------------- static path ----------------
          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "::error title=No cluster credential::PREVIEW_CLUSTER_AUTH is not 'oidc' and no static kubeconfig was supplied." >&2
            exit 1
          fi
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "::notice title=Cluster auth::static kubeconfig (long-lived). Set the PREVIEW_CLUSTER_AUTH variable to 'oidc' to use short-lived federated credentials."
          exit 0
        fi

        # ---------------- OIDC path ----------------
        # Fail loudly on missing config. This path must never degrade to the
        # static credential on its own.
        for v in BAO_ADDR BAO_ROLE K8S_ROLE NS; do
          if [ -z "${!v:-}" ]; then
            echo "::error title=OIDC misconfigured::PREVIEW_CLUSTER_AUTH=oidc but '$v' is empty." >&2
            exit 1
          fi
        done
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error title=Missing id-token permission::This job needs 'permissions: id-token: write' to mint an OIDC token." >&2
          exit 1
        fi

        if ! command -v bao >/dev/null 2>&1; then
          curl -fsSL "https://github.com/openbao/openbao/releases/download/v${BAO_VERSION}/bao_${BAO_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" bao
          chmod +x "$RUNNER_TEMP/bao"
          export PATH="$RUNNER_TEMP:$PATH"
        fi

        # Audience is the Bao address, and the JWT role pins bound_audiences to
        # the same string. The default audience is the repo URL, which every
        # workflow in the repo would share.
        JWT=$(curl -sSf \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${BAO_ADDR}" | jq -r '.value')
        [ -n "$JWT" ] && [ "$JWT" != "null" ] || { echo "::error::failed to mint a GitHub OIDC token" >&2; exit 1; }
        echo "::add-mask::$JWT"

        export BAO_ADDR
        BAO_TOKEN=$(bao write -field=token "auth/jwt/login" role="$BAO_ROLE" jwt="$JWT")
        echo "::add-mask::$BAO_TOKEN"
        export BAO_TOKEN

        SA_TOKEN=$(bao write -field=service_account_token \
          "kubernetes/creds/${K8S_ROLE}" \
          kubernetes_namespace="$NS" ttl="$TTL")
        echo "::add-mask::$SA_TOKEN"

        # Server + CA are not secrets. Prefer explicit variables; fall back to
        # the runner pod's own mounted ServiceAccount, which exists when ARC
        # leaves automountServiceAccountToken on.
        sa_dir=/var/run/secrets/kubernetes.io/serviceaccount
        if [ -z "${API_SERVER:-}" ]; then
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            API_SERVER="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT:-443}"
          else
            echo "::error title=No API server::set the PREVIEW_CLUSTER_API_SERVER variable (the runner has no in-cluster endpoint)." >&2
            exit 1
          fi
        fi
        if [ -z "${CA_B64:-}" ]; then
          if [ -r "$sa_dir/ca.crt" ]; then
            CA_B64=$(base64 -w0 < "$sa_dir/ca.crt")
          else
            echo "::error title=No cluster CA::set the PREVIEW_CLUSTER_CA_BASE64 variable (the runner has no mounted CA)." >&2
            exit 1
          fi
        fi

        umask 077
        cat > "$HOME/.kube/config" <<EOF
        apiVersion: v1
        kind: Config
        clusters:
          - name: preview
            cluster:
              server: ${API_SERVER}
              certificate-authority-data: ${CA_B64}
        users:
          - name: oidc-federated
            user:
              token: ${SA_TOKEN}
        contexts:
          - name: preview
            context:
              cluster: preview
              user: oidc-federated
              namespace: ${NS}
        current-context: preview
        EOF
        chmod 600 "$HOME/.kube/config"
        echo "::notice title=Cluster auth::OIDC-federated ServiceAccount token (ttl ${TTL}, role ${K8S_ROLE}, ns ${NS}). No long-lived credential was used."
