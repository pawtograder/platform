name: pawtograder-sso-e2e

services:
  # OIDC `iss` must match for browser and containers, so Forgejo/Coder share this netns.
  loopback:
    image: alpine/socat:1.8.0.3
    command:
      - "TCP-LISTEN:${SB_API_PORT:?},fork,reuseaddr,bind=127.0.0.1"
      - "TCP:host.docker.internal:${SB_API_PORT:?}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${FORGEJO_PORT:-3100}:${FORGEJO_PORT:-3100}"
      - "127.0.0.1:${CODER_PORT:-7080}:${CODER_PORT:-7080}"
      - "127.0.0.1:${FUNCTIONS_PORT:-3150}:${FUNCTIONS_PORT:-3150}"

  forgejo:
    image: ghcr.io/pawtograder/mirror/forgejo/forgejo:15.0.9-rootless
    network_mode: service:loopback
    depends_on: [loopback]
    volumes:
      - ../../../charts/pawtograder/files/forgejo/header.tmpl:/pawtograder-templates/header.tmpl:ro
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__HTTP_PORT: "${FORGEJO_PORT:-3100}"
      FORGEJO__server__DOMAIN: 127.0.0.1
      FORGEJO__server__ROOT_URL: "http://127.0.0.1:${FORGEJO_PORT:-3100}/"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__START_SSH_SERVER: "false"
      # DISABLE_REGISTRATION does not gate OAuth auto-registration.
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      FORGEJO__oauth2_client__USERNAME: email
      FORGEJO__oauth2_client__ACCOUNT_LINKING: disabled
      FORGEJO__oauth2_client__OPENID_CONNECT_SCOPES: "email profile"
      # The class orgs' push hooks deliver to the functions container at 127.0.0.1 (cloud workspaces journey).
      FORGEJO__webhook__ALLOWED_HOST_LIST: loopback
      FORGEJO__log__LEVEL: Info

  coder-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: coder
      POSTGRES_DB: coder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder"]
      interval: 2s
      retries: 30

  coder:
    image: ghcr.io/pawtograder/mirror/coder/coder:v2.37.3
    network_mode: service:loopback
    depends_on:
      loopback:
        condition: service_started
      coder-db:
        condition: service_healthy
      agents-init:
        condition: service_completed_successfully
    volumes:
      # The `kubernetes` template run-e2e.sh pushes: the lane's main.tf beside the chart's own clone.sh.
      - ./coder-template/main.tf:/pawtograder-template/main.tf:ro
      - ../../../charts/pawtograder/files/coder-templates/kubernetes/clone.sh:/pawtograder-template/clone.sh:ro
      - agents:/agents
    environment:
      CODER_HTTP_ADDRESS: "0.0.0.0:${CODER_PORT:-7080}"
      CODER_ACCESS_URL: "http://127.0.0.1:${CODER_PORT:-7080}"
      CODER_PG_CONNECTION_URL: "postgresql://coder:coder@coder-db:5432/coder?sslmode=disable"
      CODER_TELEMETRY_ENABLE: "false"
      CODER_UPDATE_CHECK: "false"
      CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE: "false"
      CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS: "false"
      CODER_OIDC_ISSUER_URL: "${SB_ISSUER:?}"
      CODER_OIDC_CLIENT_ID: "${CODER_OIDC_CLIENT_ID:?}"
      CODER_OIDC_CLIENT_SECRET: "${CODER_OIDC_CLIENT_SECRET:?}"
      # The chart's Coder OIDC settings (charts/pawtograder/templates/app-databases.yaml): sign-ups
      # off, since Pawtograder creates each Coder user, and the email read from the access token's
      # coder_email claim, so a sign-in is matched by the Pawtograder user id, never a real email.
      CODER_OIDC_ALLOW_SIGNUPS: "false"
      CODER_OIDC_SCOPES: "openid,profile,email"
      CODER_OIDC_SIGN_IN_TEXT: "Sign in with Pawtograder"
      CODER_OIDC_EMAIL_FIELD: "coder_email"
      CODER_OIDC_EMAIL_DOMAIN: "coder.pawtograder.invalid"
      CODER_OIDC_IGNORE_USERINFO: "true"
      CODER_OIDC_ACCESS_TOKEN_CLAIMS: "true"
      CODER_OIDC_USERNAME_FIELD: "sub"
      # The chart's coder.externalAuth.github slot (CODER_GITHUB_AUTH_ID=github), played by Forgejo: the lane
      # can't reach GitHub, so a second origin of the same Forgejo (localhost instead of 127.0.0.1) stands in
      # for github.com, and Forgejo's OAuth2 provider for GitHub's. The authorize URL stays on 127.0.0.1, where
      # the student's Forgejo session is; REGEX matches only the stand-in origin, so the agent's GIT_ASKPASS
      # answers for GitHub clones and Forgejo clones keep using the credentials file Pawtograder delivers.
      CODER_EXTERNAL_AUTH_0_ID: github
      CODER_EXTERNAL_AUTH_0_TYPE: gitea
      CODER_EXTERNAL_AUTH_0_DISPLAY_NAME: GitHub
      CODER_EXTERNAL_AUTH_0_CLIENT_ID: "${GITHUB_STANDIN_CLIENT_ID:-}"
      CODER_EXTERNAL_AUTH_0_CLIENT_SECRET: "${GITHUB_STANDIN_CLIENT_SECRET:-}"
      CODER_EXTERNAL_AUTH_0_AUTH_URL: "http://127.0.0.1:${FORGEJO_PORT:-3100}/login/oauth/authorize"
      CODER_EXTERNAL_AUTH_0_TOKEN_URL: "http://127.0.0.1:${FORGEJO_PORT:-3100}/login/oauth/access_token"
      CODER_EXTERNAL_AUTH_0_VALIDATE_URL: "http://127.0.0.1:${FORGEJO_PORT:-3100}/api/v1/user"
      CODER_EXTERNAL_AUTH_0_REGEX: "^http://localhost:${FORGEJO_PORT:-3100}(/.*)?$$"

  # Empties the shared /agents volume and makes it writable by the coder user (uid 1000) of both images.
  agents-init:
    image: ${WORKSPACE_IMAGE:-ghcr.io/pawtograder/coder-workspace:staging-latest}
    user: "0:0"
    volumes:
      - agents:/agents
    entrypoint: ["sh", "-c", "rm -rf /agents/* && chown 1000:1000 /agents"]

  # Where the lane's workspaces run: the chart's workspace image, running each agent the template hands over
  # (workspace-agents.sh). Its network namespace is the loopback container's, so the agent reaches Coder and
  # Forgejo at the URLs the template and workspace-open use. The image is amd64-only; on an arm64 host,
  # WORKSPACE_IMAGE=codercom/code-server:4.143.1 (same user, home and code-server) and WORKSPACE_ARCH=arm64.
  workspace:
    image: ${WORKSPACE_IMAGE:-ghcr.io/pawtograder/coder-workspace:staging-latest}
    network_mode: service:loopback
    depends_on:
      loopback:
        condition: service_started
      agents-init:
        condition: service_completed_successfully
    volumes:
      - agents:/agents
      - ./workspace-agents.sh:/e2e/workspace-agents.sh:ro
    entrypoint: ["sh", "/e2e/workspace-agents.sh"]

  # The edge functions the cloud workspaces journey reaches, run unmodified under Deno (functions-router.ts).
  functions:
    image: docker.io/denoland/deno:2.9.8
    network_mode: service:loopback
    depends_on: [loopback]
    user: "0:0"
    volumes:
      - ../../../supabase/functions:/supabase/functions:ro
      - ./functions-router.ts:/e2e/functions-router.ts:ro
      - deno-cache:/deno-dir
    command: ["deno", "run", "--allow-all", "--no-lock", "/e2e/functions-router.ts"]
    environment:
      DENO_DIR: /deno-dir
      FUNCTIONS_PORT: "${FUNCTIONS_PORT:-3150}"
      SUPABASE_URL: "http://127.0.0.1:${SB_API_PORT:-56321}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      CODER_URL: "http://127.0.0.1:${CODER_PORT:-7080}"
      CODER_API_TOKEN: "${CODER_API_TOKEN:-}"
      CODER_GITHUB_AUTH_ID: github
      GITHUB_URL: "http://localhost:${FORGEJO_PORT:-3100}"
      FORGEJO_URL: "http://127.0.0.1:${FORGEJO_PORT:-3100}"
      FORGEJO_ADMIN_USERNAME: "${FORGEJO_ADMIN_USER:-}"
      FORGEJO_ADMIN_PASSWORD: "${FORGEJO_ADMIN_PASSWORD:-}"
      FORGEJO_AUTH_SOURCE_ID: "${SOURCE_ID:-}"
      FORGEJO_WEBHOOK_SECRET: "${FORGEJO_WEBHOOK_SECRET:-}"
      # As in deploy.yml's e2e job: the GitHub Actions side of a submission is the suite's e2e token, and
      # E2E_MOCK_GITHUB keeps autograder-create-submission from cloning from GitHub. GitHubWrapper builds an
      # App at import, so it gets a throwaway key.
      E2E_ENABLE: "true"
      E2E_MOCK_GITHUB: "true"
      END_TO_END_SECRET: not-a-secret
      GITHUB_APP_ID: "1"
      GITHUB_PRIVATE_KEY_STRING: "${E2E_GITHUB_PRIVATE_KEY_STRING:-}"
      GITHUB_OAUTH_CLIENT_ID: not-a-real-oauth-client-id
      GITHUB_OAUTH_CLIENT_SECRET: not-a-real-oauth-client-secret

volumes:
  agents:
  deno-cache:
