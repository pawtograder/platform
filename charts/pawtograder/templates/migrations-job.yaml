{{- /* pg_wait(): the postgres-readiness loop BOTH init containers below use, in
   one place because the budget is derived and a second copy is how a derivation
   goes stale.

   THE BUDGET IS DERIVED FROM postgres.terminationGracePeriodSeconds, not chosen.
   It used to be a flat 60 iterations x 2s = 120s, against a primary whose
   terminationGracePeriodSeconds is 600 and whose real shutdown takes close to all
   of it: postgres-statefulset.yaml records the measurement -- with the sidecars'
   slow SIGTERM a needless restart "took the DB down ~10 min", because
   base-backup and postgres-exporter have no preStop and no graceful SIGTERM
   handling, so the pod rides the full grace window to the SIGKILL. 120s of wait
   against a ~600s outage was a latent mismatch for as long as the primary did not
   roll on upgrade. 0.4.0 FORCES exactly one primary roll (the checksum/config
   narrowing in postgres-statefulset.yaml; pinned in tests/render-guardrails.sh),
   which converts it into a probable failure.

   AND THE JOB LOSES THE RACE BY CONSTRUCTION. Helm's install/upgrade kind
   ordering applies the StatefulSet before the Job, so the primary's deletion
   starts first and this Job is created seconds later -- the worst case for the
   Job, not the best.

   WHAT FAILING COSTS. The staging auto-deploy runs
   `helm upgrade --wait --wait-for-jobs` (release-images.yml deploy-staging) with
   no `--atomic`, so a Job that exhausts backoffLimit turns the deploy red and
   leaves the release `failed` with Kong already carrying the new worker routes.
   The workflow's "Recover stuck helm release" step only clears `pending-*`
   states, not `failed`. That workflow's `--timeout` was raised to 25m in the same
   change as this budget and for the same reason -- the derivation is written out
   on the `helm upgrade` step there.

   ticks x 2s = the full grace window, so the FIRST attempt alone survives a
   worst-case roll. That matters more than the retry budget: backoffLimit 3 adds
   10/20/40s restart backoffs, but four attempts at this budget exceed the
   workflow's own `--timeout` even at 25m, so helm gives up before the Job does.
   The retries are a safety net for a transient, not for the roll.

   FLOORED at the old 60 ticks so the derivation can only ever raise the budget.
   `div` on a grace period someone lowered to 30 would give 15 ticks; at 0 it
   gives none at all, and `seq 1 0` is empty, so the loop would fall straight
   through to `return 1` and every install would fail its migrations on a value
   that looks like a tuning knob.

   No activeDeadlineSeconds, deliberately: it would have to exceed this budget to
   be safe, at which point helm's `--timeout` is already the binding deadline --
   and a deadline BELOW it converts a slow-but-succeeding migration into
   DeadlineExceeded, which (unlike a backoff retry) never retries. */ -}}
{{- define "pawtograder.migrations.waitForPostgres" -}}
{{- $graceSeconds := .Values.postgres.terminationGracePeriodSeconds | default 600 | int -}}
{{- $ticks := max (div $graceSeconds 2) 60 -}}
pg_wait() {
  for i in $(seq 1 {{ $ticks }}); do
    if pg_isready -h {{ include "pawtograder.postgres.host" . }} -p {{ .Values.postgres.service.port }} -U postgres; then
      echo "postgres ready"
      return 0
    fi
    echo "waiting for postgres ($i/{{ $ticks }})"
    sleep 2
  done
  echo "postgres not ready after {{ mul $ticks 2 }}s (>= postgres.terminationGracePeriodSeconds {{ $graceSeconds }}s, the primary's whole shutdown window)" >&2
  return 1
}
{{- end -}}
{{- if and .Values.postgres.enabled .Values.migrations.enabled }}
# Migrations run as a regular install resource (not a Helm hook): the chart's
# postgres StatefulSet is also a regular resource, and pre-install hooks fire
# *before* any non-hook resource exists, so a hook-based migrations Job has
# nothing to connect to. Instead, the Job's wait-for-postgres init container
# polls until postgres is ready, then applies the migration set. Components
# that depend on the schema retry connecting until migrations completes.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "migrations") }}-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "migrations") | nindent 4 }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "migrations") | nindent 8 }}
    spec:
      # Use the namespace's default ServiceAccount: helm pre-install hooks run
      # before non-hook resources, so the chart's own ServiceAccount template
      # hasn't applied yet. The migrations job needs no cluster permissions.
      {{- include "pawtograder.imagePullSecrets" . | nindent 6 }}
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: {{ include "pawtograder.image" (dict "ctx" . "image" .Values.postgres.image) }}
          command:
            - sh
            - -c
            - |
              set -e
              {{- include "pawtograder.migrations.waitForPostgres" . | nindent 14 }}
              pg_wait
        # Pawtograder migrations reference auth/storage/realtime/vault tables
        # and grant on them. Those services run their OWN schema migrations on
        # startup; we have to wait for them to finish before pawtograder
        # migrations can run, otherwise we get "relation does not exist" /
        # "column does not exist" errors. We probe by checking for tables that
        # only exist after each service's migrations have completed.
        - name: wait-for-supabase-services
          image: {{ include "pawtograder.image" (dict "ctx" . "image" .Values.postgres.image) }}
          env:
            - name: PGHOST
              value: {{ include "pawtograder.postgres.host" . }}
            - name: PGPORT
              value: {{ .Values.postgres.service.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGUSER
              value: supabase_admin
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.names.postgres }}
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              set -e
              {{- include "pawtograder.migrations.waitForPostgres" . | nindent 14 }}
              # The SAME wait again, and NOT redundant. The first init container can
              # observe a FALSE READY: helm deletes the primary's pod moments before
              # this Job is created, and for the first couple of seconds of
              # termination the old pod is still in the Service's endpoints, so
              # pg_isready can succeed once and let that container exit 0 while the
              # ~600s outage is still ahead. Without this the outage would instead
              # be charged to the 360s service-migration budget below, which is
              # sized for supabase's own migrations and would exhaust first.
              #
              # The two waits are mutually exclusive in practice rather than
              # additive: whichever one observes the outage spends the budget, and
              # the other returns on its first tick. So the Job's realistic
              # worst-case first attempt is one grace window plus the service wait,
              # not two grace windows.
              pg_wait
              check() {
                # $1 = label, $2 = SQL that returns 1 row when ready
                psql -tAc "$2" 2>/dev/null | grep -q 1
              }
              # Wait for every supabase service to finish its own migrations:
              #   - auth: needs auth.identities
              #   - storage: needs storage.buckets with the `public` column
              #   - realtime: needs the `supabase_realtime` publication AND
              #     realtime.messages (created by realtime's bootstrap; the
              #     `realtime-to-broadcast` pawtograder migration references it)
              for i in $(seq 1 90); do
                ok=true
                check 'auth.identities'           "SELECT 1 FROM information_schema.tables WHERE table_schema='auth' AND table_name='identities'"               || ok=false
                check 'storage.buckets.public'    "SELECT 1 FROM information_schema.columns WHERE table_schema='storage' AND table_name='buckets' AND column_name='public'" || ok=false
                check 'pub.supabase_realtime'     "SELECT 1 FROM pg_publication WHERE pubname='supabase_realtime'"                                              || ok=false
                check 'realtime.messages'         "SELECT 1 FROM information_schema.tables WHERE table_schema='realtime' AND table_name='messages'"             || ok=false
                if $ok; then
                  echo "supabase services migrated"
                  exit 0
                fi
                echo "waiting for supabase services ($i/90)"
                sleep 4
              done
              echo "supabase services not ready after 6min" >&2
              psql -c "SELECT table_schema, count(*) FROM information_schema.tables WHERE table_schema IN ('auth','storage','realtime') GROUP BY 1" >&2
              exit 1
      containers:
        - name: migrate
          image: {{ include "pawtograder.image" (dict "ctx" . "image" .Values.migrations.image) }}
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ include "pawtograder.postgres.host" . }}
            - name: PGPORT
              value: {{ .Values.postgres.service.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            # supabase_admin (superuser) is needed because pawtograder
            # migrations install pgsodium via CREATE EXTENSION, which the
            # demoted `postgres` role can no longer do.
            - name: PGUSER
              value: supabase_admin
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.names.postgres }}
                  key: POSTGRES_PASSWORD
            # See values.yaml `migrations.resetOnDrift` for semantics.
            - name: MIGRATIONS_RESET_ON_DRIFT
              value: {{ .Values.migrations.resetOnDrift | default false | quote }}
            # Deployment tier, so migrate.sh can independently refuse the
            # destructive drift reset on a durable env even if RESET_ON_DRIFT is
            # somehow set — defense in depth behind templates/validations.yaml.
            - name: MIGRATIONS_ENVIRONMENT
              value: {{ .Values.global.environment | default "dev" | quote }}
            # DB→edge callback wiring. migrate.sh Phase 4 rewrites the vault
            # `supabase_project_url` / `edge-function-secret` (seeded with local
            # dev defaults by the gradebook migration) so pg_cron / triggers can
            # reach the in-cluster edge runtime through Kong. Without this,
            # gradebook recalculation and other DB-driven edge calls silently
            # no-op because host.docker.internal:54321 isn't reachable in-cluster.
            - name: SUPABASE_PROJECT_URL
              value: "http://{{ include "pawtograder.kong.host" . }}:{{ .Values.kong.service.port }}"
            {{- if .Values.edgeFunctions.e2e.enabled }}
            # The e2e overlay overrides the edge runtime's EDGE_FUNCTION_SECRET
            # (pawtograder-e2e secret), so the vault copy must match or the
            # edge function rejects the call with "Invalid secret".
            - name: EDGE_FUNCTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pawtograder-e2e
                  key: EDGE_FUNCTION_SECRET
            {{- else }}
            # Production / staging: if the operator provided EDGE_FUNCTION_SECRET
            # in the edge-functions Secret, Phase 4 writes the same value into
            # vault so DB-triggered callbacks authenticate against the runtime.
            # Optional keeps existing installs that rely on the legacy seeded
            # default rendering; prod values include the `misc` bundle so this
            # should be present there.
            - name: EDGE_FUNCTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.names.edgeFunctions }}
                  key: EDGE_FUNCTION_SECRET
                  optional: true
            {{- end }}
            # Cache invalidation (Phase 4 seeds vault vercel_host +
            # cache_invalidation_secret). HOST is the in-cluster web service the
            # DB trigger POSTs to; SECRET must match the web app's
            # CACHE_INVALIDATION_SECRET, so read it from the SAME source web does
            # (e2e secret for previews, web secret for prod — mirrors
            # EDGE_FUNCTION_SECRET above).
            - name: CACHE_INVALIDATION_HOST
              value: "http://{{ include "pawtograder.web.host" . }}:{{ .Values.web.service.port }}"
            {{- if .Values.edgeFunctions.e2e.enabled }}
            - name: CACHE_INVALIDATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pawtograder-e2e
                  key: CACHE_INVALIDATION_SECRET
                  optional: true
            {{- else }}
            - name: CACHE_INVALIDATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.names.web }}
                  key: CACHE_INVALIDATION_SECRET
                  optional: true
            {{- end }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      {{- with (include "pawtograder.nodeSelector" (dict "ctx" . "component" .Values.postgres)) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "pawtograder.tolerations" (dict "ctx" . "component" .Values.postgres)) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
