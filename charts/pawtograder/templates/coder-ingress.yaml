{{- if and .Values.coder.enabled .Values.coderBootstrap.enabled .Values.coderBootstrap.publishIngress }}
{{- $in := .Values.coder.coder.ingress }}
{{- $wildcard := regexReplaceAll "\\*[^.]*(\\..*)" ($in.wildcardHost | default "") "*${1}" }}
# A hook after coder-bootstrap: until the first owner exists, /api/v2/users/first lets anyone claim it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "coder") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with $in.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with $in.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    {{- range $host := compact (list $in.host $wildcard) }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coder
                port:
                  name: http
    {{- end }}
  {{- if and $in.tls $in.tls.enable }}
  tls:
    - hosts: [{{ $in.host | quote }}]
      secretName: {{ $in.tls.secretName | quote }}
    {{- if and $wildcard $in.tls.wildcardSecretName }}
    - hosts: [{{ $wildcard | quote }}]
      secretName: {{ $in.tls.wildcardSecretName | quote }}
    {{- end }}
  {{- end }}
{{- end }}
