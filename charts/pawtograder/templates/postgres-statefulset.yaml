{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pawtograder.postgres.host" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
  selector:
    {{- include "pawtograder.componentSelectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pawtograder.postgres.host" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "pawtograder.postgres.host" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "pawtograder.componentSelectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      # Version-STABLE labels: full componentLabels MINUS helm.sh/chart +
      # app.kubernetes.io/version (which change on every chart bump). A
      # StatefulSet rolls its pods whenever the template changes, so the full
      # componentLabels rolled the PRIMARY on every version bump (no real config
      # change) — a needless restart that, with the sidecars' slow SIGTERM, took
      # the DB down ~10 min. componentStableLabels keeps the stable common/managed
      # labels (managed-by, global.commonLabels — needed by policy/cost/admission
      # selectors) but drops only the version labels; with the version-independent
      # checksum/config, the template changes only when the postgres config does.
      labels:
        {{- include "pawtograder.componentStableLabels" (dict "ctx" . "component" "postgres") | nindent 8 }}
      annotations:
        # Hash only the CONFIG content, not the chart-version-carrying metadata
        # labels (helm.sh/chart, app.kubernetes.io/version) that
        # pawtograder.componentLabels stamps on the rendered ConfigMap. Without
        # the strip, every chart-version bump changed this hash and needlessly
        # rolled the primary StatefulSet — a brief write outage that also
        # cascaded into false `helm --wait` failures on dependent tiers. Proven:
        # with the strip the hash is identical across versions yet still changes
        # on a real postgresql.conf / pg_hba edit. (Explicit arg order, not a
        # pipe: sprig regexReplaceAll is regexReplaceAll(regex, input, repl).)
        #
        # Also hash the postgres_exporter custom-queries ConfigMap (empty unless
        # monitoring.enabled): the exporter SIDECAR mounts it and reads it ONLY at
        # startup. Without this, adding/altering a collector (e.g. the
        # replication-lag query) on an in-place upgrade would update the mounted
        # file but never restart the sidecar, so the new metric stays absent until
        # a manual roll.
        #
        # Hash the NAMED TEMPLATE, not the monitoring.yaml file that emits it. That
        # file also carries every ServiceMonitor in the chart, none of which the
        # primary reads, so hashing the file coupled the primary to unrelated
        # scrape wiring: adding the edge-functions worker tier changed this hash
        # and rolled the DB. The queries template is byte-identical across that
        # flip (pinned in tests/render-guardrails.sh). Narrowing the input also
        # retires the old `interval`/`scrapeTimeout` strip arm, which existed only
        # to undo the over-broad hash — and which would have silently swallowed a
        # real query line containing an `interval:` key.
        {{- $exporterQueries := "" }}
        {{- if .Values.monitoring.enabled }}
          {{- $exporterQueries = include "pawtograder.postgresExporterQueries" . }}
        {{- end }}
        checksum/config: {{ regexReplaceAll "(?m)^.*(helm\\.sh/chart|app\\.kubernetes\\.io/version):.*$" (printf "%s\n%s" (include (print $.Template.BasePath "/postgres-config.yaml") .) $exporterQueries) "" | sha256sum }}
    spec:
      serviceAccountName: {{ include "pawtograder.serviceAccountName" . }}
      {{- include "pawtograder.imagePullSecrets" . | nindent 6 }}
      {{- include "pawtograder.priorityClassName" (dict "ctx" . "component" .Values.postgres) | nindent 6 }}
      {{- /* fsGroup 102 (supabase/postgres group) + seccomp; see postgres.podSecurityContext in values */}}
      {{- include "pawtograder.podSecurityContext" (dict "ctx" . "component" .Values.postgres) | nindent 6 }}
      # Long grace so a busy postgres can checkpoint + flush WAL instead of
      # being SIGKILLed 30s into a drain and paying a recovery replay on the
      # next boot.
      terminationGracePeriodSeconds: {{ .Values.postgres.terminationGracePeriodSeconds | default 600 }}
      containers:
        - name: postgres
          image: {{ include "pawtograder.image" (dict "ctx" . "image" .Values.postgres.image) }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          {{- /* opted out by default (postgres.containerSecurityContext: {});
               renders only if an overlay sets one */}}
          {{- include "pawtograder.containerSecurityContext" (dict "ctx" . "component" .Values.postgres) | nindent 10 }}
          # Fast shutdown on pod termination. k8s sends SIGTERM, which postgres
          # treats as SMART shutdown — it waits for existing sessions to close,
          # and the app holds many long-lived ones (realtime/PostgREST LISTEN),
          # so termination could ride the full terminationGracePeriodSeconds to a
          # SIGKILL. This preStop does a FAST shutdown (disconnect clients, roll
          # back open txns, checkpoint, exit — seconds) BEFORE the SIGTERM, so a
          # roll / node drain terminates promptly and cleanly.
          #
          # pg_ctl REFUSES to run as root. The container may be root (chart
          # default: containerSecurityContext {} — the entrypoint needs root for
          # first-boot chown, then drops to postgres itself) or already postgres
          # (when an overlay sets runAsUser, as values-prod does). Drop to the
          # postgres user via gosu when root; run directly otherwise. No `|| true`
          # mask: a failed fast shutdown must surface (k8s proceeds to SIGTERM +
          # the grace backstop regardless), instead of silently falling back to
          # the slow smart shutdown this hook exists to avoid.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    if [ "$(id -u)" = "0" ]; then
                      exec gosu postgres pg_ctl -D "$PGDATA" -m fast -w -t {{ .Values.postgres.fastShutdownTimeoutSeconds | default 120 }} stop
                    else
                      exec pg_ctl -D "$PGDATA" -m fast -w -t {{ .Values.postgres.fastShutdownTimeoutSeconds | default 120 }} stop
                    fi
          ports:
            - name: postgres
              containerPort: 5432
          args:
            - "-c"
            - "config_file=/etc/postgresql/postgresql.conf"
            - "-c"
            - "hba_file=/etc/postgresql/pg_hba.conf"
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            # Bootstrap superuser MUST be supabase_admin: the supabase migration
            # `10000000000000_demote-postgres.sql` removes SUPERUSER from
            # `postgres`, which fails on Postgres ("bootstrap superuser must
            # have SUPERUSER attribute") if `postgres` is the initdb user.
            # The migrate.sh script later creates the `postgres` role itself.
            - name: POSTGRES_USER
              value: supabase_admin
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.names.postgres }}
                  key: POSTGRES_PASSWORD
            - name: PAWTOGRADER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.names.postgres }}
                  key: PAWTOGRADER_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.names.jwt }}
                  key: JWT_SECRET
            {{- if .Values.postgres.walg.enabled }}
            # wal-g config for archive_command (postgres runs it, inheriting
            # this env). Shared with the base-backup sidecar + replica.
            {{- include "pawtograder.walg.env" . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
            - name: config
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
            - name: config
              mountPath: /etc/postgresql/pgsodium_getkey.sh
              subPath: pgsodium_getkey.sh
            - name: config
              mountPath: /docker-entrypoint-initdb.d/00-supabase-admin.sh
              subPath: 00-supabase-admin.sh
            - name: config
              mountPath: /docker-entrypoint-initdb.d/zy-app-role.sh
              subPath: init-app-role.sh
            - name: config
              mountPath: /docker-entrypoint-initdb.d/zz-supabase-passwords.sh
              subPath: zz-supabase-passwords.sh
            - name: pgsodium
              mountPath: /var/run/secrets/pgsodium
              readOnly: true
          readinessProbe:
            exec:
              command:
                - pg_isready
                # Probe the bootstrap superuser, not `postgres`. The
                # `postgres` role is created later by migrate.sh; on first
                # boot it doesn't exist yet, so probing it would keep the
                # pod NotReady (or trip liveness) until migrations finish.
                - -U
                - supabase_admin
                - -d
                - {{ .Values.postgres.database }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          # NO livenessProbe. Deliberate, and load-bearing — see the 2026-08-27
          # incident below before adding one back.
          #
          # There was one here: pg_isready with initialDelaySeconds 30,
          # periodSeconds 10, timeoutSeconds 5 and failureThreshold unset, so it
          # inherited the Kubernetes default of 3 — about 30 seconds of tolerance.
          # It took the platform down twice in one day:
          #
          #   14:02:19.677  all 7 pg_cron jobs log "job startup timeout"
          #                 (the postmaster could not fork background workers)
          #   14:02:44      kubelet: "Container postgres failed liveness probe,
          #                 will be restarted"
          #   14:02:45.452  shutdown checkpoint: 1397 buffers, write=0.122s,
          #                 sync=0.002s  <- storage was already FINE
          #   14:02:46.169  database system is shut down
          #   14:02:51      all 3 realtime pods exit 1 (Postgrex admin_shutdown ->
          #                 Erlang app exit + crash dump)
          #   17:18:18      the same sequence again, on postgres-replica-0
          #
          # The probe was not wrong. pg_cron's "job startup timeout" means the
          # postmaster genuinely could not fork workers, which is exactly what
          # pg_isready needs; it really was unresponsive for 25s+. But the
          # condition was transient and self-resolving: the shutdown checkpoint
          # one second after the kill flushed 1397 buffers in 0.122s with a 2ms
          # sync, so storage was healthy again by then. The probe's patience ran
          # out roughly a second before the problem cleared itself.
          #
          # Cause was external: network maintenance that day. PGDATA is NetApp
          # NFS, and hard mounts BLOCK rather than error, so the fork path stalled
          # while Postgres logged nothing — the log is empty for the 12 minutes
          # before the kill.
          #
          # Why removed rather than loosened. Restarting a single-writer Postgres
          # cannot fix external storage, so waiting is strictly better. Liveness
          # only helps a permanently wedged postmaster, which is rare, warrants a
          # human, and on this stack means manual failover anyway. Against that,
          # every misfire costs the 4GB warm buffer pool, every connection, and a
          # hard exit of all three realtime pods (dropping every WebSocket client
          # at once). The expected value is negative.
          #
          # Loosening to ~90s (timeoutSeconds 10 / periodSeconds 15 /
          # failureThreshold 6) was the other candidate and is NOT enough, because
          # of a second failure mode: pg_isready also exits non-zero during crash
          # recovery, printing "rejecting connections" (observed on the replica
          # during startup). This database is ~29 GB, so WAL replay after any
          # unclean stop can exceed 90 seconds — and initialDelaySeconds does not
          # help, it delays the first probe rather than widening the window once
          # probing starts. Liveness would then kill the pod MID-RECOVERY, and
          # each kill is another unclean stop with more WAL to replay than the
          # last: a self-worsening restart loop at the exact moment the database
          # can least afford one.
          #
          # What this trades away: a permanently wedged postmaster is no longer
          # restarted automatically. The pod stays Running and NotReady until
          # someone intervenes. Readiness (kept below) stops traffic being routed
          # here, which is the useful half of the signal and is non-destructive.
          #
          # The other half of the trade is DETECTION, and it had to be built —
          # an earlier version of this comment claimed the pawtograder.app group
          # would page critical within 1-5m once the app could not reach the DB.
          # That was WRONG, and the error mattered because it was the safety
          # argument for removing the probe. Every critical rule in that group is
          # `metric > threshold` on a series that DISAPPEARS when the database is
          # gone (the queue gauges come from the metrics edge function, whose
          # handler returns HTTP 500 when its first DB RPC fails), and a threshold
          # against no data returns no data. They fail OPEN. Same for
          # PawtograderPostgresConnectionsSaturated, which reads the exporter
          # sidecar in THIS pod. Before the fix a wedged primary was silent for 30
          # minutes and then only warned (PawtograderPostgresExporterDown).
          #
          # PawtograderPostgresUnavailable now covers it: critical, for 5m, keyed
          # on kube_statefulset_status_replicas_ready from kube-state-metrics —
          # deliberately OUTSIDE this pod, so it survives both a dead database and
          # a dead exporter. See templates/prometheus-rules.yaml. Detection
          # without amputation, but only because that rule exists: do not remove
          # it and leave this probe removed.
          #
          # If you reintroduce a liveness probe, you must also update the
          # assertion in charts/pawtograder/tests/render-guardrails.sh that pins
          # its absence.
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
        {{- if and .Values.postgres.walg.enabled .Values.postgres.walg.baseBackup.enabled }}
        # Base-backup sidecar. wal-g backup-push reads the data directory
        # directly, so it must run co-located with PGDATA (shares the `data`
        # volume, same pod). A plain interval loop — postgres has no cron for
        # this — takes a full backup every intervalHours, then prunes so only
        # keepBackups remain (wal-g delete also drops WAL older than the oldest
        # retained base backup). Uses the postgres socket in /var/run/postgresql
        # to read control data; connects as the local supabase_admin.
        - name: base-backup
          image: {{ include "pawtograder.image" (dict "ctx" . "image" .Values.postgres.image) }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command:
            - bash
            - -c
            - |
              set -uo pipefail
              export PGDATA=/var/lib/postgresql/data/pgdata
              INTERVAL=$(( {{ .Values.postgres.walg.baseBackup.intervalHours | default 24 }} * 3600 ))
              KEEP={{ .Values.postgres.walg.baseBackup.keepBackups | default 8 }}
              # Exit promptly on SIGTERM. Every long op runs as a backgrounded
              # child that we `wait` on, and the trap kills it and exits. Without
              # this, bash defers the signal until the foreground `sleep ${INTERVAL}`
              # (up to intervalHours) returns — so on a pod roll postgres shuts
              # down cleanly but this sidecar pins the pod in Terminating until the
              # 600s grace SIGKILL, stalling the StatefulSet's replacement primary
              # (and cascading DB_HOST=nxdomain crashes in dependents).
              CHILD=""
              trap 'echo "[base-backup] SIGTERM — exiting"; [ -n "$CHILD" ] && kill "$CHILD" 2>/dev/null; exit 0' TERM INT
              # Clear CHILD once the child reaps, so a SIGTERM landing between
              # `run` calls can't kill an exited/reused PID.
              run() { "$@" & CHILD=$!; wait "$CHILD"; local rc=$?; CHILD=""; return $rc; }
              echo "[base-backup] first run in {{ .Values.postgres.walg.baseBackup.initialDelaySeconds | default 120 }}s, then every ${INTERVAL}s (keep ${KEEP})"
              run sleep {{ .Values.postgres.walg.baseBackup.initialDelaySeconds | default 120 }}
              while true; do
                echo "[base-backup] $(date -u +%FT%TZ) wal-g backup-push"
                if run wal-g backup-push "$PGDATA"; then
                  # Retention: keep the newest ${KEEP} full backups; --confirm
                  # actually deletes (dry-run without it). Non-fatal if it fails
                  # — a failed prune must not stop future backups.
                  run wal-g delete retain FULL "${KEEP}" --confirm || echo "[base-backup] WARN: retention prune failed"
                else
                  echo "[base-backup] ERROR: backup-push failed; will retry next cycle"
                fi
                run sleep "${INTERVAL}"
              done
          env:
            # Connect over TCP to the postgres container in the same pod. Per
            # pg_hba.conf, 127.0.0.1/32 is `trust`, so backup-push's connection
            # (pg_backup_start/stop) needs no password.
            - name: PGHOST
              value: "127.0.0.1"
            - name: PGPORT
              value: {{ .Values.postgres.service.port | quote }}
            - name: PGUSER
              value: supabase_admin
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            {{- include "pawtograder.walg.env" . | nindent 12 }}
          volumeMounts:
            # Read-only view of the data dir wal-g backs up (same PVC as the
            # primary — safe because backup-push only reads it).
            - name: data
              mountPath: /var/lib/postgresql/data
              readOnly: true
          resources:
            {{- toYaml .Values.postgres.walg.baseBackup.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.monitoring.enabled }}
        # postgres_exporter sidecar — connects via TCP to localhost (the
        # postgres container in the same pod). pg_stat_statements is
        # available because supabase/postgres ships it preinstalled;
        # see the queries.yaml ConfigMap for the custom collectors that
        # surface supabase-specific tables (auth.users, storage.buckets,
        # realtime.messages partitions, gradebook recalc backlog, etc.).
        - name: postgres-exporter
          image: {{ .Values.monitoring.postgresExporter.image.repository }}:{{ .Values.monitoring.postgresExporter.image.tag }}
          imagePullPolicy: {{ .Values.monitoring.postgresExporter.image.pullPolicy }}
          {{- /* the exporter is a static nonroot binary — global default applies */}}
          {{- include "pawtograder.containerSecurityContext" (dict "ctx" . "component" .Values.monitoring.postgresExporter) | nindent 10 }}
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
              value: "true"
            - name: PG_EXPORTER_EXTEND_QUERY_PATH
              value: /etc/postgres-exporter/queries.yaml
            - name: DATA_SOURCE_URI
              value: "127.0.0.1:5432/{{ .Values.postgres.database }}?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: supabase_admin
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.names.postgres }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-exporter-queries
              mountPath: /etc/postgres-exporter
              readOnly: true
          resources:
            {{- toYaml .Values.monitoring.postgresExporter.resources | nindent 12 }}
        {{- end }}
      volumes:
        {{- if not .Values.postgres.persistence.enabled }}
        # No PVC requested — back the data dir with an emptyDir so the pod
        # can still start. NOTE: emptyDir is ephemeral; the database is
        # wiped whenever the pod is rescheduled. Only useful for previews
        # / disposable test environments. Persistent deployments must set
        # postgres.persistence.enabled=true.
        - name: data
          emptyDir: {}
        {{- end }}
        - name: config
          configMap:
            name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "postgres-config") }}
            defaultMode: 0644
            items:
              - key: postgresql.conf
                path: postgresql.conf
              - key: pg_hba.conf
                path: pg_hba.conf
              - key: init-app-role.sh
                path: init-app-role.sh
                mode: 0755
              - key: 00-supabase-admin.sh
                path: 00-supabase-admin.sh
                mode: 0755
              - key: zz-supabase-passwords.sh
                path: zz-supabase-passwords.sh
                mode: 0755
              - key: pgsodium_getkey.sh
                path: pgsodium_getkey.sh
                mode: 0755
        - name: pgsodium
          secret:
            secretName: {{ .Values.secrets.names.jwt }}
            defaultMode: 0444
            items:
              - key: PGSODIUM_ROOT_KEY
                path: PGSODIUM_ROOT_KEY
                mode: 0444
        {{- if .Values.monitoring.enabled }}
        - name: postgres-exporter-queries
          configMap:
            name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "postgres-exporter") }}
            defaultMode: 0444
        {{- end }}
      {{- with (include "pawtograder.nodeSelector" (dict "ctx" . "component" .Values.postgres)) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "pawtograder.tolerations" (dict "ctx" . "component" .Values.postgres)) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "pawtograder.affinity" (dict "ctx" . "component" .Values.postgres)) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.postgres.persistence.annotations }}
        # Provisioner hints applied at PVC-creation time — e.g. NetApp Trident
        # `trident.netapp.io/unixPermissions` so a non-root (uid 101) postgres
        # can create PGDATA on a fresh root-squashed NFS volume.
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.postgres.persistence.accessMode }}
        {{- if .Values.postgres.persistence.storageClass }}
        storageClassName: {{ .Values.postgres.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
  {{- end }}
{{- end }}
