{{- if and .Values.postgres.enabled .Values.backup.enabled }}
{{- /* The bucket's whole lifecycle configuration, one expiry rule per tier.
       The job imports exactly this; see the reconcile step in the script. */ -}}
{{- $ret := .Values.backup.retention -}}
{{- $rules := list (dict "ID" "pawtograder-daily" "Status" "Enabled" "Filter" (dict "Prefix" "daily/") "Expiration" (dict "Days" (int $ret.dailyDays))) -}}
{{- if gt (int $ret.monthlyDays) 0 -}}
{{- $rules = append $rules (dict "ID" "pawtograder-monthly" "Status" "Enabled" "Filter" (dict "Prefix" "monthly/") "Expiration" (dict "Days" (int $ret.monthlyDays))) -}}
{{- end -}}
{{- if gt (int $ret.legacyRootDays) 0 -}}
{{- /* Root-level keys only: daily/... and monthly/... do not start with "pawtograder-". */ -}}
{{- $rules = append $rules (dict "ID" "pawtograder-legacy-root" "Status" "Enabled" "Filter" (dict "Prefix" "pawtograder-") "Expiration" (dict "Days" (int $ret.legacyRootDays))) -}}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "backup") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "backup") | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  # Skip (and mark missed) a run that couldn't start within this window of
  # its slot, instead of piling up stale runs after controller downtime.
  startingDeadlineSeconds: {{ .Values.backup.startingDeadlineSeconds | default 1800 }}
  # Each retained pod holds its scratch PVC until the pod is deleted, so these
  # limits are also the retained-storage lever: worst case is
  # (successful + failed x attempts) x backup.scratchSize of REQUESTED capacity,
  # which matters under a namespace storage quota even though `rm` frees the
  # bytes. Successful runs default to 1 for that reason; failures keep 3,
  # because with restartPolicy: Never each attempt is a separate pod and those
  # logs are the whole point of retaining them.
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit | default 1 }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      backoffLimit: 2
      # Hard ceiling so a wedged dump/upload fails loudly rather than
      # running forever (Forbid would then silently skip every later run).
      activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds | default 3600 }}
      # NOTE: deliberately NO ttlSecondsAfterFinished here. The
      # PawtograderBackupJobFailed alert reads kube_job_status_failed off this
      # Job object, so a TTL would let a failed backup delete its own alert.
      # Reclamation is left to successful/failedJobsHistoryLimit above, which
      # reap each pod's scratch PVC along with the Job.
      template:
        metadata:
          labels:
            {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "backup") | nindent 12 }}
        spec:
          # Never, NOT OnFailure. Under OnFailure the backoff limit counts
          # container restarts INSIDE one pod, so status.failed reads 1 (not 3)
          # and the controller DELETES the pod when the limit trips — taking
          # every attempt's logs with it, which is exactly the state a failed
          # nightly backup leaves you to debug. With Never each attempt is its
          # own pod whose logs survive until the history limit reaps the Job.
          restartPolicy: Never
          serviceAccountName: {{ include "pawtograder.serviceAccountName" . }}
          # Deliberately NO fsGroup, unlike the restore-drill: this container
          # runs as root (it apt-installs mc), so it needs no group ownership
          # help, and setting fsGroup would make kubelet chown the volume root —
          # which a root-squashed NFS export rejects. What actually lets a
          # squashed-root writer use a brand-new NetApp volume is the 0777
          # Trident annotation on the claim below.
          {{- include "pawtograder.imagePullSecrets" . | nindent 10 }}
          containers:
            - name: backup
              image: {{ include "pawtograder.image" (dict "ctx" . "image" .Values.backup.image) }}
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              # Run under bash, not sh: the supabase/postgres image's /bin/sh is
              # dash, which rejects `set -o pipefail` ("Illegal option -o
              # pipefail", exit 2) — without pipefail a failing pg_dump piped to
              # gzip would also be masked. bash ships in the image.
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  # Custom format (-Fc): compressed, and — unlike plain SQL —
                  # structurally verifiable offline via `pg_restore --list`
                  # (which the backup-verify CronJob runs weekly against the
                  # newest object). Restore with:
                  #   pg_restore --clean --if-exists --no-owner --no-acl -d <db> <file>
                  # /scratch, NOT /tmp: a ~7 GB dump on the container's
                  # writable layer is unaccounted node ephemeral storage, and
                  # filling it kills the dump mid-write while pressuring every
                  # other pod on the node. /scratch is a per-pod ephemeral PVC.
                  FILE="/scratch/pawtograder-${TS}.dump"
                  pg_dump -Fc > "$FILE"
                  # Verify the archive's TOC parses BEFORE uploading — a
                  # truncated/corrupt dump must fail here, not on restore day.
                  pg_restore --list "$FILE" > /dev/null
                  echo "[backup] dump OK: $(stat -c%s "$FILE") bytes"
                  # mc is BAKED IN when backup.image points at the image
                  # built from charts/pawtograder/images/backup/Dockerfile,
                  # which is the supported path: no third-party fetch on the
                  # run that has to work, and no per-run MITM surface.
                  #
                  # The runtime install below is only a fallback for installs
                  # still pointing backup.image at plain supabase/postgres.
                  # It is a liability, not a feature: on 2026-09-12 MinIO
                  # archived the open-source mc project and pulled every
                  # binary from dl.min.io, and this download started
                  # returning "410 Gone" — the dump completed and then died
                  # here, so nothing reached S3. Prefer the baked image.
                  if ! command -v mc >/dev/null 2>&1; then
                    echo "[backup] mc not in image — installing at runtime (see backup.image)"
                    apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
                    curl -fsSL "{{ .Values.backup.mc.url }}" -o /usr/local/bin/mc
                    echo "{{ .Values.backup.mc.sha256 }}  /usr/local/bin/mc" | sha256sum -c -
                    chmod +x /usr/local/bin/mc
                  fi
                  mc alias set s3 "${S3_ENDPOINT}" "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}"
                  LOCAL_SIZE=$(stat -c%s "$FILE")
                  # upload <remote>: copy the dump up, then require the object
                  # to exist remotely at exactly the local size (catches
                  # truncated multipart uploads). A mismatched object is
                  # deleted before failing: left in place, a truncated
                  # monthly/ copy would satisfy the "month already covered"
                  # check on the retry and stand in for the whole month.
                  upload() {
                    mc cp "$FILE" "$1"
                    REMOTE_SIZE=$(mc stat --json "$1" | grep -o '"size":[0-9]*' | head -1 | cut -d: -f2)
                    if [ "$LOCAL_SIZE" != "$REMOTE_SIZE" ]; then
                      echo "[backup] FATAL: size mismatch after upload to $1 (local=$LOCAL_SIZE remote=${REMOTE_SIZE:-missing})"
                      mc rm "$1" || echo "[backup] could not delete the mismatched object $1 — remove it by hand"
                      exit 1
                    fi
                    echo "[backup] uploaded + size-verified $1"
                  }
                  # Set when a step after the daily upload fails. The run still
                  # finishes (rm, lifecycle reconcile) and then exits non-zero,
                  # so PawtograderBackupJobFailed fires without the verified
                  # daily dump costing tonight's lifecycle pass.
                  DEFERRED_FAILURE=""
                  # daily/ and monthly/ are hardcoded, not values: the
                  # lifecycle rules below, backup-verify and the restore drill
                  # all key off them.
                  upload "s3/${S3_BUCKET}/daily/$(basename "$FILE")"
                  {{- if gt (int .Values.backup.retention.monthlyDays) 0 }}
                  # Monthly tier: the first good run of each UTC month keeps a
                  # second copy. Keyed on "monthly/ has nothing for this month
                  # yet" rather than "today is the 1st", so a failed run on
                  # the 1st is covered by the next good one. A FAILED listing
                  # is not "nothing yet": treating it so would upload a full
                  # dump every night the listing stays broken, ~90 copies in
                  # a 90-day tier instead of 3.
                  if MONTH_LISTING=$(mc ls "s3/${S3_BUCKET}/monthly/pawtograder-${TS:0:6}"); then
                    if grep -q '\.dump$' <<<"$MONTH_LISTING"; then
                      echo "[backup] monthly/ already holds a ${TS:0:6} dump"
                    else
                      upload "s3/${S3_BUCKET}/monthly/$(basename "$FILE")"
                    fi
                  else
                    echo "[backup] FATAL: could not list monthly/ — skipping the monthly copy rather than risk one per night"
                    DEFERRED_FAILURE="monthly listing failed"
                  fi
                  {{- end }}
                  # Drop the local copy now the remote is byte-verified, so a
                  # retained completed pod's PVC doesn't hold a dump-sized chunk
                  # of the scratch tier until the history limit reaps it.
                  rm -f "$FILE"
                  # Retention: reconcile the bucket's lifecycle rules with
                  # BACKUP_LIFECYCLE (rendered from backup.retention). The
                  # chart <= 0.3.27 job only ADDED a rule when none existed,
                  # so changing retentionDays on a live bucket did nothing.
                  #
                  # The job owns rules whose ID starts with "pawtograder-".
                  # It also removes any other EXPIRY rule (by days or by date)
                  # that could match daily/ or monthly/ keys — a bucket-wide
                  # rule like the old job's, or a prefix such as "d" — since it
                  # would override the tiers. A rule filtered by tag is kept:
                  # the job never tags dumps, so it cannot match them. Every
                  # other rule is ops' and is kept as exported; a
                  # noncurrent-version expiry on a versioned bucket is the one
                  # that matters, and dropping it would let old versions pile
                  # up forever.
                  #
                  # Rules compare in a canonical form: falsy fields dropped,
                  # Prefix lifted out of Filter/And, keys sorted. So a server
                  # that reorders keys, nests Prefix under And or adds empty
                  # defaults does not look like drift, while an owned rule
                  # that gained a tag, size condition or extra action does.
                  #
                  # lifecycle plan <export>: exit 0 = in sync; 10 = prints the
                  # merged config to import. lifecycle check <merged>
                  # <export>: exit 0 when the bucket holds exactly the merged
                  # config, ops rules included. Any other exit, including an
                  # export error other than "no lifecycle configuration",
                  # stops: importing over a config we could not read would
                  # delete ops' rules.
                  lifecycle() {
                    python3 - "$@" <<'PY'
                  import json, os, sys
                  mode = sys.argv[1]
                  want_doc = sys.argv[2] if mode == "check" else os.environ["BACKUP_LIFECYCLE"]
                  export_doc = sys.argv[-1]
                  try:
                      exported = json.loads(export_doc)
                  except ValueError:
                      sys.exit("[backup] FATAL: unparseable lifecycle export: " + export_doc)
                  if exported.get("status") == "success":
                      current = (exported.get("config") or {}).get("Rules") or []
                  elif "NoSuchLifecycleConfiguration" in export_doc:
                      current = []
                  else:
                      sys.exit("[backup] FATAL: could not read the bucket's lifecycle rules: " + export_doc)
                  def strip(v):
                      if isinstance(v, dict):
                          v = {k: strip(x) for k, x in v.items()}
                          return {k: x for k, x in v.items() if x not in (None, "", 0, False, {}, [])}
                      if isinstance(v, list):
                          return [strip(x) for x in v]
                      return v
                  def split(r):
                      r = strip(r)
                      f = dict(r.pop("Filter", None) or {})
                      a = dict(f.pop("And", None) or {})
                      p = next((c for c in (r.pop("Prefix", ""), f.pop("Prefix", ""), a.pop("Prefix", "")) if c), "")
                      if a:
                          f["And"] = a
                      return r, p, f
                  def canon(r):
                      rest, p, f = split(r)
                      return json.dumps([rest, p, f], sort_keys=True)
                  def owned(r):
                      return str(r.get("ID", "")).startswith("pawtograder-")
                  def overrides_tiers(r):
                      rest, p, f = split(r)
                      exp = rest.get("Expiration") or {}
                      tagged = f.get("Tag") or (f.get("And") or {}).get("Tags")
                      return (not owned(r) and bool(exp.get("Days") or exp.get("Date")) and not tagged
                              and any(k.startswith(p) for k in ("daily/pawtograder-", "monthly/pawtograder-")))
                  def same(a, b):
                      return sorted(map(canon, a)) == sorted(map(canon, b))
                  want = json.loads(want_doc)["Rules"]
                  if mode == "check":
                      sys.exit(0 if same(current, want) else 1)
                  kept = [r for r in current if not owned(r) and not overrides_tiers(r)]
                  merged = kept + want
                  if same(current, merged):
                      sys.exit(0)
                  for r in current:
                      if overrides_tiers(r):
                          print("[backup] removing expiry rule %s: it would expire daily/ or monthly/ dumps outside the tiers"
                                % r.get("ID"), file=sys.stderr)
                  for r in kept:
                      print("[backup] keeping ops-owned lifecycle rule %s" % r.get("ID"), file=sys.stderr)
                  print(json.dumps({"Rules": merged}))
                  sys.exit(10)
                  PY
                  }
                  export_rules() { mc ilm rule export --json "s3/${S3_BUCKET}" 2>&1 || true; }
                  RC=0; MERGED=$(lifecycle plan "$(export_rules)") || RC=$?
                  if [ "$RC" -eq 0 ]; then
                    echo "[backup] lifecycle rules already match backup.retention"
                  elif [ "$RC" -eq 10 ]; then
                    echo "[backup] importing lifecycle configuration: $MERGED"
                    printf '%s' "$MERGED" | mc ilm rule import "s3/${S3_BUCKET}"
                    # Read it back and compare ALL of it. A server that
                    # accepted the import but dropped a filter, or dropped an
                    # ops rule such as the noncurrent-version expiry, would
                    # otherwise fail in silence; failing here fires
                    # PawtograderBackupJobFailed instead.
                    APPLIED=$(export_rules)
                    if ! lifecycle check "$MERGED" "$APPLIED"; then
                      echo "[backup] FATAL: lifecycle read back differs from what was imported: $APPLIED"
                      exit 1
                    fi
                    echo "[backup] lifecycle configuration applied and read back"
                  else
                    exit 1
                  fi
                  if [ -n "$DEFERRED_FAILURE" ]; then
                    echo "[backup] FATAL: $DEFERRED_FAILURE (the daily dump itself landed and was verified)"
                    exit 1
                  fi
              volumeMounts:
                - { name: scratch, mountPath: /scratch }
              env:
                - name: PGHOST
                  value: {{ include "pawtograder.postgres.host" . }}
                - name: PGPORT
                  value: {{ .Values.postgres.service.port | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgres.database | quote }}
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.names.postgres }}
                      key: POSTGRES_PASSWORD
                - name: S3_ENDPOINT
                  value: {{ required "backup.s3.endpoint is required when backup.enabled=true" .Values.backup.s3.endpoint | quote }}
                - name: S3_BUCKET
                  value: {{ required "backup.s3.bucket is required when backup.enabled=true" .Values.backup.s3.bucket | quote }}
                - name: BACKUP_LIFECYCLE
                  value: {{ dict "Rules" $rules | toJson | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.names.s3 }}
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.names.s3 }}
                      key: AWS_SECRET_ACCESS_KEY
          volumes:
            # Dump staging area. A generic ephemeral volume, not an emptyDir:
            # an emptyDir — even with sizeLimit — still draws on the same node
            # ephemeral storage, so it would only convert a silent disk-full
            # into a fast eviction. This gives the dump its own volume, created
            # per pod and deleted with it.
            - name: scratch
              ephemeral:
                volumeClaimTemplate:
                  metadata:
                    annotations:
                      trident.netapp.io/unixPermissions: "0777"
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    {{- with .Values.backup.scratchStorageClass | default .Values.postgres.persistence.storageClass }}
                    # Omitted when empty so the cluster's DEFAULT StorageClass
                    # applies — an explicit "" would instead disable dynamic
                    # provisioning entirely and leave the PVC Pending forever.
                    storageClassName: {{ . | quote }}
                    {{- end }}
                    resources:
                      requests:
                        storage: {{ .Values.backup.scratchSize | default "30Gi" | quote }}
{{- end }}
