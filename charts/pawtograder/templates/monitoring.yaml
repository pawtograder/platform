{{- /*
The postgres_exporter custom-queries ConfigMap, factored into a named template
so postgres-statefulset.yaml can hash EXACTLY the bytes its exporter sidecar
mounts. Hashing the whole of monitoring.yaml instead swept in every
ServiceMonitor in the file, so unrelated scrape wiring — most recently the
edge-functions worker tier — rolled the Postgres primary. Emitted below,
unchanged, so the rendered ConfigMap is byte-identical to before the split.
*/ -}}
{{- define "pawtograder.postgresExporterQueries" -}}
# postgres_exporter — custom queries that surface supabase/pawtograder
# semantics on top of the default pg_stat_database / pg_stat_user_tables
# coverage. Keep query names stable: dashboards reference them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "postgres-exporter") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "postgres-exporter") | nindent 4 }}
data:
  queries.yaml: |
    pg_replication_slots:
      query: |
        SELECT slot_name,
               (active)::int AS active,
               COALESCE(pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn), 0)::float AS lag_bytes
        FROM pg_replication_slots
      master: true
      metrics:
        - slot_name:
            usage: "LABEL"
            description: "Replication slot name"
        - active:
            usage: "GAUGE"
            description: "1 if the slot is currently active, 0 otherwise"
        - lag_bytes:
            usage: "GAUGE"
            description: "WAL bytes between current_wal_lsn and the slot's confirmed_flush_lsn"

    # Streaming-standby health, from the PRIMARY side. The chart creates NO
    # physical replication slot (see docs/operations/point-in-time-recovery.md),
    # so pg_replication_slots is empty and its lag_bytes series never appears —
    # standby lag must be read from pg_stat_replication instead. streaming_standbys
    # drives PawtograderReplicaNotStreaming; max_replay_lag_bytes drives
    # PawtograderReplicaLagHigh. Emitted as pawtograder_replication_*.
    #
    # Standby-safe: pg_current_wal_lsn() ERRORS in recovery and would 500 the
    # whole /metrics endpoint on a standby. Today only the primary is scraped (the
    # postgres-exporter Service selects component=postgres; the replica pod is
    # component=postgres-replica and carries no exporter sidecar), so this runs on
    # the primary and never in recovery — but the pg_is_in_recovery() guard makes
    # it harmless even if an exporter is ever added to the replica: on a standby
    # the CASE takes the THEN branch and the LSN subquery is never evaluated. The
    # outer SELECT always returns exactly one row so the series is stable.
    #
    # PHYSICAL standbys only: pg_stat_replication has one row per WAL sender, which
    # includes LOGICAL replication clients. This is a wal_level=logical Supabase
    # stack, and Realtime streams via logical replication as user `supabase_admin`
    # (realtime.yaml DB_USER) — counting those rows would let a live Realtime
    # connection mask a dead physical standby, and skew the lag max. The physical
    # standby authenticates as `supabase_replication_admin` (postgres-replica.yaml
    # primary_conninfo / postgres-config.yaml), so filter on that role.
    pawtograder_replication:
      query: |
        SELECT
          (SELECT count(*) FROM pg_stat_replication
             WHERE state = 'streaming' AND usename = 'supabase_replication_admin')::float
            AS streaming_standbys,
          COALESCE(
            CASE WHEN pg_is_in_recovery() THEN 0
                 ELSE (SELECT max(pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn))
                       FROM pg_stat_replication
                       WHERE usename = 'supabase_replication_admin')
            END, 0)::float AS max_replay_lag_bytes
      master: true
      metrics:
        - streaming_standbys:
            usage: "GAUGE"
            description: "Physical standbys (supabase_replication_admin) in state=streaming per pg_stat_replication (primary side)"
        - max_replay_lag_bytes:
            usage: "GAUGE"
            description: "Max WAL bytes between the primary's current LSN and any physical standby's replay_lsn (0 on a standby)"

    # WAL-G continuous archiving health. With postgres.walg.enabled the primary
    # runs archive_command=wal-g wal-push; if that keeps failing, unarchived WAL
    # piles up in pg_wal and can fill the volume (write outage). last_attempt_failed
    # drives the PawtograderWALArchiveFailing alert; wal_dir_bytes is for
    # dashboards. Harmless when archiving is off (archiver counters stay 0).
    # Query key = metric prefix, so metrics are pawtograder_wal_archiving_*.
    pawtograder_wal_archiving:
      query: |
        SELECT
          archived_count::float AS archived_count,
          failed_count::float AS failed_count,
          CASE
            WHEN last_failed_time IS NOT NULL
             AND (last_archived_time IS NULL OR last_failed_time > last_archived_time)
            THEN 1 ELSE 0
          END::float AS last_attempt_failed,
          COALESCE((SELECT SUM(size) FROM pg_ls_waldir()), 0)::float AS wal_dir_bytes
        FROM pg_stat_archiver
      master: true
      metrics:
        - archived_count:
            usage: "COUNTER"
            description: "WAL segments successfully archived since stats reset"
        - failed_count:
            usage: "COUNTER"
            description: "Failed archive attempts since stats reset"
        - last_attempt_failed:
            usage: "GAUGE"
            description: "1 if the most recent archive_command attempt failed (last_failed_time newer than last_archived_time)"
        - wal_dir_bytes:
            usage: "GAUGE"
            description: "Total bytes currently in pg_wal (unarchived WAL accumulates here when archiving fails)"

    # Connection-budget saturation. Counts client backends against max_connections;
    # PostgREST pools (rest.dbPool × replicas), supavisor, GoTrue, realtime,
    # storage and this exporter all share the budget (postgres.config.max_connections,
    # default 400). The backend_type filter matters: walsenders, autovacuum
    # workers, and parallel workers draw from their own pools (max_wal_senders,
    # autovacuum_max_workers, max_worker_processes), so counting them would
    # inflate the ratio and page for saturation that isn't there. Drives the
    # PawtograderPostgresConnections* alerts. master:true so auto-discovered
    # per-database servers (PG_EXPORTER_AUTO_DISCOVER_DATABASES) don't re-export
    # the cluster-wide count. Note the re-exports would NOT be separable: the
    # `server` label is parseFingerprint(dsn), host:port only, with no database
    # name, so identical label sets collide and the exporter's registry returns
    # HTTP 500 for the whole /metrics endpoint. See the AUTO-DISCOVERY note below.
    pawtograder_db_connections:
      query: |
        SELECT (SELECT COUNT(*) FROM pg_stat_activity WHERE backend_type = 'client backend')::float AS used,
               (SELECT setting::float FROM pg_settings WHERE name = 'max_connections') AS max,
               (SELECT setting::float FROM pg_settings WHERE name = 'superuser_reserved_connections') AS reserved
      master: true
      metrics:
        - used:
            usage: "GAUGE"
            description: "Current client backends across all databases (the connections max_connections governs)"
        - max:
            usage: "GAUGE"
            description: "max_connections setting — the hard ceiling on total backends"
        - reserved:
            usage: "GAUGE"
            description: "superuser_reserved_connections — slots reserved for superusers, shrinking the app-usable ceiling"

    # =========================================================================
    # Global database state, moved here from the `metrics` edge function
    # (supabase/functions/metrics/index.ts).
    #
    # WHY: the edge-functions ServiceMonitor at the bottom of this file selects
    # the functions *Service*, and Prometheus scrapes EVERY pod endpoint behind
    # a Service. Prod pins the functions HPA at 32 replicas, so a 30s interval
    # meant ~1.07 scrapes/sec of that /metrics handler, each one calling
    # database_ram_metrics() and vacuum_health_check(). Measured over a 42-day
    # pg_stat_statements window:
    #
    #   database_ram_metrics()  3,036,749 calls  360.6 ms mean  77.7% of ALL
    #                                                           database exec time
    #   vacuum_health_check()   3,036,995 calls   32.8 ms mean   7.1%
    #
    # database_ram_metrics() is that expensive because it scans pg_buffercache:
    # one row per buffer descriptor, and shared_buffers = 4GB means 524,288
    # descriptors per call. The data is GLOBAL database state — byte-identical
    # from every pod — so 31 of every 32 scrapes were pure waste, and they
    # produced 32 duplicate copies of every series (which is why the dashboard
    # panels all wrap in max()).
    #
    # The exporter sidecar is scraped ONCE (one postgres pod, one endpoint), so
    # the same series now cost 1/32 as much and arrive un-duplicated.
    #
    # Metric AND label names are reproduced exactly: postgres_exporter names
    # each metric `<block>_<column>`, so the block/column splits below are
    # chosen to land on the names the Grafana panels already query, not for
    # elegance. Don't "tidy" a block name without regrading the dashboards.
    #
    # Long → wide: database_ram_metrics() returned long format
    # (metric_name, metric_labels jsonb, metric_value). This exporter needs
    # WIDE format — one row per label set, each numeric column becoming a
    # metric — so `SELECT * FROM database_ram_metrics()` cannot work. The
    # queries below reproduce its semantics against the underlying sources
    # directly, which is also this file's house style (see
    # pawtograder_db_connections above).
    #
    # The exporter connects as supabase_admin (postgres-statefulset.yaml
    # DATA_SOURCE_USER), which initdb creates as the bootstrap SUPERUSER, so no
    # extra grant is needed for pg_buffercache (normally pg_monitor-gated) or
    # for the SECURITY DEFINER vacuum_health_check().
    # =========================================================================

    # Buffer-cache bytes per relation. Reproduces database_ram_metrics()'s
    # 'buffer_cache_bytes' rows: same >1 MiB floor, same top-20 cut, same
    # unqualified `relname` label. GROUP BY relname (not oid) is what the RPC
    # did, and it also guarantees one row per label set — duplicate series make
    # the exporter's registry return HTTP 500 for the ENTIRE /metrics endpoint,
    # taking down all postgres metrics (see the pg_stat_statements_top note).
    #
    # public.pg_buffercache is schema-qualified on purpose: migrations
    # 20260722000000 / 20260722120000 pin the extension to `public` (relocating
    # it if a base image put it in `extensions`), so qualify rather than trust
    # the exporter connection's search_path.
    #
    # cache_seconds: the 524,288-descriptor scan is the whole reason this moved,
    # and buffer-pool composition changes slowly, so serve it from the
    # exporter's per-namespace cache and re-run the scan at most once every 5
    # minutes. `cache_seconds` is honoured for user queries by the pinned
    # exporter (v0.18.0, monitoring.postgresExporter.image.tag) and needs no
    # flag; cached metrics are re-emitted on every scrape, so Prometheus sees
    # no staleness gap.
    #
    # master: true — pg_buffercache is the CLUSTER's shared buffer pool. With
    # PG_EXPORTER_AUTO_DISCOVER_DATABASES=true, without this the expensive scan
    # would be repeated once per discovered database. See the AUTO-DISCOVERY note
    # below: the `server` label does NOT distinguish them, so the re-exports
    # collide rather than separate.
    pawtograder_db_buffer_cache:
      query: |
        SELECT c.relname,
               (count(*) * 8192)::float AS bytes
        FROM public.pg_buffercache b
        JOIN pg_class c ON c.relfilenode = b.relfilenode
        WHERE b.reldatabase = (SELECT oid FROM pg_database WHERE datname = current_database())
        GROUP BY c.relname
        HAVING count(*) * 8192 > 1048576
        ORDER BY count(*) DESC
        LIMIT 20
      master: true
      cache_seconds: 300
      metrics:
        - relname:
            usage: "LABEL"
            description: "Relation name, unqualified (pg_buffercache joins pg_class by relfilenode)"
        - bytes:
            usage: "GAUGE"
            description: "Bytes of shared buffer cache held by this relation (8 KiB per buffer); relations over 1 MiB only, top 20"

    # Total buffer-cache bytes in use by the current database. Deliberately its
    # own block rather than a second column above: the per-relation query is
    # capped (>1 MiB, LIMIT 20) so sum() over it is NOT the total, and folding
    # the total into that block would stamp a `relname` label onto a series the
    # dashboards query bare. Block `pawtograder_db_buffer_cache_total` + column
    # `used_bytes` is what yields pawtograder_db_buffer_cache_total_used_bytes.
    # Same cache_seconds / master rationale as above.
    pawtograder_db_buffer_cache_total:
      query: |
        SELECT (count(*) * 8192)::float AS used_bytes
        FROM public.pg_buffercache
        WHERE reldatabase = (SELECT oid FROM pg_database WHERE datname = current_database())
      master: true
      cache_seconds: 300
      metrics:
        - used_bytes:
            usage: "GAUGE"
            description: "Total bytes of shared buffer cache held by the current database"

    # Dead tuples per table — the input to every vacuum/bloat judgement.
    # Block `pawtograder_db_dead` + column `tuples` is the only split that
    # reproduces the existing metric name pawtograder_db_dead_tuples exactly;
    # the odd word break is deliberate, not a typo.
    #
    # sum()/GROUP BY relname: pg_stat_user_tables.relname is unqualified and
    # the view spans public, auth, storage and realtime, so two same-named
    # tables in different schemas would emit the same label set twice and 500
    # the whole endpoint. Summing is also the honest reading of a
    # `relname`-only label. No cache_seconds — pg_stat_user_tables is an
    # in-memory stats view, and 30s freshness is what vacuum triage wants.
    #
    # master: true — pg_stat_user_tables is per-database; auto-discovery would
    # otherwise re-export other databases' tables under a `server` label.
    pawtograder_db_dead:
      query: |
        SELECT relname,
               sum(n_dead_tup)::float AS tuples
        FROM pg_stat_user_tables
        WHERE n_dead_tup > 100
        GROUP BY relname
        ORDER BY sum(n_dead_tup) DESC
        LIMIT 20
      master: true
      metrics:
        - relname:
            usage: "LABEL"
            description: "Table name, unqualified (summed across schemas when the name repeats)"
        - tuples:
            usage: "GAUGE"
            description: "Dead tuples awaiting vacuum; tables over 100 only, top 20"

    # Vacuum health. Wraps public.vacuum_health_check() (defined in
    # 20260325000000_autovacuum_tuning.sql): overdue vacuums, XID wraparound
    # risk, dead-tuple bloat, and large never-vacuumed tables. The function
    # returns only text columns, so `alert` is a synthetic 1 — the label set is
    # the payload, exactly as the edge function emitted it.
    #
    # Label names are load-bearing (docs/grafana-dashboard-vacuum-health.json
    # filters on severity): check_name → `check` (quoted, CHECK is a reserved
    # word and cannot be a bare alias), relname → `table_name`.
    #
    # DISTINCT: the xid_wraparound_risk branch scans pg_class across every
    # schema, so two same-named relations would produce an identical label set
    # and 500 the whole /metrics endpoint.
    #
    # The NOT EXISTS fallback row keeps the series continuously present when the
    # database is healthy, matching the edge function's
    # {check="none",severity="ok",table_name="none"} 0 sentinel. MATERIALIZED so
    # the 32.8 ms function runs once per scrape, not twice.
    #
    # No cache_seconds: this is the alerting-relevant signal and it is cheap at
    # one target (32.8 ms / 30s is a ~0.1% duty cycle, against ~1.07 calls/sec
    # before).
    #
    # master: true — the function exists only in the application database;
    # auto-discovered databases would raise "function does not exist" on every
    # scrape and permanently light up pg_exporter_last_scrape_error.
    pawtograder_vacuum:
      query: |
        WITH health AS MATERIALIZED (
          SELECT DISTINCT check_name AS "check", severity, relname AS table_name, 1::float AS alert
          FROM public.vacuum_health_check()
        )
        SELECT * FROM health
        UNION ALL
        SELECT 'none', 'ok', 'none', 0::float
        WHERE NOT EXISTS (SELECT 1 FROM health)
      master: true
      metrics:
        - check:
            usage: "LABEL"
            description: "Which check fired: vacuum_overdue, xid_wraparound_risk, high_dead_tuple_ratio, never_vacuumed_large_table, or none"
        - severity:
            usage: "LABEL"
            description: "warning or critical; ok on the healthy sentinel row"
        - table_name:
            usage: "LABEL"
            description: "Relation the check fired on; none on the healthy sentinel row"
        - alert:
            usage: "GAUGE"
            description: "1 while this vacuum health alert is active, 0 on the healthy sentinel row"

    pg_stat_statements_top:
      # Aggregate by queryid. pg_stat_statements holds one row PER
      # (userid, dbid, toplevel, queryid), so selecting queryid + query text
      # directly yields several rows with the same (queryid, query_preview)
      # label set whenever a statement runs under more than one role/db. The
      # exporter's client library rejects duplicate series with "collected
      # before with the same name and label values" and returns HTTP 500 for
      # the ENTIRE /metrics endpoint — taking down all postgres metrics. Summing
      # per queryid collapses those rows to one unique series each; mean is
      # recomputed as the weighted total/calls. Skip NULL queryids (untracked).
      query: |
        SELECT queryid::text,
               LEFT(MIN(query), 80) AS query_preview,
               SUM(calls) AS calls,
               SUM(total_exec_time) AS total_exec_time,
               SUM(total_exec_time) / NULLIF(SUM(calls), 0) AS mean_exec_time,
               SUM(rows) AS rows
        FROM pg_stat_statements
        WHERE queryid IS NOT NULL
        GROUP BY queryid
        ORDER BY SUM(total_exec_time) DESC
        LIMIT 20
      # pg_stat_statements is CLUSTER-wide — one shared hash table covering every
      # database — so auto-discovery would re-export the same top-20 statements
      # once per discovered database. See the auto-discovery note below.
      master: true
      metrics:
        - queryid:
            usage: "LABEL"
            description: "pg_stat_statements query id"
        - query_preview:
            usage: "LABEL"
            description: "First 80 chars of the normalized statement"
        - calls:
            usage: "COUNTER"
            description: "Number of times the statement has been executed"
        - total_exec_time:
            usage: "COUNTER"
            description: "Total time spent executing the statement, in ms"
        - mean_exec_time:
            usage: "GAUGE"
            description: "Mean time per execution, in ms"
        - rows:
            usage: "COUNTER"
            description: "Total rows touched by the statement"

    # =========================================================================
    # AUTO-DISCOVERY: why every block in this file sets master: true.
    #
    # The sidecar runs with PG_EXPORTER_AUTO_DISCOVER_DATABASES=true
    # (postgres-statefulset.yaml), which makes the exporter enumerate databases
    # and run the custom queries against EACH one. Without `master: true` a
    # block runs once per discovered database.
    #
    # That is wrong for every query here: they are either cluster-wide
    # (pg_stat_statements, pg_buffercache, pg_settings, pg_stat_replication) or
    # specific to the APPLICATION database (public.classes, public.submissions,
    # public.help_requests, and the pawtograder_* functions). Re-running them
    # elsewhere either duplicates the same numbers or errors on a missing
    # relation.
    #
    # Whether that actually bites depends on the Postgres image. The discovery
    # query is
    #   SELECT datname FROM pg_database
    #    WHERE datallowconn AND NOT datistemplate AND datname != current_database()
    #
    # On the CURRENTLY DEPLOYED supabase/postgres 17.4.x there is nothing for it
    # to find: the only databases are `postgres`, `template0` and `template1`,
    # and templates are excluded — so these blocks only ever run against the
    # application database and are LATENT. Confirmed on the live prod exporter:
    # pg_exporter_last_scrape_error is 0 and there is exactly one `server` label
    # value (127.0.0.1:5432) across the whole scrape.
    #
    # On 17.6.x and later, Supabase adds `_supabase` and `storage_vectors`
    # (verified against 17.6.1.132). At that point pg_stat_statements,
    # public.classes, public.submissions and public.help_requests would raise
    # "relation does not exist" once per discovered database on every scrape —
    # standing pg_exporter_last_scrape_error plus log noise — and
    # pawtograder_table_sizes would run against the wrong databases.
    #
    # So master: true is a PREREQUISITE FOR THE NEXT POSTGRES IMAGE BUMP, not a
    # fix for something failing today. The second reason is worse than noise:
    # the `server` label is only host:port — parseFingerprint(dsn) concatenates
    # host and port and does NOT include the database name — so databases
    # discovered on one instance are indistinguishable by label. The first time
    # one of these queries returns a row from a second database, the result is
    # not a mis-ranked topk but a genuinely DUPLICATE label set, and that makes
    # the exporter's registry return HTTP 500 for the ENTIRE /metrics endpoint
    # (see pg_stat_statements_top above), taking down all postgres metrics.
    #
    # Rule of thumb: a new block here needs master: true unless it genuinely
    # means something different per database.
    # =========================================================================
    pawtograder_classes:
      query: |
        SELECT COUNT(*) FILTER (WHERE NOT is_demo)::float AS real_classes,
               COUNT(*) FILTER (WHERE is_demo)::float AS demo_classes,
               COUNT(*)::float AS total_classes
        FROM public.classes
      # public.classes only exists in the application database.
      master: true
      metrics:
        - real_classes:
            usage: "GAUGE"
            description: "Number of non-demo classes"
        - demo_classes:
            usage: "GAUGE"
            description: "Number of demo classes (seeded fixtures)"
        - total_classes:
            usage: "GAUGE"
            description: "Total class count"

    pawtograder_active_submissions:
      query: |
        SELECT class_id::text,
               COUNT(*)::float AS active_count
        FROM public.submissions
        WHERE is_active = true
        GROUP BY class_id
      # public.submissions only exists in the application database.
      master: true
      metrics:
        - class_id:
            usage: "LABEL"
            description: "Class ID"
        - active_count:
            usage: "GAUGE"
            description: "Number of submissions currently marked is_active=true in this class"

    pawtograder_help_queue_depth:
      query: |
        SELECT class_id::text,
               COUNT(*) FILTER (WHERE status = 'open')::float AS open_count,
               COUNT(*) FILTER (WHERE status = 'in_progress')::float AS in_progress_count
        FROM public.help_requests
        WHERE created_at > NOW() - INTERVAL '24 hours'
        GROUP BY class_id
      # public.help_requests only exists in the application database.
      master: true
      metrics:
        - class_id:
            usage: "LABEL"
            description: "Class ID"
        - open_count:
            usage: "GAUGE"
            description: "Help requests in open state in the last 24h"
        - in_progress_count:
            usage: "GAUGE"
            description: "Help requests being actively handled in the last 24h"

    # Note: autograder workflow business metrics (run counts by
    # conclusion, queue/run duration percentiles, error tallies) are
    # NOT surfaced here. They live in the web app's /api/metrics route
    # (lib/metrics.ts → refreshWorkflowMetrics) so they can carry the
    # same labels and naming conventions as other app-level signals.

    pawtograder_table_sizes:
      query: |
        SELECT n.nspname || '.' || c.relname AS relation,
               pg_total_relation_size(c.oid)::float AS total_bytes,
               pg_relation_size(c.oid)::float AS heap_bytes
        FROM pg_class c
        JOIN pg_namespace n ON n.oid = c.relnamespace
        WHERE c.relkind IN ('r', 'p')
          AND n.nspname IN ('public', 'auth', 'storage', 'realtime')
          AND pg_total_relation_size(c.oid) > 10485760
        ORDER BY pg_total_relation_size(c.oid) DESC
        LIMIT 30
      # pg_class is per-database, and the public/auth/storage/realtime schemas
      # this filters on are the application database's. Without master:true the
      # top-30 cut would be computed per discovered database, so the dashboard's
      # unfiltered `topk(30, pawtograder_table_sizes_total_bytes)` could rank
      # tables from different databases against each other.
      master: true
      metrics:
        - relation:
            usage: "LABEL"
            description: "Schema-qualified table or partition name"
        - total_bytes:
            usage: "GAUGE"
            description: "Total size including indexes and TOAST"
        - heap_bytes:
            usage: "GAUGE"
            description: "Heap size only (no indexes)"
{{- end -}}
{{- if .Values.monitoring.enabled -}}
{{- /*
Monitoring wiring. Emits Prometheus Operator CRs (ServiceMonitor) for every
component that exposes /metrics, plus the postgres_exporter custom-queries
ConfigMap consumed by the sidecar in postgres-statefulset.yaml.

We do NOT deploy our own Prometheus or Grafana — the cluster's
kube-prometheus-stack auto-discovers ServiceMonitors in any namespace and the
Grafana sidecar picks up ConfigMaps labeled `grafana_dashboard: "1"`.

Each ServiceMonitor reuses the chart's selectorLabels so that even if a Service
gets renamed, the operator still finds the right pod set.
*/ -}}
---
{{ include "pawtograder.postgresExporterQueries" . }}
---
{{- /*
Both of the following are gated on postgres.enabled: the sidecar they front only
exists inside the chart-managed Postgres StatefulSet. With postgres.enabled=false
(externally managed database) this Service would select no pods and the
ServiceMonitor would sit permanently "down" — masking the real exporter an
operator supplies for the external DB. validations.yaml refuses that combination
unless monitoring.externalPostgresExporter=true, and in that mode the operator
brings their own ServiceMonitor. The queries.yaml ConfigMap above is NOT gated:
it is still useful to mount into an external exporter to keep the metric names
the dashboards and alert rules expect.
*/ -}}
{{- if .Values.postgres.enabled }}
# Headless Service that fronts the postgres_exporter sidecar's :9187
# inside the postgres pod. We can't add the metrics port to the existing
# pawtograder-postgres Service because that Service is consumed as the
# StatefulSet's serviceName and its port list is what realtime/storage/
# auth/etc. dial. Carry component=postgres-exporter so the ServiceMonitor
# below can match exclusively on this Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "postgres-exporter") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "postgres-exporter") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "pawtograder.componentSelectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
---
# ServiceMonitor: postgres_exporter. Matches the metrics Service above
# (selector by component=postgres-exporter) so it doesn't also catch the
# main pawtograder-postgres Service — that one has no /metrics port.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "postgres") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "postgres-exporter") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "pawtograder.componentSelectorLabels" (dict "ctx" . "component" "postgres-exporter") | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.scrapeInterval }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}
{{- end }}
---
# ServiceMonitor: storage-api. /metrics on the http port. Toggleable via
# monitoring.serviceMonitors.storage: storage-api only exposes /metrics on its
# admin app (ADMIN_PORT) or in multitenant mode — a single-tenant deploy serving
# only :5000 returns 404, so Prometheus would flag it perpetually down. Set the
# toggle false there.
{{- if dig "serviceMonitors" "storage" true .Values.monitoring }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "storage") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "storage") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "pawtograder.componentSelectorLabels" (dict "ctx" . "component" "storage") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.scrapeInterval }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}
{{- end }}
---
# ServiceMonitor: edge-functions. /metrics on the http port serves the fifteen
# `pawtograder_*` families and NOTHING ELSE — in particular no deno_* series.
# This comment asserted the opposite (that edge-runtime v1.74 serves
# deno_http_requests_total here) until 0.4.0. The claim was never true of THIS
# image, whatever the upstream runtime does: it replaces the runtime's main
# service with our own demuxer (images/edge-functions/main.ts), whose Deno.serve
# handler dispatches EVERY path by its first segment, /metrics included. So a
# scrape of /metrics runs the `metrics` FUNCTION and returns exactly what
# supabase/functions/metrics/index.ts prints. Checked against live Prometheus
# rather than inferred: of 3700 metric names in the cluster, zero begin with
# `deno`. The five panels in dashboards/edge-functions.json that select on
# deno_http_requests_total have therefore been empty since they were written —
# pre-existing, and tracked in #951 rather than fixed here.
#
# Access is optionally gated by a Bearer token — the runtime enforces
# METRICS_TOKEN only when that env value is set (metrics/index.ts: no token =>
# open /metrics).
#
# The authorization block is gated on monitoring.edgeFunctionsMetricsAuth, NOT
# on `optional: true`. `optional` does not do what the previous version of this
# comment claimed: the Prometheus Operator resolves the credential while
# SELECTING the ServiceMonitor, and a missing Secret OR a missing key rejects
# the whole object —
#   endpoints[0]: authorization: failed to get authorization token of type
#   "Bearer": unable to get secret "pawtograder-edge-functions": secrets
#   "pawtograder-edge-functions" not found
# A rejected ServiceMonitor yields no scrape pool at all. Not a "down" target —
# an absent one, with nothing in Prometheus to notice. On ripley staging that
# dark-ed every pawtograder_*_queue_size series and the whole pawtograder.app
# alert group that reads them, from the day the k8s repo dropped the
# edge-functions ExternalSecret (this chart having moved each integration to its
# own envFromSecrets entry). Preview namespaces hit the same rejection via the
# missing key rather than the missing Secret.
#
# So set edgeFunctionsMetricsAuth=false wherever METRICS_TOKEN is unset. Getting
# it wrong the other way fails LOUDLY — the target 401s and shows as down —
# which is the failure mode to prefer.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "edge-functions") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "functions") | nindent 4 }}
spec:
  {{- /* TWO SHAPES, GATED ON THE TIER. This gate USED TO BE about the Postgres
     primary. As of 0.4.0 it is not, and the old reason is recorded here because
     it is the reason the gate exists at all.

     WHAT IT WAS. postgres-statefulset.yaml hashed the rendered text of this whole
     file (plus postgres-config.yaml) into the primary's pod-template
     `checksum/config`, stripping only lines carrying helm.sh/chart,
     app.kubernetes.io/version, interval or scrapeTimeout. An edit to THIS selector
     matches none of those patterns, so when the matchExpressions form below
     rendered unconditionally it moved the checksum on every install — including
     installs with the worker tier off, which is every install except staging — and
     rolled the primary (a write outage, and with the sidecars' slow SIGTERM not a
     brief one) purely to add a value to a selector they were not using. Measured,
     not predicted: tier-off 0.3.17 -> 0.4.0 moved it bffad95b -> 16bd9c55.

     WHAT IT IS NOW. The hash was narrowed in the same release: it takes the
     `pawtograder.postgresExporterQueries` named template, not this file, because
     the queries file is the only thing in here the primary's exporter sidecar
     actually reads. So this file's ServiceMonitors are no longer hashed and an
     edit to this selector — or to any comment in this file — CANNOT move the
     primary's checksum. Verified rather than assumed: editing the comment above
     this ServiceMonitor leaves checksum/config unchanged at 0.4.0, and moved it at
     50f71406. Do not re-derive a `hold this file still` argument from it; the
     three checksum assertions in tests/render-guardrails.sh are what hold the
     property now, and 0.4.0 rolls the primary exactly once regardless.

     SO WHY KEEP THE GATE. The two halves have different amounts of reason left.
     The RELABELING gate below still earns its keep on its own terms: with the tier
     off it would stamp a constant edge_tier label onto every pawtograder_* series
     on every install, and because a label is part of a series' identity that ENDS
     each old series and starts a new one at the upgrade — a real, if small, cost
     paid by every install that will never run the tier. The SELECTOR gate is now
     close to cosmetic: with no functions-workers Service in the cluster, a
     matchExpressions `In (functions, functions-workers)` selects exactly what the
     exact matchLabels form selects, so the only thing the gate buys is that a
     tier-off upgrade produces no ServiceMonitor diff for the Prometheus Operator
     to reconcile. It is kept because it costs one `if`, it keeps the two halves
     symmetrical, and both are pinned by the same pair of assertions — not because
     anything breaks without it.

     So: when the tier is OFF, emit the ORIGINAL exact matchLabels shape, which
     keeps the tier-off render of this file byte-identical to 0.3.17. When it is
     ON, the operator is already taking a Kong roll and a new Deployment in that
     release, and the selector has real work to do.

     Why the shape has to change at all when the tier is on: the worker tier
     carries component=functions-workers (edge-functions-worker-tier.yaml), and
     an exact match on "functions" would leave it UNSCRAPED — silently, since a
     tier that is never scraped does not look broken, it looks absent.
     Channels (component=functions-<channel>) are still not scraped either way;
     they are a whole-function-set A/B on their own host and out of scope here. */}}
  selector:
    {{- if include "pawtograder.edgeFunctions.workerTier.enabled" . }}
    matchLabels:
      {{- include "pawtograder.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - functions
          - functions-workers
    {{- else }}
    matchLabels:
      {{- include "pawtograder.componentSelectorLabels" (dict "ctx" . "component" "functions") | nindent 6 }}
    {{- end }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.scrapeInterval }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}
      {{- /* Copies the Service's component label onto each series as
         edge_tier=functions | functions-workers, so that "which tier produced
         this series?" is expressible in PromQL. Adding a label cannot break
         existing selectors.

         GATED, and unlike the selector above this half still has a live reason.
         The historical one — this block is three rendered lines, matches none of
         the old strip patterns, and moved the primary's checksum on its own — is
         retired with the narrowed hash. What remains is worse than cosmetic: with
         one tier every series would carry the same constant edge_tier="functions",
         and stamping it is not free, because a label is part of a series' identity
         (see NOT INERT below). Gating it means an install that never enables the
         tier never pays that cutover.

         NOT INERT, which an earlier version of this note got backwards and which
         matters before you enable the tier. `endpoints[].relabelings` is TARGET
         relabeling (prometheus `relabel_configs`), so it rewrites the target's
         label set and every sample scraped from that target carries the result --
         not just the deno_* series this label was reached for. What the endpoint
         actually serves is the `metrics` FUNCTION's output (see below), so
         enabling the tier stamps edge_tier onto all fifteen pawtograder_* series
         and, because a label is part of a series' identity, ENDS each old series
         and starts a new one at the cutover. Nothing numeric breaks: every
         consumer aggregates the label away (prometheus-rules.yaml uses
         `max by (namespace, ...)`, dashboards/queues-and-workers.json uses
         `max()`), but per-series functions over the boundary -- the
         `deriv(pawtograder_async_dlq_size[10m])` panel is the one -- see a
         discontinuity for one window. If you want the label WITHOUT that, the
         field is `metricRelabelings`, which applies after the scrape and can be
         scoped to a metric name.

         What IS true, and is the reason the label reads as constant today: there
         is no deno_* series for it to distinguish. The `#` comment at the top of
         this ServiceMonitor used to claim edge-runtime v1.74 serves
         deno_http_requests_total at /metrics; it was wrong, and 0.4.0 corrects it
         — see it for the mechanism and the live-Prometheus check. An earlier
         revision of THIS note said the false claim had to stay because it was a
         RENDERED comment whose edit would move the Postgres checksum. That
         reasoning is dead twice over: the checksum no longer hashes this file (see
         the gate note above), and 0.4.0 rolls the primary once anyway. Nothing in
         this file is checksum-frozen, so a wrong comment in it is just a wrong
         comment — fix it where you find it.
         Consequences: the five panels in dashboards/edge-functions.json that
         select on deno_http_requests_total are empty (pre-existing, tracked in
         #951), and per-tier request rate is answered off Kong's own
         kong_http_requests_total instead — see
         PawtograderEdgeWorkerTierNoTraffic in prometheus-rules.yaml. The
         relabeling is kept rather than deleted because it costs one scrape-time
         label rewrite and becomes correct the moment any deno_* series exists.

         Note this endpoint resolves as the `metrics` FUNCTION — the demuxer
         routes /metrics on the first path segment — so worker-tier pods also
         report the ABSOLUTE pgmq queue depths, and a panel that summed them
         across pods would inflate by the pod count. Checked rather than assumed:
         every pgmq panel in dashboards/queues-and-workers.json already uses
         max() (max(pawtograder_async_queue_size) and siblings), which is
         correct and pod-count-independent. The sum() queue panels in
         app-business.json read pawtograder_help_queue_depth, which comes from
         the postgres-exporter (see above in this file) and not from this
         endpoint at all. So adding this tier moves no queue-depth number. */}}
      {{- if include "pawtograder.edgeFunctions.workerTier.enabled" . }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: edge_tier
      {{- end }}
      {{- if .Values.monitoring.edgeFunctionsMetricsAuth }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.secrets.names.edgeFunctions }}
          key: METRICS_TOKEN
      {{- end }}
---
# ServiceMonitor: GoTrue (auth). /metrics on the dedicated metrics
# port (9100); requires GOTRUE_METRICS_EXPORTER=prometheus, set in
# auth.yaml. The main API port (9999) has no /metrics path.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "auth") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "auth") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "pawtograder.componentSelectorLabels" (dict "ctx" . "component" "auth") | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.scrapeInterval }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}
---
# ServiceMonitor: kong (Prometheus plugin via admin port :8001).
