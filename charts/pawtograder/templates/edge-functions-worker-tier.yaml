{{- /*
Supervised background-worker TIER.

Renders a second edge-functions Service+Deployment (component "functions-workers")
from the shared pawtograder.edgeFunctions.workload definition, on a config merged
over .Values.edgeFunctions, with no HPA. Kong routes the function NAMES in
.Values.edgeFunctions.workerTier.functions to it by path (templates/kong-config.yaml).

Unlike a channel (edge-functions-channels.yaml), which is an A/B of the whole
function set reached by HOST and needs its own image tag, a tier runs the SAME
image and is reached by PATH. So it needs no `web` block and no tag of its own.

See the workerTier block in values.yaml for why these four functions want their
own admission budget and eszip cache.
*/ -}}
{{- if and .Values.edgeFunctions.enabled .Values.edgeFunctions.workerTier.enabled }}
{{- $wt := .Values.edgeFunctions.workerTier }}
{{- /* Enabled with no routed names would render pods that are scheduled, scraped
   and charged their full memory limit while receiving nothing, because Kong
   routes this tier by name and there would be no routes -- meanwhile the four
   workers would keep running on the request tier exactly as before. Nothing
   would look broken, which is the worst way for this to fail. */ -}}
{{- if not $wt.functions }}
{{- fail "edgeFunctions.workerTier is enabled but `functions` is empty. Kong routes this tier by function NAME, so nothing would reach it: the pods would run, be scraped and cost their whole memory limit while the four workers kept running on the request tier. Either list the names or set enabled: false." }}
{{- end }}
{{- /* A duplicated name renders two Kong services and two routes both called
   functions-v1-worker-<name>. Kong enforces uniqueness on entity names in a
   declarative config and REJECTS the whole file -- so the blast radius is not
   the worker tier, it is that Kong itself will not start and every API request
   in the deployment fails. Refuse it here, where the message can say which name,
   rather than at Kong boot where it is a uniqueness-violation stack trace. */ -}}
{{- $dupSeen := dict }}
{{- range $fn := $wt.functions }}
{{- if hasKey $dupSeen $fn }}
{{- fail (printf "edgeFunctions.workerTier.functions lists %q more than once. That renders two Kong services and two routes with the same name, and Kong rejects a declarative config with duplicate entity names outright -- meaning Kong does not start and the whole deployment's API is down, not just this tier. Remove the duplicate." $fn) }}
{{- end }}
{{- $_ := set $dupSeen $fn true }}
{{- end }}
{{- /* A channel named "workers" would render the SAME Service and Deployment name
   (<release>-functions-workers) as this tier. That is an install-time collision
   between two helm resources, not a routing subtlety, so fail loudly rather than
   let one silently win. */ -}}
{{- range $c := .Values.channels }}
{{- if eq $c.name "workers" }}
{{- fail (printf "channel %q collides with edgeFunctions.workerTier: both render component \"functions-workers\", i.e. one Kubernetes Service and Deployment name for two different workloads. Rename the channel." $c.name) }}
{{- end }}
{{- /* The second collision, on Kong entity names rather than Kubernetes ones. A
   channel renders the Kong service `functions-v1-<channel>`, and each routed
   worker renders `functions-v1-worker-<fn>` -- so a channel named
   `worker-github-async-worker` produces the SAME service and route name as the
   worker route. Kong rejects a declarative config with duplicate entity names
   outright, so this does not degrade the channel or the tier: Kong fails to
   start and the whole deployment's API goes down. */ -}}
{{- range $fn := $wt.functions }}
{{- if eq $c.name (printf "worker-%s" $fn) }}
{{- fail (printf "channel %q collides with the worker route for %q: both render the Kong service and route name \"functions-v1-worker-%s\". Kong rejects a declarative config with duplicate entity names, so Kong would fail to START and the whole deployment's API would be down -- not just this channel. Rename the channel." $c.name $fn $fn) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Routing for this tier is Kong path routing; there is no other mechanism in
   this chart. With Kong disabled the workload still schedules and still costs its
   full memory limit, but kong-config.yaml renders nothing, so none of the four
   functions is ever sent to it -- they keep being served by the request tier and
   the split silently does not exist. Same failure shape as an empty `functions`
   list, so it is refused in the same place. */ -}}
{{- if not .Values.kong.enabled }}
{{- fail "edgeFunctions.workerTier is enabled but kong.enabled is false. This tier is reached only by Kong path routing (templates/kong-config.yaml), so with Kong off the pods would schedule and cost their full memory limit while every routed function kept being served by the request tier -- the split would silently not exist. Enable Kong, or set edgeFunctions.workerTier.enabled: false." }}
{{- end }}
{{- include "pawtograder.edgeFunctions.assertTierOverrides" (dict "tier" "workerTier" "overrides" $wt) }}
{{- /* hasKey, not `default`, so replicas: 0 can idle the tier without its routes
   disappearing (Sprig `default` treats 0 as empty) -- same reason
   edge-functions-channels.yaml does this. Read from the RAW block, never from
   the merged config, because 0 would not survive mergeOverwrite. */ -}}
{{- $replicas := ternary $wt.replicas 2 (hasKey $wt "replicas") }}
{{- /* The image has to be merged HERE, not left to the workload's own merge.
   `image` is on the override allowlist, and the merged config ($ef) does pick it
   up — but the workload takes its actual image from the `image` ARGUMENT, and
   RELEASE_VERSION reads `$image.tag`. Passing .Values.edgeFunctions.image would
   accept `workerTier.image` in values, merge it into a dict nothing reads, and
   silently run the base image: exactly the "accepted then ignored" failure the
   allowlist exists to prevent. deepCopy on both sides because mergeOverwrite
   mutates its destination and would otherwise corrupt .Values for the request
   tier's own image. */ -}}
{{- $image := mergeOverwrite (deepCopy .Values.edgeFunctions.image) (deepCopy ($wt.image | default dict)) }}
---
{{ include "pawtograder.edgeFunctions.workload" (dict "ctx" . "component" "functions-workers" "image" $image "replicas" $replicas "autoscaling" false "overrides" $wt "tier" "workerTier") }}
{{- end }}
