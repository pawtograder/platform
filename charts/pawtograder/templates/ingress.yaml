{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pawtograder.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.labels" . | nindent 4 }}
  annotations:
    # Next.js Server Action responses always carry the large CSP header
    # set by middleware.ts (~1.7 KB). With nginx-ingress's defaults
    # (proxy_buffer_size 4k / proxy_buffers 4 4k) the response header
    # block — CSP + Vary + Cache-Control + Link + set-cookie — overflows
    # the single buffer on redirects, the upstream gets reset, and nginx
    # returns 502 with "upstream sent too big header". Make it 16k so we
    # have headroom for cookie-stacked redirects too.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    {{- if .Values.maintenance.active }}
    # The release carries the maintenance posture (maintenance.active). This is
    # how scripts/maintenance.sh tells a Helm-held fence from its own: `down`
    # refuses to capture it as "prior state", and `up` and `status` say the
    # release still has to be upgraded with maintenance.active=false.
    pawtograder.io/maintenance-active: "true"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.global.hostname | quote }}
        {{- if .Values.global.apiOnSeparateHost }}
        - {{ include "pawtograder.api.hostname" . | quote }}
        {{- end }}
        {{- range .Values.ingress.extraHosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- /* maintenance.active renders the web host's "/" backend exactly as
       maintenance.sh `down` patches it: a JSON-patch replace of
       /spec/rules/0/http/paths/0/backend/service with
       {"name":"<release>-maintenance","port":{"number":8080}}. Same object,
       same two fields, so the release and the live Ingress agree and neither
       apply mode has a difference to act on. It is rules[0].paths[0] only
       because global.apiOnSeparateHost puts "/" first; with the API paths on
       this host the script would patch an API path instead, which is why
       validations.yaml refuses the posture without apiOnSeparateHost.
       extraHosts below are left on web, as the script leaves them. */}}
    - host: {{ .Values.global.hostname | quote }}
      http:
        paths:
          {{- if not .Values.global.apiOnSeparateHost }}
          {{- include "pawtograder.ingress.apiPaths" . | trim | nindent 10 }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                {{- if .Values.maintenance.active }}
                name: {{ include "pawtograder.maintenance.host" . }}
                port:
                  number: {{ .Values.maintenance.service.port }}
                {{- else }}
                name: {{ include "pawtograder.web.host" . }}
                port:
                  number: {{ .Values.web.service.port }}
                {{- end }}
    {{- if .Values.global.apiOnSeparateHost }}
    - host: {{ include "pawtograder.api.hostname" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pawtograder.kong.host" . }}
                port:
                  number: {{ .Values.kong.service.port }}
    {{- end }}
    {{- /*
    extraHosts get the same routing as the primary hostname so a TLS
    SAN listed in .ingress.tls.hosts actually serves traffic. Without
    this, requests to those hostnames hit the ingress controller's
    default backend (404).
    */ -}}
    {{- range .Values.ingress.extraHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- if not $.Values.global.apiOnSeparateHost }}
          {{- include "pawtograder.ingress.apiPaths" $ | trim | nindent 10 }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pawtograder.web.host" $ }}
                port:
                  number: {{ $.Values.web.service.port }}
    {{- end }}
{{- end }}
