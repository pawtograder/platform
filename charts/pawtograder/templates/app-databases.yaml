{{- $apps := list }}
{{- range $app := list "forgejo" "coder" }}
{{- if (index $.Values $app).enabled }}
{{- $apps = append $apps $app }}
{{- end }}
{{- end }}
{{- if $apps }}
{{- if .Values.coder.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-coder-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "coder") | nindent 4 }}
data:
  {{- range .Values.coder.coder.env }}
  {{- if eq .name "CODER_PG_CONNECTION_URL" }}
  CODER_PG_CONNECTION_URL: {{ .value | quote }}
  {{- end }}
  {{- end }}
  CODER_TELEMETRY_ENABLE: "false"
  CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE: "false"
  CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS: "false"
  {{- if .Values.coder.oidc.enabled }}
  CODER_OIDC_ISSUER_URL: "{{ include "pawtograder.api.url" . }}/auth/v1"
  CODER_OIDC_SCOPES: "openid,profile,email"
  CODER_OIDC_ALLOW_SIGNUPS: {{ .Values.coder.oidc.allowSignups | quote }}
  CODER_OIDC_SIGN_IN_TEXT: {{ .Values.coder.oidc.signInText | quote }}
  # Coder finds a first sign-in's user by email. Pawtograder creates each Coder user with
  # <auth user id>@coder.pawtograder.invalid, and GoTrue's access token hook puts the same address
  # in coder_email, so a real email that moved to another account can't pick the user (#1222).
  # Coder reads that claim only from the access token, and only with userinfo off.
  CODER_OIDC_EMAIL_FIELD: "coder_email"
  CODER_OIDC_EMAIL_DOMAIN: "coder.pawtograder.invalid"
  CODER_OIDC_IGNORE_USERINFO: "true"
  CODER_OIDC_ACCESS_TOKEN_CLAIMS: "true"
  # With the email claim missing, Coder would take the username claim as the email if it parses as
  # one, and preferred_username is user metadata the user can set. `sub` never parses.
  CODER_OIDC_USERNAME_FIELD: "sub"
  {{- end }}
  {{- with .Values.coder.externalAuth.forgejo }}
  {{- if .enabled }}
  {{- $public := include "pawtograder.forgejo.url" $ }}
  {{- $service := printf "http://%s.%s.svc:%v" (include "pawtograder.forgejo.http" $) $.Release.Namespace (include "pawtograder.forgejo.servicePort" $) }}
  CODER_EXTERNAL_AUTH_0_ID: {{ .id | quote }}
  CODER_EXTERNAL_AUTH_0_TYPE: "gitea"
  CODER_EXTERNAL_AUTH_0_DISPLAY_NAME: {{ .displayName | quote }}
  CODER_EXTERNAL_AUTH_0_AUTH_URL: "{{ $public }}/login/oauth/authorize"
  CODER_EXTERNAL_AUTH_0_TOKEN_URL: "{{ $service }}/login/oauth/access_token"
  CODER_EXTERNAL_AUTH_0_VALIDATE_URL: "{{ $service }}/api/v1/user"
  {{- /* Matches the bare origin too: git asks for credentials with it alone. */}}
  CODER_EXTERNAL_AUTH_0_REGEX: {{ printf "^%s(/.*)?$" (regexQuoteMeta $public) | quote }}
  {{- /* Coder's gitea default scopes contain a stray space (" write:repository"). */}}
  CODER_EXTERNAL_AUTH_0_SCOPES: "read:repository write:repository read:user"
  {{- end }}
  {{- end }}
---
{{- end }}
# Not a hook: a pre-install hook would run before the Postgres servers exist.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "app-databases") }}-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "app-databases") | nindent 4 }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "app-databases") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- include "pawtograder.podSecurityContext" (dict "ctx" . "component" .Values.appDatabases) | nindent 6 }}
      {{- include "pawtograder.imagePullSecrets" . | nindent 6 }}
      {{- with (include "pawtograder.placement" (dict "ctx" . "component" .Values.appDatabases) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "pawtograder.priorityClassName" (dict "ctx" . "component" .Values.appDatabases) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        {{- range $app := $apps }}
        - name: {{ $app }}
          image: {{ include "pawtograder.image" (dict "ctx" $ "image" $.Values.postgres.image) }}
          {{- include "pawtograder.containerSecurityContext" (dict "ctx" $ "component" $.Values.appDatabases) | nindent 10 }}
          env:
            - name: PGHOST
              value: {{ include "pawtograder.appDatabase.host" (dict "ctx" $ "app" $app) }}
            - name: PGPORT
              value: {{ include "pawtograder.appDatabase.port" (dict "ctx" $ "app" $app) | quote }}
            {{- $su := dict }}
            {{- if eq (index $.Values $app).database "own" }}{{ $su = dig "settings" "superuser" dict (index $.Values (printf "%s-db" $app)) | default dict }}{{ end }}
            - name: PGUSER
              {{- if $su.secretKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "pawtograder.appDatabase.superuserSecret" (dict "ctx" $ "app" $app) }}
                  key: {{ $su.secretKey }}
              {{- else }}
              value: {{ $su.value | default (include "pawtograder.appDatabase.superuser" (dict "ctx" $ "app" $app)) }}
              {{- end }}
            - name: PGDATABASE
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pawtograder.appDatabase.superuserSecret" (dict "ctx" $ "app" $app) }}
                  key: {{ include "pawtograder.appDatabase.superuserSecretKey" (dict "ctx" $ "app" $app) }}
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $.Release.Name }}-{{ $app }}-db, key: PGPASSWORD }
          {{- /* No REVOKE CONNECT: revoking it from PUBLIC locks out Supabase's roles; pg_hba.conf confines the role. */}}
          command:
            - sh
            - -ec
            - |
              until pg_isready -q; do echo "waiting for $PGHOST"; sleep 2; done
              psql -v ON_ERROR_STOP=1 -qAt <<'SQL'
              \getenv pw APP_PASSWORD
              SELECT format('CREATE ROLE %I LOGIN', '{{ $app }}')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ $app }}') \gexec
              ALTER ROLE {{ $app }} WITH LOGIN PASSWORD :'pw';
              SELECT format('CREATE DATABASE %I OWNER %I', '{{ $app }}', '{{ $app }}')
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ $app }}') \gexec
              SQL
              echo "database {{ $app }} ready on $PGHOST"
          resources:
            {{- toYaml $.Values.appDatabases.resources | nindent 12 }}
        {{- end }}
        {{- /* A role leaving shared mode keeps LOGIN and its password while pg_hba.conf drops its reject lines. */}}
        {{- if .Values.postgres.enabled }}
        {{- range $app := list "forgejo" "coder" }}
        {{- if not (and (index $.Values $app).enabled (eq (index $.Values $app).database "pawtograder")) }}
        - name: {{ $app }}-shared-nologin
          image: {{ include "pawtograder.image" (dict "ctx" $ "image" $.Values.postgres.image) }}
          {{- include "pawtograder.containerSecurityContext" (dict "ctx" $ "component" $.Values.appDatabases) | nindent 10 }}
          env:
            - name: PGHOST
              value: {{ include "pawtograder.postgres.host" $ }}
            - name: PGPORT
              value: {{ $.Values.postgres.service.port | quote }}
            - name: PGUSER
              value: supabase_admin
            - name: PGDATABASE
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secrets.names.postgres }}, key: POSTGRES_PASSWORD }
          command:
            - sh
            - -ec
            - |
              until pg_isready -q; do echo "waiting for $PGHOST"; sleep 2; done
              psql -v ON_ERROR_STOP=1 -qAt <<'SQL'
              SELECT format('ALTER ROLE %I NOLOGIN', '{{ $app }}')
                FROM pg_roles WHERE rolname = '{{ $app }}' AND rolcanlogin \gexec
              SQL
              echo "role {{ $app }} can't log in to $PGHOST"
          resources:
            {{- toYaml $.Values.appDatabases.resources | nindent 12 }}
        {{- end }}
        {{- end }}
        {{- end }}
{{- end }}
