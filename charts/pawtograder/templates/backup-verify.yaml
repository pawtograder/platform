{{- /*
Restore verification — the half of a backup strategy most installs skip.
Downloads the NEWEST backup object and runs `pg_restore --list` over it,
validating download integrity + archive structure (TOC) end-to-end. A
corrupt, truncated, or empty backup fails this job; without it, a backup
that has been silently broken for weeks looks identical to a good one
until the day you actually need it.

This is a structural check, not a full data-restore rehearsal — it needs
no scratch database and finishes in seconds. Periodically restoring into
a throwaway namespace is still worth doing by hand before term starts.
*/ -}}
{{- if and .Values.postgres.enabled .Values.backup.enabled .Values.backup.verify.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "backup-verify") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "backup-verify") | nindent 4 }}
spec:
  schedule: {{ .Values.backup.verify.schedule | quote }}
  {{- /* maintenance.active: suspended, the state maintenance.sh `down` leaves
     this write-capable CronJob in (SUSPEND_CRONJOBS). Off, nothing is rendered
     and the API default (false) applies, as before. */}}
  {{- if .Values.maintenance.active }}
  suspend: true
  {{- end }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.backup.verify.startingDeadlineSeconds | default 1800 }}
  # Each retained pod holds its scratch PVC until the pod is deleted, so these
  # limits are also the retained-storage lever. Successful runs default to 1:
  # the dump is already uploaded and size-verified, so older success logs are
  # not worth a claim each. Failures keep 3 — that is what you debug.
  successfulJobsHistoryLimit: {{ .Values.backup.verify.successfulJobsHistoryLimit | default 1 }}
  failedJobsHistoryLimit: {{ .Values.backup.verify.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ .Values.backup.verify.activeDeadlineSeconds | default 1800 }}
      template:
        metadata:
          labels:
            {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "backup-verify") | nindent 12 }}
        spec:
          # Never, not OnFailure — see backup.yaml: OnFailure counts container
          # restarts inside one pod and deletes that pod when the limit trips,
          # destroying the logs of every attempt.
          restartPolicy: Never
          serviceAccountName: {{ include "pawtograder.serviceAccountName" . }}
          {{- include "pawtograder.imagePullSecrets" . | nindent 10 }}
          containers:
            - name: verify
              image: {{ include "pawtograder.image" (dict "ctx" . "image" .Values.backup.image) }}
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              # bash, not sh — see backup.yaml (dash rejects pipefail).
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  # Baked-in mc, with the same runtime fallback as
                  # backup.yaml — see the rationale there.
                  if ! command -v mc >/dev/null 2>&1; then
                    echo "[verify] mc not in image — installing at runtime (see backup.image)"
                    apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
                    curl -fsSL "{{ .Values.backup.mc.url }}" -o /usr/local/bin/mc
                    echo "{{ .Values.backup.mc.sha256 }}  /usr/local/bin/mc" | sha256sum -c -
                    chmod +x /usr/local/bin/mc
                  fi
                  mc alias set s3 "${S3_ENDPOINT}" "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}"
                  # Newest dump under daily/, falling back to the bucket root
                  # where chart <= 0.3.27 wrote them (drop the fallback once
                  # backup.retention.legacyRootDays has emptied the root).
                  # Timestamped names sort lexicographically == chronologically.
                  # The fallback is only for an EMPTY daily/: a FAILED listing
                  # is fatal, or a denied or flaky daily/ would quietly check
                  # an old root dump and pass. `|| true` covers only the grep,
                  # which fails under pipefail when no name matches.
                  newest() {
                    local out
                    out=$(mc ls "s3/${S3_BUCKET}/$1") || return 1
                    printf '%s\n' "$out" | awk '{print $NF}' | grep '^pawtograder-.*\.dump$' | sort | tail -1 || true
                  }
                  DIR=daily/
                  if ! LATEST=$(newest daily/); then
                    echo "[verify] FATAL: could not list s3/${S3_BUCKET}/daily/"; exit 1
                  fi
                  if [ -z "$LATEST" ]; then
                    DIR=""
                    if ! LATEST=$(newest ""); then
                      echo "[verify] FATAL: could not list s3/${S3_BUCKET}/"; exit 1
                    fi
                  fi
                  if [ -z "$LATEST" ]; then
                    echo "[verify] FATAL: no pawtograder-*.dump objects in s3/${S3_BUCKET}/daily/ or the bucket root — backups are not landing"
                    exit 1
                  fi
                  echo "[verify] newest backup: ${DIR}${LATEST}"
                  # /scratch, not /tmp — this download is the same ~7 GB
                  # as the dump itself, and on the container writable layer it
                  # was pushing nodes into DiskPressure. See backup.yaml.
                  mc cp "s3/${S3_BUCKET}/${DIR}${LATEST}" /scratch/latest.dump
                  # TOC must parse and contain a sane number of entries.
                  ENTRIES=$(pg_restore --list /scratch/latest.dump | grep -c '^[0-9]' || true)
                  echo "[verify] pg_restore --list OK: ${ENTRIES} TOC entries, $(stat -c%s /scratch/latest.dump) bytes"
                  if [ "${ENTRIES}" -lt 10 ]; then
                    echo "[verify] FATAL: suspiciously small TOC (${ENTRIES} entries) — dump is likely empty/corrupt"
                    exit 1
                  fi
                  # Backup freshness: the newest object must be younger than
                  # 2x the backup cadence (~daily ⇒ 48h) or backups have
                  # quietly stopped running/uploading.
                  TS_PART=$(echo "$LATEST" | sed -E 's/^pawtograder-([0-9TZ]+)\.dump$/\1/')
                  BACKUP_EPOCH=$(date -u -d "${TS_PART:0:8} ${TS_PART:9:2}:${TS_PART:11:2}:${TS_PART:13:2}" +%s)
                  AGE_H=$(( ( $(date -u +%s) - BACKUP_EPOCH ) / 3600 ))
                  echo "[verify] newest backup is ${AGE_H}h old"
                  if [ "$AGE_H" -gt 48 ]; then
                    echo "[verify] FATAL: newest backup is older than 48h — the backup CronJob is not producing output"
                    exit 1
                  fi
                  # Nothing below reads the download again, and a retained pod
                  # keeps its claim, so free the space now rather than holding a
                  # dump-sized chunk of the scratch tier until the Job is reaped.
                  rm -f /scratch/latest.dump
                  {{- range $app := compact (splitList " " (include "pawtograder.backupApps.enabled" $)) }}
                  # {{ $app }} (backup-apps.yaml): the same checks on the newest
                  # daily/{{ $app }}-<TS>.dump. No root fallback: these never
                  # lived there, so an empty daily/ means the backup isn't landing.
                  if ! OUT=$(mc ls "s3/${S3_BUCKET}/daily/{{ $app }}-"); then
                    echo "[verify] FATAL: could not list s3/${S3_BUCKET}/daily/{{ $app }}-"; exit 1
                  fi
                  APP_TS=$(printf '%s\n' "$OUT" | awk '{print $NF}' | grep -E '^{{ $app }}-[0-9]{8}T[0-9]{6}Z\.dump$' | sort | tail -1 | sed -E 's/^{{ $app }}-(.*)\.dump$/\1/' || true)
                  if [ -z "$APP_TS" ]; then
                    echo "[verify] FATAL: no {{ $app }}-*.dump objects in s3/${S3_BUCKET}/daily/ — the {{ $app }} backup is not landing"
                    exit 1
                  fi
                  echo "[verify] newest {{ $app }} backup: daily/{{ $app }}-${APP_TS}.dump"
                  mc cp "s3/${S3_BUCKET}/daily/{{ $app }}-${APP_TS}.dump" /scratch/{{ $app }}.dump
                  ENTRIES=$(pg_restore --list /scratch/{{ $app }}.dump | grep -c '^[0-9]' || true)
                  echo "[verify] {{ $app }}: pg_restore --list OK: ${ENTRIES} TOC entries, $(stat -c%s /scratch/{{ $app }}.dump) bytes"
                  rm -f /scratch/{{ $app }}.dump
                  if [ "${ENTRIES}" -lt 10 ]; then
                    echo "[verify] FATAL: {{ $app }}: suspiciously small TOC (${ENTRIES} entries) — dump is likely empty/corrupt"
                    exit 1
                  fi
                  AGE_H=$(( ( $(date -u +%s) - $(date -u -d "${APP_TS:0:8} ${APP_TS:9:2}:${APP_TS:11:2}:${APP_TS:13:2}" +%s) ) / 3600 ))
                  echo "[verify] newest {{ $app }} backup is ${AGE_H}h old"
                  if [ "$AGE_H" -gt 48 ]; then
                    echo "[verify] FATAL: newest {{ $app }} backup is older than 48h — its CronJob is not producing output"
                    exit 1
                  fi
                  {{- if eq $app "forgejo" }}
                  # A set whose run left unreadable repositories out carries
                  # forgejo-<TS>.incomplete, listing them. It's kept for salvage
                  # only, so the newest set being one fails verify by name.
                  if printf '%s\n' "$OUT" | awk '{print $NF}' | grep -qxF "forgejo-${APP_TS}.incomplete"; then
                    echo "[verify] FATAL: forgejo-${APP_TS} is incomplete: its backup left out these repositories:"
                    mc cat "s3/${S3_BUCKET}/daily/forgejo-${APP_TS}.incomplete" | sed 's/^/[verify]   /'
                    exit 1
                  fi
                  # The volume archive from the same run: same <TS>, readable to
                  # the end, and holding the repositories root and app.ini (the
                  # SECRET_KEY the database's encrypted columns need).
                  ARCHIVE="s3/${S3_BUCKET}/daily/forgejo-${APP_TS}.tar.gz"
                  if ! mc stat "$ARCHIVE" >/dev/null; then
                    echo "[verify] FATAL: forgejo-${APP_TS}.dump has no forgejo-${APP_TS}.tar.gz beside it — Forgejo's repositories were not backed up with it"
                    exit 1
                  fi
                  mc cat "$ARCHIVE" | tar -tzf - > /scratch/forgejo.list
                  for want in {{ include "pawtograder.backupApps.forgejoRepoRoot" $ }}/ ./gitea/conf/app.ini; do
                    if ! grep -qxF "$want" /scratch/forgejo.list; then
                      echo "[verify] FATAL: forgejo-${APP_TS}.tar.gz has no $want"
                      exit 1
                    fi
                  done
                  echo "[verify] forgejo: volume archive OK: $(wc -l < /scratch/forgejo.list) entries, $(grep -c '^{{ include "pawtograder.backupApps.forgejoRepoRoot" $ }}/[^/]*/[^/]*\.git/$' /scratch/forgejo.list || true) repositories"
                  rm -f /scratch/forgejo.list
                  {{- end }}
                  {{- end }}
              volumeMounts:
                - { name: scratch, mountPath: /scratch }
              env:
                - name: S3_ENDPOINT
                  value: {{ required "backup.s3.endpoint is required when backup.enabled=true" .Values.backup.s3.endpoint | quote }}
                - name: S3_BUCKET
                  value: {{ required "backup.s3.bucket is required when backup.enabled=true" .Values.backup.s3.bucket | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.names.s3 }}
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.names.s3 }}
                      key: AWS_SECRET_ACCESS_KEY
          volumes:
            # Download staging area — per-pod ephemeral PVC, same rationale as
            # backup.yaml. Falls back to the backup job's own scratch settings.
            - name: scratch
              ephemeral:
                volumeClaimTemplate:
                  metadata:
                    annotations:
                      trident.netapp.io/unixPermissions: "0777"
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    {{- with .Values.backup.verify.scratchStorageClass | default .Values.backup.scratchStorageClass | default .Values.postgres.persistence.storageClass }}
                    # Omitted when empty — see backup.yaml.
                    storageClassName: {{ . | quote }}
                    {{- end }}
                    resources:
                      requests:
                        storage: {{ .Values.backup.verify.scratchSize | default .Values.backup.scratchSize | default "30Gi" | quote }}
{{- end }}
