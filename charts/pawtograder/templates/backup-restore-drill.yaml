{{- /*
Restore DRILL — the full-restore rehearsal that backup-verify stops short of.
backup-verify proves the archive parses; this proves it RESTORES into a working
database.

Reworked to restore into a FRESH, throwaway postgres instance on its own
ephemeral volume instead of a scratch DB on the LIVE primary. Why:
  - keeps the ~28 GB restore I/O off the primary's fast tier — the scratch
    volume uses restoreDrill.storageClass (e.g. netapp-economy);
  - no contention (CPU/connections/space) on the production primary;
  - teardown is automatic: the ephemeral PVC dies with the pod, so there is no
    scratch-DB reap / DROP ... WITH (FORCE) to get right.

A LOGICAL dump restore needs the supabase role + extension baseline to already
exist (RLS policies reference anon/authenticated/service_role, extensions need
their binaries + the pgsodium key). So the drill boots a throwaway instance via
the image's OWN entrypoint (initdb + the same init scripts / pgsodium key the
primary uses), then restores the dump into a fresh scratch DB on it.

An initContainer fetches the dump (needs root for the `mc` install); the main
container runs postgres (image entrypoint, drops to the postgres user itself).

Off by default. Enable in prod; schedule clear of the backup window.
*/ -}}
{{- if and .Values.postgres.enabled .Values.backup.enabled .Values.backup.restoreDrill.enabled }}
{{- $rd := .Values.backup.restoreDrill }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "backup-restore-drill") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "backup-restore-drill") | nindent 4 }}
spec:
  schedule: {{ $rd.schedule | quote }}
  {{- /* maintenance.active: suspended, the state maintenance.sh `down` leaves
     this write-capable CronJob in (SUSPEND_CRONJOBS). Off, nothing is rendered
     and the API default (false) applies, as before. */}}
  {{- if .Values.maintenance.active }}
  suspend: true
  {{- end }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ $rd.startingDeadlineSeconds | default 1800 }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $rd.activeDeadlineSeconds | default 5400 }}
      # Reclaim the finished Job + its ephemeral scratch PVC after completion.
      ttlSecondsAfterFinished: {{ dig "ttlSecondsAfterFinished" 3600 $rd }}
      template:
        metadata:
          labels:
            {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "backup-restore-drill") | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "pawtograder.serviceAccountName" . }}
          {{- include "pawtograder.imagePullSecrets" . | nindent 10 }}
          # Per-container securityContext (NOT pod-level runAsUser): the
          # fetch-dump init container needs root (apt installs mc), but the main
          # container must run as uid 101 so the postgres entrypoint SKIPS its
          # root chown — on an all_squash/anon export a squashed-root chown fails
          # ("Operation not permitted"), and running as 101 also means PGDATA is
          # owned by 101 (preserved by root_squash), which postgres requires.
          # fsGroup 101 so the group matches for the ephemeral volume.
          securityContext:
            fsGroup: 101
          initContainers:
            # Fetch the newest dump. Separate container because installing `mc`
            # needs root (apt), but the postgres container must not run as root.
            - name: fetch-dump
              image: {{ include "pawtograder.image" (dict "ctx" . "image" .Values.backup.image) }}
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              securityContext:
                runAsUser: 0
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  # Baked-in mc, with the same runtime fallback as
                  # backup.yaml — see the rationale there.
                  if ! command -v mc >/dev/null 2>&1; then
                    echo "[drill] mc not in image — installing at runtime (see backup.image)"
                    apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
                    curl -fsSL "{{ .Values.backup.mc.url }}" -o /usr/local/bin/mc
                    echo "{{ .Values.backup.mc.sha256 }}  /usr/local/bin/mc" | sha256sum -c -
                    chmod +x /usr/local/bin/mc
                  fi
                  mc alias set s3 "${S3_ENDPOINT}" "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}"
                  # Newest dump under daily/, falling back to the bucket root
                  # (chart <= 0.3.27) only when daily/ is EMPTY, never when
                  # its listing fails. Same selection as backup-verify.
                  newest() {
                    local out
                    out=$(mc ls "s3/${S3_BUCKET}/$1") || return 1
                    printf '%s\n' "$out" | awk '{print $NF}' | grep '^pawtograder-.*\.dump$' | sort | tail -1 || true
                  }
                  DIR=daily/
                  if ! LATEST=$(newest daily/); then
                    echo "[drill] FATAL: could not list s3/${S3_BUCKET}/daily/"; exit 1
                  fi
                  if [ -z "$LATEST" ]; then
                    DIR=""
                    if ! LATEST=$(newest ""); then
                      echo "[drill] FATAL: could not list s3/${S3_BUCKET}/"; exit 1
                    fi
                  fi
                  if [ -z "$LATEST" ]; then
                    echo "[drill] FATAL: no pawtograder-*.dump objects in s3/${S3_BUCKET}/daily/ or the bucket root"; exit 1
                  fi
                  echo "[drill] newest backup: ${DIR}${LATEST}"
                  mc cp "s3/${S3_BUCKET}/${DIR}${LATEST}" /work/latest.dump
                  echo "${DIR}${LATEST}" > /work/dump-name
                  {{- range $app := compact (splitList " " (include "pawtograder.backupApps.enabled" $)) }}
                  # {{ $app }} (backup-apps.yaml): the newest daily/{{ $app }}-<TS>.dump,
                  # restored by the restore-drill-{{ $app }} container.
                  if ! OUT=$(mc ls "s3/${S3_BUCKET}/daily/{{ $app }}-"); then
                    echo "[drill] FATAL: could not list s3/${S3_BUCKET}/daily/{{ $app }}-"; exit 1
                  fi
                  APP_TS=$(printf '%s\n' "$OUT" | awk '{print $NF}' | grep -E '^{{ $app }}-[0-9]{8}T[0-9]{6}Z\.dump$' | sort | tail -1 | sed -E 's/^{{ $app }}-(.*)\.dump$/\1/' || true)
                  if [ -z "$APP_TS" ]; then
                    echo "[drill] FATAL: no {{ $app }}-*.dump objects in s3/${S3_BUCKET}/daily/"; exit 1
                  fi
                  echo "[drill] newest {{ $app }} backup: daily/{{ $app }}-${APP_TS}.dump"
                  mc cp "s3/${S3_BUCKET}/daily/{{ $app }}-${APP_TS}.dump" /work/{{ $app }}.dump
                  echo "daily/{{ $app }}-${APP_TS}" > /work/{{ $app }}-name
                  {{- if eq $app "forgejo" }}
                  # A set marked forgejo-<TS>.incomplete is missing the
                  # repositories that file lists: fail the drill naming them.
                  if printf '%s\n' "$OUT" | awk '{print $NF}' | grep -qxF "forgejo-${APP_TS}.incomplete"; then
                    echo "[drill] FATAL: forgejo-${APP_TS} is incomplete: its backup left out these repositories:"
                    mc cat "s3/${S3_BUCKET}/daily/forgejo-${APP_TS}.incomplete" | sed 's/^/[drill]   /'
                    exit 1
                  fi
                  # The archive from the same run: its file list, to match against
                  # the restored database, and its repositories, extracted for the
                  # restore-drill-forgejo-repositories container to git fsck.
                  mc cp "s3/${S3_BUCKET}/daily/forgejo-${APP_TS}.tar.gz" /scratch/forgejo.tar.gz
                  tar -tzf /scratch/forgejo.tar.gz > /work/forgejo.list
                  mkdir -p /scratch/forgejo-data
                  tar -xzf /scratch/forgejo.tar.gz -C /scratch/forgejo-data "{{ include "pawtograder.backupApps.forgejoRepoRoot" $ }}"
                  rm -f /scratch/forgejo.tar.gz
                  {{- end }}
                  {{- end }}
              env:
                - name: S3_ENDPOINT
                  value: {{ required "backup.s3.endpoint is required" .Values.backup.s3.endpoint | quote }}
                - name: S3_BUCKET
                  value: {{ required "backup.s3.bucket is required" .Values.backup.s3.bucket | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: {{ .Values.secrets.names.s3 }}, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: {{ .Values.secrets.names.s3 }}, key: AWS_SECRET_ACCESS_KEY } }
              volumeMounts:
                - { name: work, mountPath: /work }
                {{- if .Values.forgejo.enabled }}
                - { name: scratch, mountPath: /scratch }
                {{- end }}
          containers:
            - name: restore-drill
              image: {{ include "pawtograder.image" (dict "ctx" . "image" .Values.postgres.image) }}
              imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
              # uid 101 so the postgres entrypoint runs entirely as the postgres
              # user (no root chown; PGDATA owned by 101 as required).
              securityContext:
                runAsUser: 101
                runAsGroup: 101
              # The image entrypoint (postgres) boots a fresh cluster on the empty
              # ephemeral PGDATA, running the mounted init scripts (roles/pgsodium)
              # exactly like the primary. We background it, wait for readiness, then
              # restore into a fresh scratch DB and assert. archive_mode=off so the
              # throwaway can never wal-push into the live prefix.
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  # Do NOT export PGHOST here: the image entrypoint's init scripts
                  # (migrate.sh, zy-app-role.sh, …) run while postgres listens on
                  # the UNIX SOCKET only (no TCP yet). Exporting PGHOST=127.0.0.1
                  # makes those scripts try TCP → "connection refused" → the
                  # entrypoint aborts init. Leave the env clean so they use the
                  # socket (as on the primary); set connection params only AFTER
                  # the real server is up, for our own restore commands below.
                  echo "[drill] booting throwaway postgres on ephemeral volume ($(cat /work/dump-name))"
                  docker-entrypoint.sh postgres \
                    -c config_file=/etc/postgresql/postgresql.conf \
                    -c hba_file=/etc/postgresql/pg_hba.conf \
                    -c archive_mode=off -c archive_command=/bin/true &
                  PG_PID=$!

                  echo "[drill] waiting for the fresh instance to finish init + accept connections"
                  for i in $(seq 1 {{ $rd.startupTimeoutSeconds | default 900 }}); do
                    pg_isready -q -h 127.0.0.1 -U supabase_admin -d postgres && break
                    kill -0 "$PG_PID" 2>/dev/null || { echo "[drill] FATAL: instance exited during init"; exit 1; }
                    sleep 2
                  done
                  pg_isready -q -h 127.0.0.1 -U supabase_admin -d postgres \
                    || { echo "[drill] FATAL: instance never became ready"; exit 1; }

                  # Server is up on TCP now — safe to point our restore at it.
                  export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=supabase_admin PGPASSWORD="$POSTGRES_PASSWORD"
                  SCRATCH="restore_drill"
                  psql -d postgres -c "CREATE DATABASE \"$SCRATCH\";"
                  # Triggers off for the whole restore (defense in depth: no audit/
                  # notification/pg_net side effects fire even if the dump layout
                  # changed). FK triggers off too — fine, this is a recoverability
                  # check, and the fresh instance has no live consumers anyway.
                  psql -d postgres -c "ALTER DATABASE \"$SCRATCH\" SET session_replication_role = replica;"

                  # Restore. pg_cron still can't install unless the target DB name
                  # matches cron.database_name, so a couple of benign pg_cron errors
                  # remain — judge recoverability by the row-count assertion, same
                  # as before. (Strict fail-on-error is a follow-up once pg_cron is
                  # routed cleanly.)
                  pg_restore --no-owner --no-acl -d "$SCRATCH" /work/latest.dump \
                    || echo "[drill] pg_restore reported ignored errors (above); validating via row count"

                  TABLE="{{ $rd.assertTable }}"; MIN="{{ $rd.assertMinRows }}"
                  COUNT=$(psql -d "$SCRATCH" -tAc "SELECT count(*) FROM ${TABLE};")
                  echo "[drill] restored ${TABLE} rows: ${COUNT} (require >= ${MIN})"
                  [ "${COUNT}" -ge "${MIN}" ] || { echo "[drill] FATAL: ${TABLE} has ${COUNT} rows (< ${MIN})"; exit 1; }

                  echo "[drill] restore drill PASSED for $(cat /work/dump-name)"
                  pg_ctl -D "$PGDATA" -m immediate stop || true
              env:
                - name: POSTGRES_DB
                  value: {{ .Values.postgres.database | quote }}
                - name: POSTGRES_USER
                  value: supabase_admin
                - name: PGDATA
                  value: /scratch/pgdata
                - name: POSTGRES_PASSWORD
                  valueFrom: { secretKeyRef: { name: {{ .Values.secrets.names.postgres }}, key: POSTGRES_PASSWORD } }
                - name: PAWTOGRADER_PASSWORD
                  valueFrom: { secretKeyRef: { name: {{ .Values.secrets.names.postgres }}, key: PAWTOGRADER_PASSWORD } }
                - name: JWT_SECRET
                  valueFrom: { secretKeyRef: { name: {{ .Values.secrets.names.jwt }}, key: JWT_SECRET } }
              volumeMounts:
                - { name: scratch, mountPath: /scratch }
                - { name: work, mountPath: /work }
                - { name: config, mountPath: /etc/postgresql/postgresql.conf, subPath: postgresql.conf }
                - { name: config, mountPath: /etc/postgresql/pg_hba.conf, subPath: pg_hba.conf }
                - { name: config, mountPath: /etc/postgresql/pgsodium_getkey.sh, subPath: pgsodium_getkey.sh }
                - { name: config, mountPath: /docker-entrypoint-initdb.d/00-supabase-admin.sh, subPath: 00-supabase-admin.sh }
                - { name: config, mountPath: /docker-entrypoint-initdb.d/zy-app-role.sh, subPath: init-app-role.sh }
                - { name: config, mountPath: /docker-entrypoint-initdb.d/zz-supabase-passwords.sh, subPath: zz-supabase-passwords.sh }
                - { name: pgsodium, mountPath: /var/run/secrets/pgsodium, readOnly: true }
            {{- range $app := compact (splitList " " (include "pawtograder.backupApps.enabled" $)) }}
            # {{ $app }}'s newest dump, restored into a plain Postgres of its own
            # on <app>-db.image, beside the Pawtograder drill. Strict: any
            # restore error fails the drill (these databases have no pg_cron).
            - name: restore-drill-{{ $app }}
              image: {{ include "pawtograder.backupApps.image" (dict "ctx" $ "app" $app) }}
              imagePullPolicy: {{ (index $.Values (printf "%s-db" $app)).image.pullPolicy | default "IfNotPresent" }}
              # The postgres user of the official image.
              securityContext:
                runAsUser: 999
                runAsGroup: 999
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  # Unix socket only, so it can't clash with the Pawtograder drill's 5432.
                  export PGDATA=/scratch/{{ $app }}-pgdata PGHOST=/tmp PGPORT=5433 PGUSER=postgres
                  initdb -U postgres --auth=trust >/dev/null
                  pg_ctl -w -t 300 -o "-c listen_addresses='' -k /tmp -p 5433" start
                  psql -v ON_ERROR_STOP=1 -qd postgres -c "CREATE DATABASE {{ $app }};"
                  pg_restore --exit-on-error --no-owner --no-acl -d {{ $app }} /work/{{ $app }}.dump
                  {{- if eq $app "forgejo" }}
                  USERS=$(psql -d forgejo -tAc 'SELECT count(*) FROM "user";')
                  echo "[drill] forgejo: restored ${USERS} users (require >= 1)"
                  [ "$USERS" -ge 1 ] || { echo "[drill] FATAL: forgejo has no users"; exit 1; }
                  # Every repository the database names must be in the archive
                  # taken after the dump. One deleted or renamed while the backup
                  # ran is missing, and fails the drill for that set. One created
                  # while it ran is only in the archive, and is reported.
                  ROOT="{{ include "pawtograder.backupApps.forgejoRepoRoot" $ }}"
                  psql -d forgejo -tAc "SELECT lower(owner_name) || '/' || lower_name FROM repository;" | sort > /tmp/db-repos
                  REPO_ROOT="$ROOT" {{ include "pawtograder.backupApps.listRepositories" $ }} /work/forgejo.list \
                    | grep -v '\.wiki$' | sort > /tmp/archive-repos || true
                  REPOS=$(wc -l < /tmp/db-repos)
                  MISSING=0
                  while IFS= read -r repo; do
                    echo "[drill] forgejo: repository ${repo} is in the database but not in the archive"
                    MISSING=$((MISSING + 1))
                  done < <(comm -23 /tmp/db-repos /tmp/archive-repos)
                  while IFS= read -r repo; do
                    echo "[drill] forgejo: repository ${repo} is in the archive but not in the database (created during the backup?)"
                  done < <(comm -13 /tmp/db-repos /tmp/archive-repos)
                  echo "[drill] forgejo: ${REPOS} repositories in the database, ${MISSING} missing from the archive"
                  [ "$MISSING" -eq 0 ] || { echo "[drill] FATAL: the database and the archive don't match"; exit 1; }
                  {{- else }}
                  USERS=$(psql -d coder -tAc 'SELECT count(*) FROM users;')
                  echo "[drill] coder: restored ${USERS} users (require >= 1)"
                  [ "$USERS" -ge 1 ] || { echo "[drill] FATAL: coder has no users"; exit 1; }
                  {{- end }}
                  echo "[drill] restore drill PASSED for $(cat /work/{{ $app }}-name)"
                  pg_ctl -m fast stop
              volumeMounts:
                - { name: scratch, mountPath: /scratch }
                - { name: work, mountPath: /work }
            {{- if eq $app "forgejo" }}
            # git fsck on every repository in the archive, wikis included, on
            # Forgejo's own image. A repository missing objects, with a ref to
            # a missing object, or that isn't a git repository fails the drill.
            - name: restore-drill-forgejo-repositories
              image: {{ include "gitea.image" $.Subcharts.forgejo }}
              imagePullPolicy: {{ $.Values.forgejo.image.pullPolicy | default "IfNotPresent" }}
              {{- with $.Values.forgejo.containerSecurityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  export HOME=/tmp GIT_CONFIG_NOSYSTEM=1
                  # Extracted as root with Forgejo's owner kept; git's ownership
                  # check would otherwise refuse them.
                  export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0='*'
                  ROOT=/scratch/forgejo-data/{{ trimPrefix "./" (include "pawtograder.backupApps.forgejoRepoRoot" $) }}
                  REPOS=0
                  BROKEN=0
                  for repo in "$ROOT"/*/*.git; do
                    [ -e "$repo" ] || continue
                    REPOS=$((REPOS + 1))
                    if ! GIT_DIR="$repo" git fsck --connectivity-only --no-dangling --no-progress; then
                      echo "[drill] forgejo: ${repo#"$ROOT"/} fails git fsck"
                      BROKEN=$((BROKEN + 1))
                    fi
                  done
                  echo "[drill] forgejo: git fsck on ${REPOS} repositories in the archive, ${BROKEN} failed"
                  [ "$BROKEN" -eq 0 ] || { echo "[drill] FATAL: the archive holds broken repositories"; exit 1; }
                  echo "[drill] restore drill PASSED for the repositories of $(cat /work/forgejo-name)"
              volumeMounts:
                - { name: scratch, mountPath: /scratch }
                - { name: work, mountPath: /work }
            {{- end }}
            {{- end }}
          volumes:
            # Throwaway PGDATA — its own volume, off the primary's tier.
            - name: scratch
              ephemeral:
                volumeClaimTemplate:
                  metadata:
                    annotations:
                      trident.netapp.io/unixPermissions: "0777"
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    storageClassName: {{ $rd.storageClass | default .Values.postgres.persistence.storageClass | quote }}
                    resources:
                      requests:
                        storage: {{ $rd.scratchSize | default "100Gi" | quote }}
            - name: work
              emptyDir: {}
            - name: config
              configMap:
                name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "postgres-config") }}
                defaultMode: 0755
            - name: pgsodium
              secret:
                secretName: {{ .Values.secrets.names.jwt }}
                defaultMode: 0444
                items:
                  - { key: PGSODIUM_ROOT_KEY, path: PGSODIUM_ROOT_KEY, mode: 0444 }
{{- end }}
