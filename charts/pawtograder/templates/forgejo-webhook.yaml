{{- /* Forgejo skips the address check for host-name entries, so a wildcard lets a student's hook reach any in-cluster address. */}}
{{- if .Values.forgejo.enabled }}
{{- $cmName := printf "%s-forgejo-webhook" .Release.Name }}
{{- with dig "gitea" "config" "webhook" "ALLOWED_HOST_LIST" "" .Values.forgejo }}
{{- fail (printf "forgejo.gitea.config.webhook.ALLOWED_HOST_LIST=%q would be overridden: the chart sets it from forgejo.webhookAllowedHosts plus the API host" .) }}
{{- end }}
{{- range (.Values.forgejo.webhookAllowedHosts | default list) }}
{{- if or (contains "*" (toString .)) (contains "," (toString .)) (eq (lower (toString .)) "private") }}
{{- fail (printf "forgejo.webhookAllowedHosts can't contain %q: anyone who can add a webhook to a repository could then send requests into the cluster" (toString .)) }}
{{- end }}
{{- end }}
{{- $ref := dict }}
{{- range .Values.forgejo.gitea.additionalConfigFromEnvs }}{{ if eq .name "FORGEJO__WEBHOOK__ALLOWED_HOST_LIST" }}{{ $ref = dig "valueFrom" "configMapKeyRef" dict . }}{{ end }}{{ end }}
{{- if not (and (eq (toString $ref.name) $cmName) (eq (toString $ref.key) "ALLOWED_HOST_LIST")) }}
{{- fail (printf "forgejo.gitea.additionalConfigFromEnvs must keep the chart's FORGEJO__WEBHOOK__ALLOWED_HOST_LIST entry (valueFrom.configMapKeyRef %s, key ALLOWED_HOST_LIST); an overlay that sets the list must include it" $cmName) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cmName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "forgejo") | nindent 4 }}
data:
  # Read at startup: a change needs a Forgejo pod restart.
  ALLOWED_HOST_LIST: {{ include "pawtograder.forgejo.webhookAllowedHostList" . | quote }}
{{- end }}
