{{- /*
NetworkPolicies (networkPolicy.enabled):

  1. default-deny     — no ingress to any pod of this release unless a
                        policy below allows it. Blocks every other
                        namespace (other previews, unrelated apps) from
                        reaching postgres:5432, Kong admin :8001, Redis,
                        or the unauthenticated metrics ports.
  2. allow-same-release — pods of this release (incl. Helm hook Jobs, which
                        carry the same selector labels) talk freely to each
                        other: kong→upstreams, services→postgres, realtime
                        BEAM clustering, auth→smtp-relay, …
  3. allow-ingress-controller — the ingress controller's namespace may reach
                        the edge-facing pods (web, kong, studio).
  4. allow-monitoring — Prometheus' namespace may scrape any release pod
                        (rendered only when monitoring.enabled).
  5. apps-*           — the same rules for Forgejo, Coder and their *-db Postgres.

Egress is deliberately unrestricted: web + edge functions call GitHub,
Discord, SMTP, LLM APIs, S3, …; tightening egress is an overlay concern.
These objects are inert on a CNI without NetworkPolicy enforcement.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
{{- /* An empty namespaceSelector ({}) matches ALL namespaces — an empty
     value here would silently turn an allow policy into allow-from-
     everywhere, defeating default-deny. Refuse to render instead. */}}
{{- if empty .Values.networkPolicy.ingressControllerNamespaceSelector }}
{{- fail "networkPolicy.ingressControllerNamespaceSelector must be non-empty when networkPolicy.enabled=true (an empty selector matches every namespace)" }}
{{- end }}
{{- if and .Values.monitoring.enabled (empty .Values.networkPolicy.monitoringNamespaceSelector) }}
{{- fail "networkPolicy.monitoringNamespaceSelector must be non-empty when networkPolicy.enabled=true and monitoring.enabled=true (an empty selector matches every namespace)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pawtograder.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pawtograder.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pawtograder.fullname" . }}-allow-same-release
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pawtograder.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "pawtograder.selectorLabels" . | nindent 14 }}
    {{- with .Values.networkPolicy.extraIngressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pawtograder.fullname" . }}-allow-ingress-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      # maintenance: the planned-maintenance runbook repoints the web-host
      # ingress backend to the maintenance Service, so the controller must be
      # allowed to reach its pods too (harmless when maintenance.enabled=false —
      # no pods carry the label). Without this the page is unreachable under a
      # default-deny policy even though it works where networkPolicy is off.
      - key: app.kubernetes.io/component
        operator: In
        values: ["web", "kong", "studio", "maintenance"]
    matchLabels:
      {{- include "pawtograder.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 12 }}
{{- if .Values.monitoring.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pawtograder.fullname" . }}-allow-monitoring
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pawtograder.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.monitoringNamespaceSelector | nindent 12 }}
{{- end }}
{{- $apps := list }}
{{- $onPostgres := list }}
{{- range $app := list "forgejo" "coder" }}
{{- if (index $.Values $app).enabled }}
{{- $apps = append $apps $app }}
{{- if eq (index $.Values $app).database "pawtograder" }}{{ $onPostgres = append $onPostgres $app }}{{ end }}
{{- end }}
{{- end }}
{{- if $apps }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pawtograder.fullname" . }}-apps-allow-same-release
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["forgejo", "coder", "forgejo-db", "coder-db"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [{{ include "pawtograder.name" . | quote }}, "forgejo", "coder"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pawtograder.fullname" . }}-apps-allow-ingress-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["forgejo", "coder"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 12 }}
{{- if and .Values.forgejo.enabled .Values.forgejoRunner.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pawtograder.fullname" . }}-apps-allow-forgejo-jobs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: forgejo
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              pawtograder.net/forgejo-job: {{ include "pawtograder.componentName" (dict "ctx" . "component" "forgejo-runner") }}
      ports:
        - { protocol: TCP, port: {{ include "pawtograder.forgejo.containerPort" . }} }
{{- end }}
{{- if .Values.coder.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pawtograder.fullname" . }}-apps-allow-workspaces-to-coder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coder
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.coderBootstrap.workspaceNamespace | default .Release.Namespace }} }
          podSelector:
            matchLabels: { app.kubernetes.io/name: coder-workspace }
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8443 } # coder.coder.tls
---
# No ingress: Coder then relays workspace traffic over the agent's outbound DERP connection instead of direct P2P.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pawtograder.fullname" . }}-apps-coder-workspaces
  namespace: {{ .Values.coderBootstrap.workspaceNamespace | default .Release.Namespace }}
  labels:
    {{- include "pawtograder.labels" . | nindent 4 }}
  annotations:
    # Terraform-made workspace pods can't be owned by a release object, so they outlive Coder; keep them confined.
    helm.sh/resource-policy: keep
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coder-workspace
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Agents dial CODER_ACCESS_URL; on most CNIs a ClusterIP/LoadBalancer hop is matched after DNAT, at the controller pod.
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 12 }}
    # The subchart's default access URL is coderd's in-cluster Service.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} }
          podSelector:
            matchLabels:
              app.kubernetes.io/name: coder
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8443 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{ toJson .Values.coderBootstrap.workspaces.networkPolicy.privateCidrs }}
    {{- with .Values.coderBootstrap.workspaces.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if $onPostgres }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pawtograder.fullname" . }}-apps-allow-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pawtograder.componentSelectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: {{ toJson $onPostgres }}
{{- end }}
{{- end }}
{{- end }}
