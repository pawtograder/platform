{{- $es := .Values.forgejoCoderSecrets.externalSecret }}
{{- if $es.enabled }}
{{- $secrets := list }}
{{- if .Values.forgejo.enabled }}
{{- $_ := required "forgejoCoderSecrets.externalSecret.forgejoPath is required with forgejo.enabled" $es.forgejoPath }}
{{- $secrets = append $secrets (dict "name" "forgejo-admin" "path" $es.forgejoPath "keys" (dict "username" "admin_username" "password" "admin_password")) }}
{{- $secrets = append $secrets (dict "name" "forgejo-db" "path" $es.forgejoPath "keys" (dict "PGPASSWORD" "db_password")) }}
{{- if .Values.forgejoRunner.enabled }}
{{- $secrets = append $secrets (dict "name" "forgejo-runner" "path" $es.forgejoPath "keys" (dict "secret" "runner_secret")) }}
{{- end }}
{{- end }}
{{- if .Values.coder.enabled }}
{{- $_ := required "forgejoCoderSecrets.externalSecret.coderPath is required with coder.enabled" $es.coderPath }}
{{- $secrets = append $secrets (dict "name" "coder-admin" "path" $es.coderPath "keys" (dict "email" "admin_email" "username" "admin_username" "password" "admin_password")) }}
{{- $secrets = append $secrets (dict "name" "coder-db" "path" $es.coderPath "keys" (dict "PGPASSWORD" "db_password")) }}
{{- end }}
{{- range $s := $secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Release.Name }}-{{ $s.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pawtograder.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.storeName }}
    kind: {{ $es.storeKind }}
  target:
    name: {{ $.Release.Name }}-{{ $s.name }}
    creationPolicy: Owner
  data:
    {{- range $key, $property := $s.keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $s.path }}
        property: {{ $property }}
    {{- end }}
{{- end }}
{{- end }}
