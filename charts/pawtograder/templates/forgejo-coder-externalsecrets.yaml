{{- $es := .Values.forgejoCoderSecrets.externalSecret }}
{{- if $es.enabled }}
{{- $secrets := list }}
{{- if .Values.forgejo.enabled }}
{{- $_ := required "forgejoCoderSecrets.externalSecret.forgejoPath is required with forgejo.enabled" $es.forgejoPath }}
{{- $secrets = append $secrets (dict "name" "forgejo-admin" "path" $es.forgejoPath "keys" (dict "username" "admin_username" "password" "admin_password")) }}
{{- $secrets = append $secrets (dict "name" "forgejo-db" "path" $es.forgejoPath "keys" (dict "PGPASSWORD" "db_password")) }}
{{- if $es.forgejoOAuthPath }}
{{- $secrets = append $secrets (dict "name" "forgejo-oauth" "path" $es.forgejoOAuthPath "policy" "Orphan" "keys" (dict "key" "client_id" "secret" "client_secret")) }}
{{- end }}
{{- end }}
{{- if .Values.coder.enabled }}
{{- $_ := required "forgejoCoderSecrets.externalSecret.coderPath is required with coder.enabled" $es.coderPath }}
{{- $secrets = append $secrets (dict "name" "coder-admin" "path" $es.coderPath "keys" (dict "email" "admin_email" "username" "admin_username" "password" "admin_password")) }}
{{- $secrets = append $secrets (dict "name" "coder-db" "path" $es.coderPath "keys" (dict "PGPASSWORD" "db_password")) }}
{{- if and .Values.coder.oidc.enabled $es.coderOIDCPath }}
{{- $secrets = append $secrets (dict "name" "coder-oidc" "path" $es.coderOIDCPath "policy" "Orphan" "keys" (dict "CODER_OIDC_CLIENT_ID" "client_id" "CODER_OIDC_CLIENT_SECRET" "client_secret")) }}
{{- end }}
{{- if .Values.coder.externalAuth.forgejo.enabled }}
{{- $_ := required "forgejoCoderSecrets.externalSecret.coderExternalAuthPath is required with coder.externalAuth.forgejo.enabled; scripts/setup-coder-forgejo-auth.sh writes it" $es.coderExternalAuthPath }}
{{- $secrets = append $secrets (dict "name" "coder-external-auth" "path" $es.coderExternalAuthPath "policy" "Orphan" "keys" (dict "CODER_EXTERNAL_AUTH_0_CLIENT_ID" "client_id" "CODER_EXTERNAL_AUTH_0_CLIENT_SECRET" "client_secret")) }}
{{- end }}
{{- end }}
{{- /* Runner token Secrets are named in full by forgejoRunner.*.tokenSecret, not pawtograder-<name>. */}}
{{- $runner := .Values.forgejoRunner }}
{{- if and $es.runnerPath .Values.forgejo.enabled $runner.enabled }}
{{- if $runner.dispatcher.tokenSecret }}
{{- $secrets = append $secrets (dict "target" $runner.dispatcher.tokenSecret "path" $es.runnerPath "keys" (dict "token" "dispatcher_token")) }}
{{- end }}
{{- if and (eq ($runner.actions.source | default "mirrors") "mirrors") $runner.actions.tokenSecret }}
{{- if eq $runner.actions.tokenSecret $runner.dispatcher.tokenSecret }}
{{- fail "forgejoRunner.actions.tokenSecret and forgejoRunner.dispatcher.tokenSecret name the same Secret; with forgejoCoderSecrets.externalSecret.runnerPath they hold different tokens (mirror_token, dispatcher_token)" }}
{{- end }}
{{- $secrets = append $secrets (dict "target" $runner.actions.tokenSecret "path" $es.runnerPath "keys" (dict "token" "mirror_token")) }}
{{- end }}
{{- end }}
{{- range $s := $secrets }}
{{- $name := $s.target | default (printf "%s-%s" $.Release.Name $s.name) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pawtograder.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.storeName }}
    kind: {{ $es.storeKind }}
  target:
    name: {{ $name }}
    creationPolicy: {{ $s.policy | default "Owner" }}
  data:
    {{- range $key, $property := $s.keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $s.path }}
        property: {{ $property }}
    {{- end }}
{{- end }}
{{- end }}
