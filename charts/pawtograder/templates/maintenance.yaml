{{- if .Values.maintenance.enabled }}
{{- /*
Maintenance page: a tiny static nginx Deployment + Service that returns HTTP 503
+ Retry-After with a styled body matching the app's in-app error boundary. The
planned-maintenance runbook repoints the web-host ingress backend to this
Service for the window (see docs/operations/planned-maintenance.md), then back.

Deploy this (maintenance.enabled=true, via helm upgrade) BEFORE patching the
ingress — enabling it only creates the Service; the ingress patch is what
actually reroutes traffic. It reroutes the WEB host only, so it is a user-facing
"down" banner, not a write fence: the api/kong host stays open, so scaling the
writer tiers to 0 remains the real fence.

index.html is rendered through `tpl` so maintenance.title/message/eta from values
are substituted; the ConfigMap is mounted over the image's baked copies.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "maintenance") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "maintenance") | nindent 4 }}
data:
  index.html: |
{{ tpl (.Values.maintenance.html | default (.Files.Get "maintenance/index.html")) . | indent 4 }}
  default.conf: |
    # Every application path returns 503 + the styled body + Retry-After.
    # /healthz stays 200 so the kubelet probes pass and the Service gets
    # endpoints (a probe against "/" would see 503 and mark the pod NotReady).
    server {
        listen {{ .Values.maintenance.service.port }};
        server_tokens off;
        root /usr/share/nginx/html;

        add_header Retry-After {{ .Values.maintenance.retryAfterSeconds | default 120 }} always;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        error_page 503 /index.html;
        location = /index.html {
            internal;
        }

        # Background image referenced by the 503 body must serve (200), not 503.
        location = /maintenance-mode.png {
            add_header Retry-After {{ .Values.maintenance.retryAfterSeconds | default 120 }} always;
        }

        location / {
            return 503;
        }
    }
  # Main nginx config — identical to the nginxinc/nginx-unprivileged default
  # EXCEPT worker_processes is pinned to 1. The image ships `worker_processes
  # auto`, which spawns one worker per host CPU; on a many-core node that is
  # 100+ workers for a static 503 page, blowing past resources.limits.memory and
  # OOMKilling the pod. One worker is ample here. Mounted over /etc/nginx/nginx.conf.
  nginx.conf: |
    worker_processes  1;
    error_log  /var/log/nginx/error.log notice;
    pid        /tmp/nginx.pid;
    events {
        worker_connections  1024;
    }
    http {
        proxy_temp_path /tmp/proxy_temp;
        client_body_temp_path /tmp/client_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        access_log  /var/log/nginx/access.log;
        sendfile        on;
        keepalive_timeout  65;
        include /etc/nginx/conf.d/*.conf;
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "maintenance") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "maintenance") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.maintenance.service.port }}
      targetPort: http
  selector:
    {{- include "pawtograder.componentSelectorLabels" (dict "ctx" . "component" "maintenance") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "maintenance") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "maintenance") | nindent 4 }}
spec:
  # Default 2 (not 1): the page fronts the web host during a node drain, so a
  # single replica on the drained node would leave the ingress serving 5xx until a
  # replacement schedules. Paired with the topology spread below.
  replicas: {{ .Values.maintenance.replicas | default 2 }}
  selector:
    matchLabels:
      {{- include "pawtograder.componentSelectorLabels" (dict "ctx" . "component" "maintenance") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "maintenance") | nindent 8 }}
      annotations:
        # Roll the pods when the page OR its config changes. index.html, default.conf
        # and nginx.conf are all subPath mounts, which Kubernetes does NOT hot-update
        # in a running container — so the hash must cover the values that drive
        # default.conf (service.port, retryAfterSeconds) too, not just index.html,
        # or e.g. a retryAfterSeconds change would silently never reach nginx.
        checksum/config: {{ printf "%s|%v|%v" (tpl (.Values.maintenance.html | default (.Files.Get "maintenance/index.html")) .) .Values.maintenance.service.port (.Values.maintenance.retryAfterSeconds | default 120) | sha256sum }}
    spec:
      serviceAccountName: {{ include "pawtograder.serviceAccountName" . }}
      {{- include "pawtograder.imagePullSecrets" . | nindent 6 }}
      {{- include "pawtograder.priorityClassName" (dict "ctx" . "component" .Values.maintenance) | nindent 6 }}
      {{- include "pawtograder.podSecurityContext" (dict "ctx" . "component" .Values.maintenance) | nindent 6 }}
      containers:
        - name: maintenance
          image: {{ include "pawtograder.image" (dict "ctx" . "image" .Values.maintenance.image) }}
          imagePullPolicy: {{ .Values.maintenance.image.pullPolicy }}
          {{- include "pawtograder.containerSecurityContext" (dict "ctx" . "component" .Values.maintenance) | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.maintenance.service.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.maintenance.resources | nindent 12 }}
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: content
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: content
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "maintenance") }}
      # Spread replicas across nodes so a single node drain can't evict the whole
      # page tier. Soft (ScheduleAnyway) so a single-node cluster still schedules.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "pawtograder.componentSelectorLabels" (dict "ctx" . "component" "maintenance") | nindent 14 }}
      {{- with (include "pawtograder.nodeSelector" (dict "ctx" . "component" .Values.maintenance)) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "pawtograder.tolerations" (dict "ctx" . "component" .Values.maintenance)) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
