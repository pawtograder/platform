{{- if .Values.kong.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pawtograder.componentName" (dict "ctx" . "component" "kong-config") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pawtograder.componentLabels" (dict "ctx" . "component" "kong") | nindent 4 }}
data:
  kong.yml: |
    _format_version: "2.1"
    _transform: true
    {{- if .Values.monitoring.enabled }}
    # Globally enable the Prometheus plugin so kong exposes /metrics on
    # the admin port (8001). Per-service status codes, latencies, and
    # upstream health are emitted automatically.
    plugins:
      - name: prometheus
        config:
          per_consumer: false
          status_code_metrics: true
          latency_metrics: true
          bandwidth_metrics: false
          upstream_health_metrics: true
    {{- end }}
    consumers:
      - username: anon
        keyauth_credentials:
          - key: $SUPABASE_ANON_KEY
      - username: service_role
        keyauth_credentials:
          - key: $SUPABASE_SERVICE_KEY
    acls:
      - consumer: anon
        group: anon
      - consumer: service_role
        group: admin
    services:
      - name: auth-v1-open
        url: http://{{ include "pawtograder.auth.host" . }}:{{ .Values.auth.service.port }}/verify
        routes:
          - name: auth-v1-open
            strip_path: true
            paths:
              - /auth/v1/verify
        plugins:
          - name: cors
      - name: auth-v1-open-callback
        url: http://{{ include "pawtograder.auth.host" . }}:{{ .Values.auth.service.port }}/callback
        routes:
          - name: auth-v1-open-callback
            strip_path: true
            paths:
              - /auth/v1/callback
        plugins:
          - name: cors
      - name: auth-v1-open-authorize
        url: http://{{ include "pawtograder.auth.host" . }}:{{ .Values.auth.service.port }}/authorize
        routes:
          - name: auth-v1-open-authorize
            strip_path: true
            paths:
              - /auth/v1/authorize
        plugins:
          - name: cors
      - name: auth-v1
        _comment: "GoTrue: /auth/v1/* -> http://auth:9999/*"
        url: http://{{ include "pawtograder.auth.host" . }}:{{ .Values.auth.service.port }}/
        routes:
          - name: auth-v1-all
            strip_path: true
            paths:
              - /auth/v1/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon
      - name: rest-v1
        _comment: "PostgREST: /rest/v1/* -> http://rest:3000/*"
        url: http://{{ include "pawtograder.rest.host" . }}:{{ .Values.rest.service.port }}/
        routes:
          - name: rest-v1-all
            strip_path: true
            paths:
              - /rest/v1/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: true
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon
      - name: realtime-v1
        _comment: "Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*"
        url: http://{{ include "pawtograder.realtime.host" . }}:{{ .Values.realtime.service.port }}/socket/
        routes:
          - name: realtime-v1-all
            strip_path: true
            paths:
              - /realtime/v1/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon
      - name: storage-v1
        _comment: "Storage: /storage/v1/* -> http://storage:5000/*"
        url: http://{{ include "pawtograder.storage.host" . }}:{{ .Values.storage.service.port }}/
        routes:
          - name: storage-v1-all
            strip_path: true
            paths:
              - /storage/v1/
        plugins:
          - name: cors
      - name: functions-v1
        _comment: "Functions: /functions/v1/* -> http://functions:9000/*"
        url: http://{{ include "pawtograder.edgeFunctions.host" . }}:{{ .Values.edgeFunctions.service.port }}/
        routes:
          - name: functions-v1-all
            strip_path: true
            paths:
              - /functions/v1/
        plugins:
          - name: cors
      {{- if and .Values.edgeFunctions.enabled .Values.edgeFunctions.workerTier.enabled }}
      {{- /* Background-worker tier: these function NAMES go to their own Deployment
         instead of the request tier. This is the whole mechanism of the tier split
         — no migration, no client change. Callers keep addressing
         /functions/v1/<name>, which is the one contract shared by hosted
         supabase.com, `supabase functions serve` and this deployment, and the
         split is resolved gateway-side.

         ONE KONG SERVICE PER NAME, WITH THE NAME IN THE SERVICE URL PATH. This
         is not a style choice and getting it wrong fails quietly: `strip_path`
         removes the MATCHED route path, so a route on /functions/v1/<fn> against
         a service url of ".../" would hand the demuxer "/" and main.ts would
         answer `400 missing function name in request path` on every poke. Kong
         builds the upstream as service-path + stripped-remainder, so carrying
         <fn> in the url is what reconstructs the single path segment main.ts
         routes on. The auth-v1-open / auth-v1-open-callback /
         auth-v1-open-authorize services above use exactly this shape against the
         /auth/v1/ catch-all, and have in production for as long as this file has
         existed.

         PRIORITY. These routes carry `paths` only, exactly like functions-v1-all,
         so Kong's traditional_compatible router (3.9.1, no KONG_ROUTER_FLAVOR
         set) orders them by prefix length and the longer, more specific prefix
         wins. No regex and no regex_priority needed — again, the same plain-path
         pair as /auth/v1/verify vs /auth/v1/ in this file.

         DELIBERATELY NO `hosts`. It would look tidier and it would break the
         traffic that matters: SUPABASE_URL is http://<kong-svc>:8000, so
         in-cluster pg_net pokes carry the Kong SERVICE NAME as Host, and a
         host-scoped route would miss them and send every worker poke back to the
         request tier. Conversely the channel routes below carry hosts AND paths —
         two match fields — so they out-prioritize these regardless of path
         length, and a channel host's worker traffic stays on that channel's own
         deployment. That is correct: a channel is an A/B of the whole function
         set, and pg_cron never pokes a channel host. */ -}}
      {{- $workerHost := include "pawtograder.componentName" (dict "ctx" . "component" "functions-workers") }}
      {{- range $fn := .Values.edgeFunctions.workerTier.functions }}
      - name: functions-v1-worker-{{ $fn }}
        _comment: "Functions (worker tier): /functions/v1/{{ $fn }} -> functions-workers:{{ $.Values.edgeFunctions.service.port }}/{{ $fn }}"
        url: http://{{ $workerHost }}:{{ $.Values.edgeFunctions.service.port }}/{{ $fn }}
        routes:
          - name: functions-v1-worker-{{ $fn }}
            strip_path: true
            paths:
              - /functions/v1/{{ $fn }}
        plugins:
          - name: cors
      {{- end }}
      {{- end }}
      {{- range $c := .Values.channels }}
      {{- if $c.edgeFunctions }}
      # Channel "{{ $c.name }}": /functions/v1/* on its own host routes to that
      # channel's functions deployment. This route carries `hosts`, so it
      # out-prioritizes the host-agnostic functions-v1-all above for requests to
      # the channel host; stable-host traffic still falls through to functions-v1.
      # auth/rest/realtime/storage have no `hosts` and stay shared across channels.
      - name: functions-v1-{{ $c.name }}
        _comment: "Functions ({{ $c.name }}): /functions/v1/* -> functions-{{ $c.name }}:{{ $.Values.edgeFunctions.service.port }}"
        url: http://{{ include "pawtograder.componentName" (dict "ctx" $ "component" (printf "functions-%s" $c.name)) }}:{{ $.Values.edgeFunctions.service.port }}/
        routes:
          - name: functions-v1-{{ $c.name }}
            strip_path: true
            hosts:
              - {{ include "pawtograder.channel.host" (dict "ctx" $ "channel" $c) | quote }}
            paths:
              - /functions/v1/
        plugins:
          - name: cors
      {{- end }}
      {{- end }}
      - name: meta
        _comment: "pg-meta: /pg/* -> http://meta:8080/*"
        url: http://{{ include "pawtograder.meta.host" . }}:{{ .Values.meta.service.port }}/
        routes:
          - name: meta-all
            strip_path: true
            paths:
              - /pg/
        plugins:
          - name: key-auth
            config:
              hide_credentials: false
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
{{- end }}
