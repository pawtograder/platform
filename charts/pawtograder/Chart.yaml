apiVersion: v2
name: pawtograder
description: |
  Pawtograder — self-hosted CS course operations platform.
  Bundles the Next.js web app together with the Supabase services it depends on
  (Postgres, GoTrue, PostgREST, Realtime, Storage API, Edge Functions, Kong,
  Studio, postgres-meta, supavisor) so the whole stack can be deployed to a
  Kubernetes cluster from a single Helm release.
type: application
version: 0.3.28
appVersion: "0.0.1"
kubeVersion: ">=1.27.0-0"
home: https://pawtograder.net
sources:
  - https://github.com/pawtograder/platform
maintainers:
  - name: Jonathan Bell
    email: jon@jonbell.net
keywords:
  - pawtograder
  - supabase
  - education
  - autograder
annotations:
  category: Application
# Optional and off by default (README: "Forgejo and Coder"). Vendored unpacked
# under charts/ because .helmignore drops *.tgz and CI runs no dependency build.
dependencies:
  - name: forgejo
    version: 17.1.7
    repository: oci://code.forgejo.org/forgejo-helm
    condition: forgejo.enabled
  - name: coder
    version: 2.37.3
    repository: https://helm.coder.com/v2
    condition: coder.enabled
  - name: postgres
    alias: forgejo-db
    version: 1.6.8
    repository: https://groundhog2k.github.io/helm-charts/
    condition: forgejo-db.enabled
  - name: postgres
    alias: coder-db
    version: 1.6.8
    repository: https://groundhog2k.github.io/helm-charts/
    condition: coder-db.enabled
