# grade.yml for handouts hosted on this chart's Forgejo, run by forgejoRunner. It goes at
# .github/workflows/grade.yml in the Forgejo copy of the handout (template) repository, in place of
# the GitHub one from pawtograder/template-assignment-handout; Forgejo reads .github/workflows
# when a repository has no .forgejo/workflows. Pawtograder compares each student's copy with the
# handout's, so change it in the handout, never per student. README "Grade workflow on Forgejo".
#
# To the intrepid student: You must not edit this file. Tampering with this file could
# reveal the instructor's solution to you. Hence, Pawtograder will automatically compare
# the hash of this file (when the submission is being created) to the hash of the file
# provided in your handout. In addition to failing to register a submission (and not
# providing the workflow with access to the instructor's solution), your instructors will
# be notified of this security violation.

name: Submit Assignment and Run Grader
# Forgejo ignores `permissions: id-token: write`; this is what gives the job an OIDC token.
enable-openid-connect: true
permissions:
  id-token: write
  contents: read
on:
  # Required for Pawtograder to create a submission, do not remove
  workflow_dispatch:
  push:
    branches:
      - main
# Without this, each push cancels the grading runs of the student's earlier pushes still waiting
# or running, which GitHub doesn't do.
concurrency:
  cancel-in-progress: false

jobs:
  grade:
    name: Submit and Grade Assignment
    # Any of forgejoRunner.labels. The job runs in the runner image (images/forgejo-runner), which
    # already has JDK 21, Maven, Python 3, pip, Node 22 and git, so there are no setup-* steps:
    # those download a toolchain from GitHub on every run. Bake anything else into the image.
    runs-on: ubuntu-latest
    steps:
      # Both actions resolve against the chart's mirrors (forgejoRunner.actions.mirrors). An action
      # that isn't mirrored needs adding there, or its full https://... URL here.
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          path: submission
      - name: Collect Submission and Run Grader
        uses: pawtograder/assignment-action@v4
        with:
          grading_server: "https://api.pawtograder.example.com" # your API gateway origin
          # Literals: Forgejo's runner leaves github.action_ref and github.action_repository empty
          # in `with:`, and the action refuses empty values. Keep them in step with `uses:` above.
          action_ref: "v4"
          action_repository: "pawtograder/assignment-action"
