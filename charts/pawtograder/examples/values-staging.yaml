# Long-lived staging overlay — hosts/data are durable, replicas are HA-ish,
# secrets come from ExternalSecrets backed by OpenBao.
#
# Usage:
#   helm upgrade --install pawtograder ./charts/pawtograder \
#     -n pawtograder-staging --create-namespace \
#     -f charts/pawtograder/examples/values-staging.yaml
#
# Wipe-and-redeploy helper:
#   scripts/redeploy-staging.sh
#
# Prereqs (one-time, see README "Deploying staging"):
#   - OpenBao paths under kv/apps/pawtograder-staging/* populated via
#     scripts/setup-openbao-edge-functions.sh + GenerateJwtKeys.ts.
#   - ExternalSecrets in pawtograder-staging sync those into the K8s
#     Secret names listed under `secrets.names` below.
#   - DNS for staging.pawtograder.net + api.staging.pawtograder.net +
#     studio.staging.pawtograder.net pointing at the cluster ingress.
#   - S3 buckets `pawtograder-staging-backups` and `pawtograder-staging-storage`
#     on s3.talos.ripley.cloud, with creds in pawtograder-s3.

global:
  # Activates staging-tier guard rails: refuses secrets.create and
  # migrations.resetOnDrift at render time (see templates/validations.yaml).
  environment: staging
  hostname: staging.pawtograder.net
  apiOnSeparateHost: true
  imageRegistry: ""
  # Pin to the dedicated staging node pool. Workers in that pool carry a
  # matching taint so the rest of the cluster's pods don't schedule here.
  nodeSelector:
    tier: prod-staging
  tolerations:
    - key: tier
      operator: Equal
      value: prod-staging
      effect: NoSchedule

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "55m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  tls:
    enabled: true
    secretName: pawtograder-staging-tls

# ----- A/B deployment channel: canary lane ----------------------------------
# Standing canary channel served at canary.staging.pawtograder.net (its own web
# + edge-functions build) against the SAME staging data plane. Courses opt in
# via classes.deployment_channel='canary'; the stable web middleware then
# redirects those courses here and shares the session cookie across the two
# hosts. That redirect is baked into the stable image at build time from the
# CHANNEL_HOST_SUFFIX Actions variable (set on the repo) — without it, stable
# ignores channels and this lane is simply unreachable via redirect.
#
# Pin to a known-good canary tag, NOT canary-latest: the staging auto-deploy
# (release-images.yml deploy-staging) runs `helm upgrade --wait`, which blocks
# on these channel pods too, so a broken canary image would turn an ordinary
# staging deploy red. Roll the canary forward by bumping this pin in a PR.
channels:
  - name: canary
    web:
      image:
        tag: canary-055b7e2
      replicas: 1
    edgeFunctions:
      image:
        tag: canary-055b7e2
      replicas: 1

# Reflected *.staging.pawtograder.net wildcard cert (cert-manager Certificate
# `staging-wildcard` in this namespace) — covers every channel host.
channelWildcardTlsSecret: staging-wildcard-tls

# Secrets come from ExternalSecrets synced out of OpenBao
# (kv/apps/pawtograder-staging/*). Bootstrap with:
#   scripts/setup-openbao-edge-functions.sh --bundle <name>
# and seed the JWT bundle once with:
#   npx tsx scripts/GenerateJwtKeys.ts --env > /tmp/jwt.env
#   bao kv put kv/apps/pawtograder-staging/jwt @/tmp/jwt.env
secrets:
  create: false
  names:
    jwt: pawtograder-jwt
    postgres: pawtograder-postgres
    s3: pawtograder-s3
    smtp: pawtograder-smtp
    web: pawtograder-web
    edgeFunctions: pawtograder-edge-functions

# ----- Postgres: durable local SSD ------------------------------------------
# Local-path keeps the DB on the worker's NVMe — staging doubles as our
# performance-testing target so raw IOPS matter. Tradeoff: every worker in
# the `tier=prod-staging` pool must be listed in the local-path-provisioner
# ConfigMap (kubectl -n local-path-storage edit cm local-path-config) before
# postgres can schedule there.
postgres:
  persistence:
    storageClass: local-path
    size: 100Gi
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "4"
      # 16Gi headroom past observed peak. Bumped from 12Gi after E2E load
      # under concurrent Playwright runs pushed working-set memory past
      # the old ceiling. Stock supabase docker-compose sets no limit;
      # 16Gi keeps us comfortably above the theoretical worst case
      # (max_connections × per-backend work_mem + shared_buffers +
      # maintenance_work_mem) without burning the whole node.
      memory: 16Gi

  # WAL-G continuous archiving → PITR (recover to any second in the retention
  # window, not just the nightly dump). Reuses pawtograder-s3 (Ceph at
  # s3.talos.ripley.cloud); keep the walg prefix DISTINCT from the nightly-dump
  # bucket path. See docs/operations/point-in-time-recovery.md.
  walg:
    enabled: true
    s3Prefix: s3://pawtograder-staging-backups/walg
    s3Endpoint: https://s3.talos.ripley.cloud
    region: us-east-1
    forcePathStyle: true
    baseBackup:
      intervalHours: 24
      keepBackups: 8   # ~8 days of PITR window

  # Streaming standby replica: warm failover target + read scaling. local-path
  # is fine (own volume on another node); spreadAcrossNodes keeps it off the
  # primary's node. Failover is MANUAL — see the PITR runbook.
  replica:
    enabled: true
    replicas: 1
    persistence:
      storageClass: local-path
      size: 100Gi

# ----- Stateless tier: HA-ish, generous resource ceilings ------------------
auth:
  external:
    github:
      enabled: true
      redirectUri: https://api.staging.pawtograder.net/auth/v1/callback
    # Microsoft (Entra ID), multi-tenant — GoTrue uses the common endpoint,
    # so any Microsoft account can sign in. Creds come from the
    # pawtograder-web Secret keys AZURE_OAUTH_CLIENT_ID /
    # AZURE_OAUTH_CLIENT_SECRET (synced from kv/apps/pawtograder-staging/web).
    # Redirect URI registered in Azure:
    #   https://api.staging.pawtograder.net/auth/v1/callback
    azure:
      enabled: true
    # GitHub + Discord OAuth (sign-in / identity-linking). Client id+secret are
    # read from the pawtograder-web Secret as {GITHUB,DISCORD}_OAUTH_CLIENT_ID /
    # _CLIENT_SECRET (synced from kv/apps/pawtograder-staging/web). GitHub reuses
    # the GitHub App's OAuth creds. Both providers' callback URL on the
    # GitHub/Discord app side must include
    # https://api.staging.pawtograder.net/auth/v1/callback.
    discord:
      enabled: true
  # Confirm signups via email (real round-trip) rather than auto-confirming.
  # Requires working SMTP below.
  enableEmailAutoconfirm: false
  # GoTrue transactional mail (signup confirm, magic link, recovery).
  # All creds — including SMTP_ADMIN_EMAIL (the From: address) — come from
  # the pawtograder-smtp Secret keys SMTP_HOST / SMTP_PORT / SMTP_USER /
  # SMTP_PASS / SMTP_ADMIN_EMAIL (synced from kv/apps/pawtograder-staging/smtp).
  # senderName is the only non-secret SMTP setting.
  smtp:
    enabled: true
    senderName: "Pawtograder Staging"
    # NU blocks outbound SMTP submission ports from cluster pods, so GoTrue
    # can't reach Postmark directly. This dedicated socat relay forwards to a
    # campus LXC listener that tunnels out to Postmark via a residential-ISP
    # tailscale exit-node (mirror of apps/zammad/smtp-relay.yaml, but that
    # one's LXC port ends at Dreamhost — Postmark needs its own LXC listener).
    #
    # Wiring (see README "Deploying staging" → SMTP):
    #   - LXC smtp-egress (CTID 101, 10.201.13.218): socat :1588 →
    #     autossh ssh -L → orion (home, off-NU) → smtp.postmarkapp.com:587
    #   - CoreDNS: rewrite smtp.postmarkapp.com → pawtograder-smtp-relay svc
    #   - smtp Secret: SMTP_HOST=smtp.postmarkapp.com (real host, for cert)
    relay:
      enabled: true
      # Listen port must match the smtp Secret's SMTP_PORT — GoTrue dials
      # SMTP_HOST:SMTP_PORT, the CoreDNS rewrite lands that on this relay,
      # which forwards to the LXC listener (1588 → smtp.postmarkapp.com:587).
      # Port per hop is independent; STARTTLS terminates at Postmark.
      port: 2525
      downstream: "10.201.13.218:1588"
      # Root cause of the old breakage: NU's DPI on STARTTLS submission ports
      # silently drops multi-segment (post-quantum, X25519MLKEM768) TLS
      # ClientHellos — NOT Cilium, NOT MTU. Fixed by routing through the
      # dedicated smtp-egress LXC which autossh-tunnels to orion (off-NU).
      # See k8s/apps/cilium/INTERMITTENT-POD-EGRESS-LOSS.md.
      # NOTE: 10.201.13.218 is currently a DHCP lease — set a UniFi reservation
      # for CTID 101's MAC so this pointer doesn't break on lease renewal.

rest:
  replicas: 3
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "2Gi"   }

realtime:
  replicas: 3
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "2",    memory: "2Gi" }

edgeFunctions:
  # per_request: each request gets its own isolate (no concurrent co-location),
  # so a burst can't pile multiple requests onto one shared heap and overshoot
  # the 256MB cap. Note this does NOT mean the isolate is short-lived: under
  # per_request the runtime retains and reuses it after the request and resets
  # the wall clock per request (strategy_per_request.rs :199, :240-250 — EarlyDrop
  # with oneshot == false sends UserWorkerMsgs::Idle rather than tearing down), so
  # worker.timeoutMs bounds an IDLE isolate, not a busy one. The guarantee is that
  # two requests never share a heap, not that the heap goes away.
  # Autoscaling (HPA, below) keeps enough warm pods that a burst spreads
  # ~1 request/isolate. Together: lifecycle (EarlyDrop) + isolation + capacity =
  # the supabase.com-style resilience.
  policy: per_request
  # 8, not 16. maxParallelism is PER SERVICE PATH, not per pod — edge-runtime keys active_workers
  # by service path and gives each one its own Semaphore(max_parallelism) (pool.rs :242/:325/:169,
  # v1.74.0 b1edf453) — so maxParallelism x worker.memoryLimitMb is a LOWER bound on resident
  # isolate memory rather than what the runtime "will admit", and the real ceiling is
  # (distinct paths this pod serves) x 8. Nothing enforces either: the runtime's protections are
  # per-isolate, so once actual usage exceeds the container limit the kernel OOM-kills PID 1 and
  # every in-flight request dies at once (Kong then reports 502). At 8 x 256 MiB against the 4Gi
  # limit set below the CHARGED sum is 50%, which leaves a burst somewhere to go; 16 would have
  # charged the whole limit. Raising it does not buy headroom — it lifts the ceiling on every path
  # at once. Keep maxParallelism, worker.memoryLimitMb and resources.limits.memory consistent if
  # you change any of them.
  maxParallelism: 8
  autoscaling:
    # 2026-09-02: 12-20 -> 3-5, bounding staging's RAM RESERVATION across the
    # request-memory change below. The request tripled (512Mi -> 1.5Gi) without the
    # pods becoming more capable — the increase is the load-independent ~600Mi Deno
    # baseline, not extra capacity — so leaving the replica range alone would have
    # taken staging from 6.5GiB reserved to 19.5GiB at the floor and 32.5GiB at the
    # ceiling.
    #
    # Counted across ALL THREE edge Deployments this overlay renders, which is the
    # correction that matters: an earlier version of this table counted the request
    # tier and the worker tier and silently omitted the `canary` CHANNEL enabled
    # above, which is a third edge pod and went 512Mi -> 1.5Gi with the others.
    # Read off the rendered manifests rather than derived here, because deriving it
    # by hand is what produced the wrong table twice:
    #     floor    3 x 1.5Gi + 1 x 1.5Gi + 2 x 1.5Gi =  9.0GiB  (was 13 x 512Mi =  6.5GiB)
    #     ceiling  5 x 1.5Gi + 1 x 1.5Gi + 2 x 1.5Gi = 12.0GiB  (was 21 x 512Mi = 10.5GiB)
    # (13 and 21, not 12 and 20: the canary channel was there before too, at 512Mi.
    # The worker tier's 1.5Gi is its raised request — see the workerTier resources
    # note in charts/pawtograder/values.yaml; it was 1Gi in an earlier draft of
    # this PR, which is the other reason this table has been wrong.)
    #
    # So this is NOT flat, and the earlier claim that it was is withdrawn: +38% at
    # the floor and +14% at the ceiling. The floor is what governs steady-state
    # cost, so the number that moved most is the one the resizing was trying to
    # hold still. Accepted rather than re-tuned: the node budget absorbs it, and
    # CPU requests drop 2.8 cores over the same change. 5/3 is the same 1.67x scale
    # ratio as 20/12, so burst BEHAVIOUR is unchanged even though absolute headroom
    # is not.
    #
    # What this costs in concurrency is NOT 20x8 -> 5x8. `maxParallelism` is per
    # SERVICE PATH, not per pod — edge-runtime keys its worker registry by service
    # path and gives each one its own Semaphore(max_parallelism) (pool.rs
    # :242/:325/:169, v1.74.0) — so `replicas x maxParallelism` is not a
    # concurrency figure at all. The per-pod ceiling is
    # (distinct paths that pod serves) x 8, and the fleet ceiling scales with
    # replicas from there. Fewer pods still means less total concurrency; the
    # point is that the old arithmetic understated the per-pod ceiling and
    # overstated what the replica change costs.
    #
    # NOTE: lowering these bounds does not, by itself, let a quiet fleet shrink,
    # and whether staging can scale down on memory at all is UNRESOLVED — see the
    # resources note below. The ceiling is what actually bounds staging's RAM
    # either way, which is why both numbers moved and not just the floor.
    enabled: true
    minReplicas: 3
    maxReplicas: 5
    # 80, not 100: the HPA controller applies a default 10% TOLERANCE, so a target of
    # 100 is really a dead BAND of 90-110% and anything inside it moves nothing in
    # either direction. 80 puts the band at 72-88%, and the memory request below is
    # sized to straddle it: above idle/0.72 so a quiet fleet can scale down, below
    # loaded/0.88 so a busy one can scale up. 100 is known-wrong at ANY request
    # value for that reason. This matches the chart default — an overlay that sets
    # 100 silently overrides it back to the configuration that pinned prod at
    # maxReplicas for weeks.
    targetMemoryUtilizationPercentage: 80
    targetCPUUtilizationPercentage: 200
  image:
    repository: ghcr.io/pawtograder/edge-functions
    # Tracks the latest image built from the `staging` branch by
    # release-images.yml (the deploy-staging job pins the exact staging-<sha>
    # at deploy time; this default is what manual `redeploy-staging.sh` runs
    # pick up). All the self-hosted edge fixes that used to require a hand-built
    # helm-branch image (REDIS_URL/ioredis, signed-URL host rebase, worker
    # lifecycle limits, eszip bundling, submission size guard) are on staging.
    tag: staging-latest
  # Worker limits inherit the chart defaults (256 MB isolate, 400s lifetime,
  # 2s/5s CPU), matching supabase.com. With eszip bundling the per-isolate
  # baseline sits ~10x below the 256MB cap, so per_request isolation is cheap
  # and no per-isolate memory override is needed.
  # 2026-09-01: request 512Mi -> 1.5Gi, tracking the chart default, paired with
  # autoscaling.targetMemoryUtilizationPercentage 80 above. A memory-target HPA
  # measures against the REQUEST, and the ~600Mi load-independent Deno baseline put
  # an idle pod over 100% of 512Mi — which pinned the HPA at maxReplicas
  # permanently, at any load, including none.
  #
  # OPEN, and stated as open because two earlier notes in this file asserted
  # opposite answers: whether 1.5Gi + target 80 lets staging scale DOWN on memory.
  # The arithmetic is not in doubt — the HPA's default 10% tolerance makes target
  # 80 a dead band of 72-88%, so scaling down needs idle/request < 0.72, i.e.
  # request > converged_idle_floor / 0.72. What is missing is staging's converged
  # idle floor under THIS configuration, and it cannot be measured yet because
  # this configuration is not deployed: staging currently runs the 0.3.17 values
  # (12-20 replicas, 512Mi request, and the unbounded eszip cache that 0.4.0
  # fixes), so today's numbers are not the ones this request will face.
  #
  # The two candidate answers and what decides between them:
  #   * If staging's floor is below ~1106Mi (= 1536Mi x 0.72), 1.5Gi is coherent
  #     and a quiet fleet scales down to minReplicas 3. This was the argument for
  #     tracking the chart default: staging serves fewer distinct functions than
  #     prod, and the floor scales with distinct functions served and cache size.
  #   * If it is at or above that, the request sits inside the dead band and
  #     staging pins at maxReplicas 5 regardless of load. Prod's measured floor is
  #     ~1260Mi, which would land in this case — that is exactly why prod sets
  #     1.8Gi (window 1750-1920Mi) rather than the default.
  #
  # Either way maxReplicas 5 is what bounds the reservation, so this is not
  # urgent — but bounding the wedge with a lower ceiling is TRIAGE, not a fix, and
  # should not be mistaken for one. Measure after the first deploy of 0.4.0: idle
  # mean and min at low CPU on pods >24h old (the chart's own note is emphatic
  # that shorter samples have been wrong three times), and if the floor is at or
  # above 1106Mi raise this request to floor/0.72 rather than leaving the HPA
  # pinned. See the resources note in charts/pawtograder/values.yaml.
  resources:
    requests: { cpu: "200m", memory: "1.5Gi" }
    limits:   { cpu: "2",    memory: "4Gi"   }
  envFromSecrets:
    - pawtograder-github-app
    - pawtograder-discord
    - pawtograder-canvas
    - pawtograder-llm
    - pawtograder-e2e
    # Edge functions read SENTRY_DSN for server-side error reporting
    # (_shared/HandlerUtils.ts). The secret also carries the frontend
    # NEXT_PUBLIC_BUGSINK_* keys, which are inert in the Deno runtime.
    - pawtograder-sentry
    # The same Secret GoTrue uses. Without it SMTP_HOST is simply unset in the functions
    # environment, which is why notification email never sent: the processor read "no SMTP host"
    # as "no work found" and deferred the queue indefinitely, with no error anywhere.
    # Note this Secret provides SMTP_PASS and SMTP_ADMIN_EMAIL; emailTransportConfig.ts accepts
    # those names as well as the older SMTP_PASSWORD / SMTP_FROM.
    - pawtograder-smtp
  email:
    # Explicit, so missing SMTP config is a reported failure rather than a silent deferral.
    enabled: "true"
  e2e:
    enabled: true
    mockGitHub: true
  # Staging is where the tier split is validated before prod (prod-charts) takes
  # it. See the workerTier block in charts/pawtograder/values.yaml for the
  # reasoning and the sizing; everything here is the chart default except being
  # on.
  #
  # What this changes: the four pg_cron-poked pgmq workers move off the 3-5
  # request-tier replicas onto 2 dedicated pods, and Kong routes their function
  # NAMES there. Nothing else moves, the policy stays per_request on both tiers,
  # and `enabled: false` puts it back in one helm upgrade.
  #
  # Worth knowing before the next staging deploy: release-images.yml's
  # deploy-staging runs `helm upgrade --wait`, which blocks on EVERY edge pod,
  # this tier's included. A worker tier that cannot become ready turns an
  # ordinary staging deploy red — the same trap the canary channel's `image.tag`
  # comment above warns about. It inherits the request tier's envFromSecrets
  # (all nine, including pawtograder-redis for the worker lease) and the same
  # readiness probe, so it comes up on the same terms the request tier does.
  workerTier:
    enabled: true

web:
  image:
    repository: ghcr.io/pawtograder/web
    # Tracks the latest image built from the `staging` branch. release-images.yml
    # reads the CURRENT cluster anon key at build time (so the build-time-inlined
    # NEXT_PUBLIC_SUPABASE_ANON_KEY can't drift and 401 browser login), and the
    # shared Redis-backed Next.js cache handler (cache-handler.cjs, so
    # revalidateTag() invalidates across all web replicas) is on staging. The
    # deploy-staging job pins the exact staging-<sha> at deploy time.
    tag: staging-latest
  envFromSecrets:
    - pawtograder-github-app
    - pawtograder-discord
    - pawtograder-canvas
    - pawtograder-llm
    - pawtograder-sentry
  # ----- Skinning demo: staging runs as "PawtograderNext" --------------------
  # Demonstrates the chart's deployment-skinning support. These plain env vars
  # are read server-side by the web app at request time (lib/branding.ts), so
  # the SAME ghcr.io/pawtograder/web image is re-branded with no rebuild. The
  # teal accent + distinct name make staging instantly recognizable vs prod.
  # Logos keep the bundled defaults here; point logoLight/logoDark at an
  # absolute https:// URL to swap artwork too.
  branding:
    name: "PawtograderNext"
    description: "PawtograderNext — the next generation of Pawtograder course operations"
    tagline: "The next generation of your pawsome course companion"
    colorPalette: "teal"
  # Multiple web replicas → leader flag stays off; if you need workflow
  # metrics on staging, drop web.replicas to 1 and flip this true (see
  # values-preview.yaml for the pattern).
  # workflowMetricsLeader: true

migrations:
  image:
    repository: ghcr.io/pawtograder/migrations
    # Tracks the latest image built from the `staging` branch (the deploy-staging
    # job pins the exact staging-<sha> at deploy time). Carries all migrations
    # through staging HEAD.
    tag: staging-latest
  # Never set resetOnDrift here — staging data is durable, drift means
  # something's wrong and we want the deploy to fail loudly.

# Supavisor (external transaction pooler) is unused — every in-cluster
# component connects to postgres:5432 directly (PGRST_DB_URI, edge-functions
# SUPABASE_DB_URL, etc.). Left enabled it just spams logs trying to reach its
# own session-pooler port (localhost:6432, connection refused). Disable to
# match values-preview.yaml.
supavisor:
  enabled: false

# ----- Shared in-cluster Redis (same instance previews use) -----------------
# Staging deliberately uses `shared`, NOT the chart's `internal` Redis: staging
# and PR previews share one cluster-wide Redis so Bottleneck rate-limiter state
# amortises across deploys. Bootstrap manifests live in
# charts/pawtograder/examples/shared-redis/; the OpenBao path
# apps/pawtograder/redis-shared is provisioned once per cluster via
# scripts/setup-openbao-redis-shared.sh and consumed by both namespaces'
# pawtograder-redis ExternalSecrets.
# (Production, with no external shared Redis, would set `provider: internal` to
# have the chart deploy its own — see redis.internal.* in values.yaml.)
redis:
  provider: shared

# ----- Object storage: external S3 (Ceph at s3.talos.ripley.cloud) ----------
storage:
  backend: s3
  s3:
    endpoint: https://s3.talos.ripley.cloud
    region: us-east-1
    bucket: pawtograder-staging-storage
    forcePathStyle: true

# ----- Studio: behind basic auth, accessible from the internet --------------
studio:
  ingressEnabled: true
  basicAuth:
    enabled: true
    realm: Pawtograder Staging Studio
    # Provision out-of-band:
    #   htpasswd -nbB admin <pass> | kubectl -n pawtograder-staging \
    #     create secret generic pawtograder-studio-auth --from-file=auth=/dev/stdin
    secretName: pawtograder-studio-auth
    # Dedicated TLS secret for the studio ingress so cert-manager issues it a
    # SEPARATE Certificate. The studio + app/api ingresses must not share one
    # TLS secret: cert-manager's ingress-shim builds one Certificate per secret
    # and can't merge hosts across ingresses, so a shared secret drops the
    # studio SAN. One secret per ingress keeps each Certificate clean.
    tlsSecretName: pawtograder-studio-tls

# ----- Nightly Postgres backups to S3 ---------------------------------------
backup:
  enabled: true
  schedule: "0 4 * * *"
  retentionDays: 14
  s3:
    endpoint: https://s3.talos.ripley.cloud
    region: us-east-1
    bucket: pawtograder-staging-backups

# ----- Observability: ServiceMonitors + Grafana dashboards ------------------
# Turns on the chart's monitoring CRs: ServiceMonitors for edge-functions,
# postgres-exporter, kong, auth, realtime, supavisor, and web, plus the Grafana
# dashboards (all enabled by default in chart values, incl. `rate-limiting`,
# which surfaces the GitHub-API Bottleneck limiter state read from the shared
# Redis via the `metrics` edge function, and `edge-soak`). The cluster's
# kube-prometheus-stack auto-discovers ServiceMonitors and its Grafana sidecar
# picks up the dashboard ConfigMaps (label grafana_dashboard=1, folder
# "Pawtograder").
#
# NOTE: enabling adds the postgres_exporter SIDECAR to the postgres pod, so the
# first `helm upgrade` that flips this RESTARTS postgres (a brief DB blip) —
# apply it when NOT mid-load-test. The realtime/supavisor/web ServiceMonitors
# need bearer tokens in the pawtograder-jwt secret (REALTIME_METRICS_BEARER,
# SUPAVISOR_METRICS_BEARER, METRICS_SCRAPE_TOKEN); without them those targets
# 401, but everything else works — incl. the edge /metrics endpoint, which is
# unauthed (no METRICS_TOKEN set) and is the rate-limiting metrics source.
monitoring:
  enabled: true
  # Match the ripley kube-prometheus-stack release name so its ruleSelector
  # picks up the PrometheusRule the chart ships (backup / ESO / cert alerts).
  # kps on ripley uses an empty ruleSelector today (matches all), but set the
  # label explicitly so it keeps working if that selector is ever tightened.
  prometheusRules:
    labels:
      release: kps
