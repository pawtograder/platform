# Maintenance server. Every application path returns HTTP 503 with the styled
# body and a Retry-After header, so clients (and crawlers) know it's temporary.
#
# /healthz returns 200 so the kubelet readiness/liveness probes pass and the
# Service actually gets endpoints — a probe against "/" would see 503, mark the
# pod NotReady, and the ingress backend would have nothing to route to.
#
# nginxinc/nginx-unprivileged listens on 8080 as uid 101 by default; this file
# replaces its /etc/nginx/conf.d/default.conf. In the chart, the templated
# ConfigMap (templates/maintenance.yaml) mounts over this baked copy.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Added even on the 503/error responses (the `always` flag is required).
    add_header Retry-After 120 always;

    # Probe target — must stay 200 so the pod is Ready and receives traffic.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The styled body, served internally as the 503 error document.
    error_page 503 /index.html;
    location = /index.html {
        internal;
    }

    # The background image the 503 body references must be served (200), not 503,
    # or the page renders with no artwork.
    location = /maintenance-mode.png {
        add_header Retry-After 120 always;
    }

    # Everything else: down for maintenance.
    location / {
        return 503;
    }
}
