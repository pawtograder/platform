# Default values for pawtograder.
#
# This chart deploys the entire pawtograder stack:
#   - Next.js web app
#   - PostgreSQL (supabase/postgres image — includes pgmq, pg_cron, pg_graphql)
#   - GoTrue (auth)
#   - PostgREST (REST API)
#   - Realtime (websockets, clustered)
#   - Storage API (+ imgproxy)
#   - postgres-meta + Studio
#   - Edge Functions runtime (Deno)
#   - Kong (API gateway)
#   - supavisor (connection pooler)
#
# Cluster-specific concerns (node selectors, ingress class, ESO secrets) are
# expected to come from a values overlay (e.g. values-staging.yaml in the
# deployer's own repo). Keep this file generic.

global:
  # Deployment environment: dev | preview | staging | production.
  # templates/validations.yaml keys guard rails off this — a `production`
  # render refuses e2e bypasses, secrets.create/autogenerate, seeding,
  # resetOnDrift, floating image tags, and unauthenticated Studio ingress;
  # staging additionally refuses secrets.create and resetOnDrift. Every
  # real overlay should declare this explicitly.
  environment: dev

  # Which branch / PR / CI run produced this deploy. Purely informational: the edge functions stamp
  # these onto every Sentry event (supabase/functions/_shared/SentryContext.ts) so a record in the
  # Bugsink "Dev" project can be attributed at a glance instead of by reading a hostname out of a URL
  # tag. Set per-deploy from CI (`--set global.deploy.branch=...`); every field is optional and an
  # empty one is simply omitted, so local `helm template` runs and hand-rolled installs need none of
  # it.
  deploy:
    branch: ""
    pr: ""
    runId: ""
    runAttempt: ""
    commit: ""

  # Public hostname users hit. Used to construct site URLs, OAuth redirects,
  # and the JWT issuer claim. MUST match an ingress entry below.
  hostname: pawtograder.example.com

  # If true, the API gateway is exposed on a separate hostname (api.<hostname>).
  # If false, both web and API share `hostname` with path-based routing through
  # the web app. Default: true (separate origins, simpler CORS).
  apiOnSeparateHost: true

  # Image registry override applied to every component (unless component sets
  # its own). Useful for air-gapped clusters mirroring upstream images.
  imageRegistry: ""

  # Pod placement applied to every component as defaults. Per-component
  # overrides in `<component>.nodeSelector / affinity / tolerations` win.
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Default priorityClassName for every pod; per-component
  # `<component>.priorityClassName` wins. The chart does not create
  # PriorityClass resources — reference one your cluster defines.
  priorityClassName: ""

  # Baseline pod/container security contexts applied to every workload.
  # A component that defines its own `podSecurityContext` /
  # `containerSecurityContext` key overrides the global wholesale (set {}
  # to opt out — see postgres, whose entrypoint must chown + su).
  # Deliberately conservative: no runAsNonRoot/readOnlyRootFilesystem at
  # the global level because the upstream images differ in what user they
  # run as; tighten per component in your overlay where you've verified.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  # Pull secrets attached to every pod's ServiceAccount.
  imagePullSecrets: []

  # Common labels stamped onto every resource.
  commonLabels: {}

# -----------------------------------------------------------------------------
# PodDisruptionBudgets — one per multi-replica component (minAvailable: 1) so
# drains / autoscaler events can't evict an entire tier at once. Single-replica
# components are skipped (a PDB there blocks drains outright). Postgres gets
# its own opt-in below (postgres.pdb) for the same reason.
# -----------------------------------------------------------------------------
podDisruptionBudget:
  enabled: true

# -----------------------------------------------------------------------------
# NetworkPolicies. When enabled:
#   - default-deny ingress to every pod in the release
#   - allow all traffic between pods of this release (incl. hook Jobs)
#   - allow the ingress-controller namespace to reach web / kong / studio
#   - allow the monitoring namespace to scrape any pod (when monitoring.enabled)
# Egress is left unrestricted (edge functions + web talk to GitHub, Discord,
# SMTP, LLM APIs, …). Requires a CNI that enforces NetworkPolicy (cilium,
# calico, …) — with one that doesn't, the objects are inert.
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: false
  # Selects the namespace your ingress controller runs in.
  ingressControllerNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  # Selects the namespace Prometheus scrapes from.
  monitoringNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring
  # Extra NetworkPolicyIngressRule entries appended to a release-wide allow
  # policy (e.g. another namespace that consumes the API in-cluster).
  extraIngressRules: []

# -----------------------------------------------------------------------------
# Deployment channels (A/B by course)
# -----------------------------------------------------------------------------
# Extra, concurrent web + edge-functions deployments running DIFFERENT image
# tags against the SAME data plane (Postgres/auth/storage) as the stable
# release. Each channel is served on its own single-label host
# (<name>.<global.hostname>, a fixed pattern — the web middleware computes the
# same host to drive its redirect, so there's no per-channel host override); the
# app redirects each course to its channel's host based on the
# classes.deployment_channel column, so one user can use stable + canary courses
# in the same session. Kong routes a channel host's /functions/v1 to that
# channel's functions; everything else is shared. Default empty = stable only,
# no extra objects rendered.
#
# Channel image build args matter: the web image for a channel MUST be built with
# NEXT_PUBLIC_PAWTOGRADER_CHANNEL=<name>, NEXT_PUBLIC_CHANNEL_HOST_SUFFIX set to
# the zone, and its own channel host as NEXT_PUBLIC_PAWTOGRADER_WEB_URL (so
# password-reset / signup-confirm / OAuth callbacks land on the channel host, not
# stable), with the shared NEXT_PUBLIC_SUPABASE_URL — all NEXT_PUBLIC_* bake at
# build time (see .github/workflows/release-images.yml `channel` input). Channel
# code must be schema-compatible with the shared DB (expand/contract migrations
# only). A web/edgeFunctions block without its own image.tag, and an edgeFunctions
# block without a web block, both fail the render (see *-channels.yaml).
channels: []
#  - name: team7
#    # tls:
#    #   secretName: team7-tls   # optional override for a dedicated per-channel
#    #                           # cert; default is the *.<zone> wildcard below
#    web:
#      image:
#        tag: "team7-<sha>"      # REQUIRED; repository/pullPolicy default from web.image
#      replicas: 1               # 0 idles the channel (kept distinct from absent)
#    edgeFunctions:
#      image:
#        tag: "team7-<sha>"      # REQUIRED; repository/pullPolicy default from edgeFunctions.image
#      replicas: 1

# Reflected *.<zone> wildcard TLS secret used by every channel Ingress (e.g.
# "staging-wildcard-tls" for *.staging.pawtograder.net). REQUIRED when channels
# with `web` are set and ingress.tls.enabled. One wildcard avoids per-channel
# ACME issuance; provision it once (cert-manager DNS-01 + reflector) like the
# *.preview.pawtograder.net cert.
channelWildcardTlsSecret: ""

# -----------------------------------------------------------------------------
# Secrets
# -----------------------------------------------------------------------------
# Two ways to provide secrets:
#   1. Set `secrets.create=true` and provide values inline (dev/test only).
#   2. Set `secrets.create=false` and reference pre-existing Secrets created by
#      ESO / sealed-secrets / kubectl. The chart will mount them by name.
#
# Required secret material:
#   - postgres password (superuser + pawtograder role)
#   - JWT secret (HS256, 32+ bytes) — used by GoTrue, PostgREST, Realtime, Kong
#   - service_role and anon JWTs (derived from JWT secret)
#   - storage-api S3 credentials (if useS3=true)
#   - SMTP credentials (if SMTP enabled)
#   - GitHub App credentials, Discord, Canvas, LLM keys, etc. — all consumed
#     by the web pod and edge functions, never by Supabase services themselves.
secrets:
  # If true, render Secrets from the values below. NEVER use in production.
  create: false

  # If true, run a pre-install Helm hook Job that generates fresh secret
  # material (JWT keypair, postgres passwords, e2e/edge tokens) and creates
  # the k8s Secrets in-cluster if they don't already exist. Idempotent —
  # subsequent helm upgrades skip generation when Secrets exist. Designed
  # for ephemeral previews where you don't want to plumb OpenBao / ESO.
  # The Job uses node:22-alpine + the cluster's serviceaccount token; no
  # external dependencies. Studio basic-auth is NOT autogenerated; disable
  # studio.basicAuth.enabled in preview values.
  autogenerate: false

  # Names of pre-existing Secrets the chart mounts. If create=true, these
  # names are used for the rendered Secrets too.
  names:
    postgres: pawtograder-postgres
    jwt: pawtograder-jwt
    smtp: pawtograder-smtp
    s3: pawtograder-s3
    web: pawtograder-web
    edgeFunctions: pawtograder-edge-functions

  # External Secrets Operator (ESO) wiring for the web and edge-functions
  # integration Secrets. When enabled, the chart renders ExternalSecrets that
  # pull one Bao path per integration "bundle" and dump each verbatim into
  # pawtograder-web / pawtograder-edge-functions via `dataFrom: extract`.
  # Keys at each Bao path are stored under their literal env-var names
  # (GITHUB_APP_ID, DISCORD_BOT_TOKEN, LTI_KEY_ENCRYPTION_SECRET, …) so adding
  # a new env var to a bundle requires no chart change — just rerun the script.
  #
  # Provision the upstream Bao paths with
  #   scripts/setup-openbao-edge-functions.sh --bundle <name> ...
  # (see `--list` for all known bundles). Then enable only the bundles
  # you've populated — a missing Bao path is a hard ESO sync error.
  #
  # The stub-generation path in secrets-bootstrap-script.yaml is
  # automatically suppressed when this is enabled so ESO is the
  # unambiguous owner.
  externalSecret:
    enabled: false
    env: ""                       # required when enabled: preview|staging|prod
    # Backward-compatible alias for edgeFunctionsBundles. Prefer setting
    # edgeFunctionsBundles explicitly in new overlays.
    bundles: []
    webBundles: []                # usually: web, llm, discord
                                  #   `discord` belongs here as well as in
                                  #   edgeFunctionsBundles: DISCORD_APPLICATION_ID
                                  #   and DISCORD_BOT_TOKEN are read by the Next.js
                                  #   bot-install routes (app/api/discord/install
                                  #   and .../install/callback), not only by the
                                  #   worker. Omitting it makes the install button
                                  #   answer 500.
    edgeFunctionsBundles: []      # subset of: github-app, aws-chime, discord,
                                  #   canvas, sis, smtp, mcp, redis, sentry, misc
    storeName: openbao            # ClusterSecretStore name
    storeKind: ClusterSecretStore # or SecretStore for namespace-scoped
    pathPrefix: apps/pawtograder  # full Bao path = <pathPrefix>/<bundle>-<env>
    refreshInterval: 1h

  # Inline values used only when create=true.
  values:
    postgres:
      password: "" # superuser
      pawtograderPassword: "" # application role
      replicationPassword: ""
    jwt:
      # Generated by `npx tsx scripts/GenerateJwtKeys.ts --env`. Pawtograder
      # uses asymmetric ES256 for user session JWTs and HS256 for the long-
      # lived API keys; the JWK Set carries both kinds, distinguished by kid.
      secret: "" # HS256 secret (used to sign ANON/SERVICE only)
      anonKey: "" # HS256 JWT, role=anon
      serviceRoleKey: "" # HS256 JWT, role=service_role
      privateJwks: "" # JSON array of private JWKs (GoTrue JWT_KEYS)
      publicJwks: "" # JSON object {"keys":[…]} for verifiers
      realtimeJwks: "" # EC-only JWK Set (Joken can't take oct JWK maps)
      # The single EC private JWK (not a set) that MCPAuth.ts signs per-user RLS
      # JWTs with for MCP and the CLI. Must be the same EC entry that appears in
      # privateJwks, since PostgREST verifies against publicJwks. Optional: leave
      # empty and MCP/CLI are unavailable; everything else works.
      signingJwk: ""
      realtimeEncKey: "" # AES-128 (16 bytes exactly) for tenant secrets
      pgMetaCryptoKey: "" # AES-256 base64; pg-meta + Studio share this
      pgsodiumRootKey: "" # 32-byte hex; postgres mounts as file
      # Supavisor secrets — only required when supavisor.enabled=true (the
      # chart default). Each has its own length/role requirement; do NOT
      # reuse the same value across them.
      supavisorSecretKeyBase: ""    # ≥ 64 chars (Phoenix endpoint key)
      supavisorVaultEncKey: ""      # exactly 32 bytes (Vault encryption)
      supavisorApiJwtSecret: ""     # tenant management API JWT signer
      supavisorMetricsJwtSecret: "" # /metrics scrape JWT signer
      # Pre-minted scrape bearer tokens (required when monitoring.enabled=true).
      # Generated automatically by scripts/GenerateJwtKeys.ts.
      realtimeMetricsBearer: ""     # HS256 JWT signed with JWT_SECRET
      supavisorMetricsBearer: ""    # HS256 JWT signed with SUPAVISOR_METRICS_JWT_SECRET
      metricsScrapeToken: ""        # opaque random; gates /api/metrics on web
    e2e:
      # Used only when edgeFunctions.e2e.enabled=true
      endToEndSecret: ""
      edgeFunctionSecret: ""
      # DB-trigger -> web cache-invalidation secret. Web envFroms pawtograder-e2e
      # and the migrations Job seeds the vault cache_invalidation_secret from it,
      # so both sides match. Empty -> invalidation degrades gracefully (off).
      cacheInvalidationSecret: ""
    smtp:
      host: ""
      port: "587"
      user: ""
      pass: ""
      adminEmail: ""
      senderName: "Pawtograder"
    s3:
      accessKey: ""
      secretKey: ""

# -----------------------------------------------------------------------------
# PostgreSQL (single primary with optional manual-failover streaming standby)
# -----------------------------------------------------------------------------
postgres:
  enabled: true
  image:
    repository: supabase/postgres
    tag: "17.4.1.075"
    pullPolicy: IfNotPresent

  # `pawtograder` database name and application role.
  database: postgres
  appRole: pawtograder

  # Give postgres time to checkpoint + flush WAL on shutdown instead of the
  # 30s default → SIGKILL mid-checkpoint and a long recovery replay on the
  # next boot.
  terminationGracePeriodSeconds: 600

  # Voluntary-eviction protection for the single postgres pod. OFF by
  # default because minAvailable:1 over 1 replica makes `kubectl drain`
  # hang until you delete the pod manually — enable it in production where
  # that is exactly the speed bump you want before a DB outage.
  pdb:
    enabled: false

  # The supabase/postgres entrypoint starts as root, chowns PGDATA, and
  # su's to postgres — it needs the default capability set, so the global
  # drop-ALL containerSecurityContext is opted out here. fsGroup keeps the
  # PVC group-writable for the supabase/postgres group (gid 102). (An overlay
  # that runs the pod as uid 101 — e.g. for root-squashed NFS — should set
  # runAsUser/runAsGroup here too; see examples/values-prod.yaml.)
  podSecurityContext:
    fsGroup: 102
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext: {}

  # Resources sized for ~600 concurrent realtime users on a single node.
  # Tune in overlay.
  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

  service:
    port: 5432

  persistence:
    enabled: true
    storageClass: "" # e.g. "local-path" or "ceph-rbd"
    size: 50Gi
    accessMode: ReadWriteOnce
    # Annotations stamped on the PVC (provisioner reads them at create time).
    # On NetApp Trident + root-squashed NFS, set the volume world-writable so a
    # non-root (uid 101) postgres can create PGDATA on the fresh mount:
    #   annotations:
    #     trident.netapp.io/unixPermissions: "0777"
    annotations: {}

  # postgresql.conf overrides — bumped for Realtime fan-out + supavisor.
  config:
    max_connections: "400"
    shared_buffers: "1GB"
    effective_cache_size: "3GB"
    max_wal_senders: "10"
    max_replication_slots: "10"
    wal_level: "logical"
    work_mem: "16MB"
    maintenance_work_mem: "256MB"
    log_min_duration_statement: "1000"
    log_lock_waits: "on"

  # shared_preload_libraries — pgsodium and supabase_vault MUST both be
  # preloaded. They're separate .so libraries with their own _PG_init and
  # their own server-secret-key state; preload triggers _PG_init which
  # reads `pgsodium.getkey_script` / `vault.getkey_script` respectively.
  # Without supabase_vault preloaded, vault.create_secret fails with
  # "pgsodium_derive: no server secret key defined" even though
  # pgsodium.derive_key() works (different library, different state).
  sharedPreloadLibraries:
    - pg_stat_statements
    - pgaudit
    - pg_cron
    - pg_net
    - auto_explain
    - pg_tle
    - supautils
    - pgsodium
    - supabase_vault

  # ---------------------------------------------------------------------------
  # WAL-G: continuous WAL archiving to S3 (→ point-in-time recovery) and the
  # base backups PITR + streaming-replica bootstrap build on. Off by default;
  # single-primary + nightly pg_dump (backup.yaml) is the v0.1 floor. Turn on
  # in a durable overlay to get PITR (recovery to any second within retention),
  # not just last-night's dump. See docs/operations/point-in-time-recovery.md.
  #
  # The supabase/postgres image ships the `wal-g` binary (its cloud-only
  # `admin-mgr` wrapper is absent), so the chart calls wal-g directly:
  #   archive_command = wal-g wal-push %p     (per-segment, from postgres)
  #   base backup     = wal-g backup-push     (interval, from the sidecar)
  #   restore         = wal-g backup-fetch / wal-fetch  (runbook / replica)
  # Config is passed to wal-g via WALG_*/AWS_* env, sourced from the S3 secret
  # (secrets.names.s3) plus the values below.
  walg:
    enabled: false
    # WALG_S3_PREFIX — where WAL + base backups live. Keep this DISTINCT from
    # the nightly-dump bucket/prefix (backup.s3) so the two schemes never mix.
    s3Prefix: "" # e.g. s3://pawtograder-staging-backups/walg
    # S3 endpoint/region/path-style for the object store (MinIO/Ceph/AWS).
    # Reuses the AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in secrets.names.s3.
    s3Endpoint: "" # e.g. https://s3.talos.ripley.cloud (blank = real AWS)
    region: "us-east-1"
    forcePathStyle: true
    # brotli|lz4|lzma|zstd — zstd is a good ratio/speed default.
    compressionMethod: "zstd"
    # archive_command failure = postgres retries and WAL piles up in pg_wal
    # (disk-fill risk), so archiving must keep up. archive_timeout forces a
    # segment switch so idle periods still bound RPO.
    archiveTimeout: "60s"
    # Base backups: the sidecar loop cadence and how many full backups to keep.
    # WAL older than the oldest retained base backup is pruned with it. Sizing:
    # retention window ≈ baseBackupIntervalHours × keepBackups.
    baseBackup:
      enabled: true
      intervalHours: 24
      keepBackups: 8
      # Wait this long after the sidecar starts before the FIRST base backup,
      # so postgres + archiving are healthy first.
      initialDelaySeconds: 120
      resources:
        requests: { cpu: "50m",  memory: "128Mi" }
        limits:   { cpu: "1",    memory: "512Mi" }

  # ---------------------------------------------------------------------------
  # Streaming standby replica. A separate StatefulSet that bootstraps from the
  # primary via pg_basebackup and streams WAL (hot standby, read-only), with
  # `wal-g wal-fetch` as the archive fallback if it falls behind the primary's
  # retained pg_wal. Off by default. Gives read-scaling + a warm failover
  # target; failover is MANUAL (documented promote runbook), not automatic.
  # Requires postgres.walg.enabled (the replica needs the archive fallback and
  # shares the WAL-G config). See docs/operations/point-in-time-recovery.md.
  replica:
    enabled: false
    replicas: 1
    # Replica gets its own storage (own PVC per pod). local-path is fine here:
    # a streaming replica on another node with its own volume is the point.
    persistence:
      storageClass: ""
      size: 50Gi
      accessMode: ReadWriteOnce
      # Same as postgres.persistence.annotations (e.g. Trident unixPermissions).
      annotations: {}
    resources:
      requests: { cpu: "500m", memory: "2Gi" }
      limits:   { cpu: "2",    memory: "8Gi" }
    # Soft anti-affinity to keep the standby off the primary's node (a replica
    # sharing the primary's node defeats the durability purpose).
    spreadAcrossNodes: true

  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Maintenance page — a tiny static nginx Deployment + Service that returns
# HTTP 503 + Retry-After with a styled "we'll be right back" body (matching the
# app's in-app error boundary). Off by default. During a planned-maintenance
# window the web-host ingress backend is repointed to the `pawtograder-maintenance`
# Service, then back (see docs/operations/planned-maintenance.md). Enabling this
# only CREATES the Service; the ingress patch is what reroutes. It reroutes the
# WEB host only (user-facing "down" banner), so it is not itself a write fence —
# scaling the writer tiers to 0 remains the real fence.
# -----------------------------------------------------------------------------
maintenance:
  enabled: false
  # Copy shown on the page. eta is optional (omitted from the page when empty).
  title: "We'll be right back"
  message: "Pawtograder is down for a short scheduled maintenance window. Your work is safe — the pack is tidying up and we'll be back shortly. This page refreshes on its own."
  eta: "" # e.g. "6:15pm ET" — rendered only when set
  # Retry-After header (seconds) AND the page's auto-refresh interval.
  retryAfterSeconds: 120
  # 2 (+ the template's node topology spread): the page fronts the web host during
  # a node drain, so a single replica on the drained node would leave the ingress
  # serving 5xx until a replacement schedules.
  replicas: 2
  image:
    # Built by .github/workflows/release-images.yml (build-maintenance), mirrored
    # into Harbor for Khoury prod. tag "" => chart appVersion (same convention as
    # the migrations image).
    repository: dev-harbor.khoury.northeastern.edu/pawtograder/maintenance
    tag: "" # default: chart appVersion
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests: { cpu: "10m", memory: "16Mi" }
    limits: { cpu: "100m", memory: "64Mi" }
  # Override the whole page body (raw HTML, rendered through `tpl`). Empty =>
  # the chart-bundled maintenance/index.html.
  html: ""

# -----------------------------------------------------------------------------
# Migrations job — runs `supabase db push`-equivalent against postgres.
# Implemented as a pre-install/pre-upgrade Helm hook.
# -----------------------------------------------------------------------------
migrations:
  enabled: true
  image:
    # An image containing /migrations + a tiny entrypoint that applies them
    # using psql. The pawtograder build pipeline produces this; until it does,
    # set this to a custom image you build from supabase/migrations/.
    repository: ghcr.io/pawtograder/migrations
    tag: "" # default: chart appVersion
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "1Gi" }
  # Hook weight controls ordering relative to other pre-install hooks. Lower
  # numbers run earlier; postgres readiness is verified by the script itself.
  hookWeight: "5"
  # On every deploy the migrator computes SHA-256 of each on-disk migration
  # and compares to the hash recorded when it was applied. A mismatch means
  # somebody edited an already-applied migration; downstream runs would
  # keep skipping the (now-edited) file and the database drifts forever
  # from the source.
  #
  # - false (default, REQUIRED for staging/prod): mismatch is a hard error. The
  #   operator must rename the migration to a fresh timestamp, accept the
  #   drift manually, or restore the original file. Data is preserved.
  # - true (dev / preview ONLY): the migrator drops schema public, truncates
  #   the migration history, clears auth.users + vault.secrets, and replays
  #   every migration from scratch. DESTROYS ALL DATA. Doubly guarded: the
  #   render is refused outright on staging/production (templates/validations.yaml),
  #   and migrate.sh independently refuses unless MIGRATIONS_ENVIRONMENT is
  #   dev|preview, so the flag can never wipe a durable tier even if it leaks.
  resetOnDrift: false

# -----------------------------------------------------------------------------
# Seed: load supabase/seed.sql into the database. Creates a "Demo Class"
# (id=1) along with canned auth.users, assignments, rubrics, and a help
# queue. Runs as a post-install,post-upgrade Helm hook using the same
# image as `migrations`. The seed script skips itself if classes.id=1
# already exists, so re-runs are no-ops.
#
# Off by default. Enable for ephemeral previews / load-test environments;
# never enable on production.
# -----------------------------------------------------------------------------
seed:
  enabled: false
  image:
    # Built from charts/pawtograder/images/seeder/Dockerfile. Node 22 +
    # the TS scripts/ + node_modules; runs scripts/SeedDB.ts under a
    # wrapper that waits for postgres + supabase services. Separate
    # from the migrations image (which is psql-only ~50MB) because
    # this one's ~600MB and we don't want every helm upgrade pulling
    # node_modules.
    repository: ghcr.io/pawtograder/seeder
    tag: "" # default: chart appVersion (matches web/edge/migrations tags)
    pullPolicy: IfNotPresent
  resources:
    # tsx + 50-student faker seed peaks around 600 MiB. Bump if you go
    # to "medium" or larger templates.
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "1Gi" }
  # Which scripts/SeedDB.ts template to run. See that file's TEMPLATES
  # constant. Common choices: "micro" (30/1/1/2), "small" (50/5/2/20).
  template: small
  # Fixed e-mails for the first user of each role. When set, the seeder
  # weaves these accounts INTO the simulation — they are one of the
  # seeded users for each role with real submissions / grading
  # assignments / etc. Unset roles fall back to the seeder's
  # faker-generated emails.
  #
  # Pair with seed.externalSecret.enabled to also rewrite their
  # password to the shared-preview value, so reviewers can log in with
  # the credentials surfaced in the PR comment.
  fixedUsers:
    instructor: ""
    grader: ""
    student: ""
  # When enabled, the chart syncs kv/apps/pawtograder/preview-shared from
  # OpenBao into a pawtograder-preview-shared Secret. The seed job
  # consumes the password from that Secret as TEST_PASSWORD, which
  # DatabaseSeedingUtils uses when creating auth users — so the entire
  # seeded class shares the documented preview password.
  #
  # Provision the upstream Bao path once per cluster:
  #   scripts/setup-openbao-preview-shared.sh
  #
  # Without this, the seeder falls back to TEST_PASSWORD's default
  # ("change-it") which is fine for local dev but ugly for previews.
  externalSecret:
    enabled: false
    storeName: openbao
    storeKind: ClusterSecretStore
    path: apps/pawtograder/preview-shared
    refreshInterval: 1h

# -----------------------------------------------------------------------------
# Supavisor (Postgres connection pooler — replaces pgbouncer)
# -----------------------------------------------------------------------------
supavisor:
  enabled: true
  replicas: 2
  image:
    repository: supabase/supavisor
    tag: "2.7.4" # stock supabase docker-compose pin
    pullPolicy: IfNotPresent
  poolSize: 25 # per tenant
  maxClientConn: 1000
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }
  service:
    port: 6543 # transaction-mode pool
  terminationGracePeriodSeconds: 45
  spreadAcrossNodes: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# GoTrue (auth)
# -----------------------------------------------------------------------------
auth:
  enabled: true
  replicas: 2
  image:
    repository: supabase/gotrue
    tag: "v2.186.0" # stock supabase docker-compose pin
    pullPolicy: IfNotPresent
  jwtExpiry: 3600
  disableSignup: false
  enableEmailSignup: true
  enableEmailAutoconfirm: true
  enableAnonymousUsers: false
  # The web app links GitHub/Discord identities via supabase.auth.linkIdentity,
  # which needs GoTrue manual linking on (else `manual_linking_disabled`).
  manualLinkingEnabled: true

  # custom_access_token_hook — pawtograder requires this for role/class claims.
  customAccessTokenHook:
    enabled: true
    uri: pg-functions://postgres/public/custom_access_token_hook

  # External OAuth providers. Credentials live in the `web` secret (the chart
  # passes them through to GoTrue via env). Set enabled=true per provider.
  external:
    # Provider OAuth client id/secret are read from the `web` Secret as
    # <PROVIDER>_OAUTH_CLIENT_ID / <PROVIDER>_OAUTH_CLIENT_SECRET.
    github:
      enabled: false
      redirectUri: "" # default: https://<hostname>/auth/v1/callback
    azure:
      enabled: false
    discord:
      enabled: false
      redirectUri: "" # default: https://<hostname>/auth/v1/callback

  # Generic external OAuth providers — for any GoTrue provider beyond the three
  # first-class ones above (google, apple, gitlab, keycloak/OIDC, …). Renders the
  # standard GOTRUE_EXTERNAL_<NAME>_* env. Use this to back the sign-in buttons
  # configured in web.branding.ssoProviders. Do NOT also configure github/azure/
  # discord here (use their dedicated blocks above to avoid duplicate env).
  #   name            REQUIRED. GoTrue provider name (lowercased), e.g. "google".
  #                   Uppercased for the env var (GOTRUE_EXTERNAL_GOOGLE_*).
  #   enabled         Set true to render the provider's env.
  #   redirectUri     Optional. Default: https://api.<hostname>/auth/v1/callback.
  #   clientIdKey     Optional web-Secret key for the client id.
  #                   Default: <NAME>_OAUTH_CLIENT_ID (e.g. GOOGLE_OAUTH_CLIENT_ID).
  #   clientSecretKey Optional web-Secret key for the client secret.
  #                   Default: <NAME>_OAUTH_CLIENT_SECRET.
  #   url             Optional issuer URL (required by some providers, e.g.
  #                   keycloak): sets GOTRUE_EXTERNAL_<NAME>_URL.
  externalProviders: []
  #  - name: google
  #    enabled: true
  #  - name: keycloak
  #    enabled: true
  #    url: https://sso.example.edu/realms/main

  smtp:
    enabled: false
    # adminEmail (the From: address) is read from the smtp Secret key
    # SMTP_ADMIN_EMAIL, alongside SMTP_HOST/PORT/USER/PASS — it lives with
    # the other SMTP creds rather than baked into values.
    senderName: "Pawtograder"
    # Optional in-cluster socat relay for clusters whose upstream blocks
    # outbound SMTP submission ports (see templates/smtp-relay.yaml). When
    # enabled, point GOTRUE's SMTP_HOST at the real provider hostname and
    # CoreDNS-rewrite that hostname → the pawtograder-smtp-relay Service so
    # STARTTLS cert verification still passes end-to-end.
    relay:
      enabled: false
      image: "alpine/socat:1.8.0.3"
      port: 587
      # host:port of the egress endpoint that tunnels out to the SMTP
      # provider (e.g. a campus LXC listener). Required when enabled.
      downstream: ""
      # Optional TCP MSS clamp on the downstream connection. Set when the
      # pod→downstream path crosses an overlay/encap hop with a lower MTU and
      # no working PMTUD (else the STARTTLS cert exchange blackholes). ~1300
      # is a safe value; leave unset to disable.
      mss: ""
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits: { memory: "64Mi" }

  # Custom GoTrue transactional email templates (invite / confirmation /
  # recovery / magic-link / email-change). GoTrue's mailer fetches templates
  # over http(s) only (no file://), so when enabled the chart runs a tiny
  # `mail-templates` sidecar in the auth pod that serves the bundled HTML on
  # 127.0.0.1; gotrue points GOTRUE_MAILER_TEMPLATES_* at it. On any fetch
  # error gotrue falls back to its built-in defaults.
  mailer:
    templates:
      enabled: false
      server:
        image:
          repository: busybox
          tag: "1.37"
          pullPolicy: IfNotPresent
        # Localhost port the sidecar serves on (must be >1024 for non-root).
        port: 8081
        resources:
          requests: { cpu: "5m", memory: "8Mi" }
          limits: { memory: "32Mi" }
      # Per-template raw-HTML overrides. Empty → use the chart-bundled file
      # under email-templates/. Bodies are Go html/template with GoTrue vars.
      files:
        invite: ""
        confirmation: ""
        recovery: ""
        magicLink: ""
        emailChange: ""
      # Optional custom subject lines (plain strings). Empty → GoTrue defaults.
      subjects:
        invite: ""
        confirmation: ""
        recovery: ""
        magicLink: ""
        emailChange: ""

  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  service:
    port: 9999
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  spreadAcrossNodes: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# PostgREST
# -----------------------------------------------------------------------------
rest:
  enabled: true
  replicas: 2
  # Connection-pool sizing. dbPool=40 paired with a 30s acquisition
  # timeout was chosen so the chart's postgres.config.max_connections
  # (400 by default; see the postgres block) isn't blown out even at
  # 3 replicas: 3 × 40 = 120, well under 400. Bump in lockstep with
  # postgres.config.max_connections if you scale rest replicas past
  # ~9.
  dbPool: 40
  dbPoolAcquisitionTimeout: 30
  image:
    repository: postgrest/postgrest
    tag: "v14.8" # stock supabase docker-compose pin — major bump from v12
    pullPolicy: IfNotPresent
  schemas: "public,graphql_public,pgmq_public"
  extraSearchPath: "public,extensions"
  maxRows: 1000
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }
  service:
    port: 3000
  terminationGracePeriodSeconds: 30
  # PostgREST's image is a bare static binary (no /bin/sh) — keep 0.
  preStopSleepSeconds: 0
  spreadAcrossNodes: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Realtime (clustered for ~600 concurrent WS)
# -----------------------------------------------------------------------------
realtime:
  enabled: true
  replicas: 3
  image:
    repository: supabase/realtime
    tag: "v2.76.5" # stock supabase docker-compose pin — fixes partition / metrics auth
    pullPolicy: IfNotPresent
  # The supabase/realtime entrypoint starts as root and `sudo -u nobody`s to
  # run migrations + the BEAM — so it needs the default capability set and
  # privilege escalation. Under the global drop-ALL / allowPrivilegeEscalation:
  # false context, sudo fails ("setresuid: Operation not permitted") and the
  # pod CrashLoopBackOffs, so opt out here — same as postgres above.
  containerSecurityContext: {}
  # BEAM clustering — pods discover peers via a headless Service.
  cluster:
    strategy: "Elixir.Cluster.Strategy.Kubernetes.DNS"
    nodeBasename: "realtime"
  # Tune timeouts/queue sizes for high WS counts. See realtime docs for full
  # list of env knobs (RUN_JANITOR, MAX_HEADER_LENGTH, etc.).
  maxHeaderLength: 4096
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2", memory: "2Gi" }
  service:
    port: 4000
  # WebSocket draining: give the BEAM time to close channels cleanly on
  # SIGTERM instead of the 30s default cutting clients off mid-frame.
  terminationGracePeriodSeconds: 60
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # PodAntiAffinity to spread realtime pods across nodes when more than one
  # node carries the deployment tier. Has no effect on a single-node tier.
  spreadAcrossNodes: true

# -----------------------------------------------------------------------------
# Storage API (+ imgproxy)
# -----------------------------------------------------------------------------
storage:
  enabled: true
  replicas: 2
  image:
    repository: supabase/storage-api
    tag: "v1.48.26" # stock supabase docker-compose pin
    pullPolicy: IfNotPresent

  # Backend selection. S3 is strongly recommended for k8s — avoids RWX PVCs.
  backend: s3 # one of: s3, file
  fileSizeLimit: "52428800" # 50 MiB, matches config.toml

  s3:
    # Endpoint URL of the S3-compatible store (MinIO, AWS S3, R2…).
    endpoint: ""
    region: "us-east-1"
    bucket: "pawtograder"
    forcePathStyle: true # required for MinIO

  # When backend=file, mount this PVC. (Discouraged unless you know why.)
  persistence:
    enabled: false
    storageClass: ""
    size: 20Gi
    accessMode: ReadWriteMany

  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }
  service:
    port: 5000
  terminationGracePeriodSeconds: 45
  preStopSleepSeconds: 5
  spreadAcrossNodes: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

imgproxy:
  enabled: true
  replicas: 1
  image:
    repository: darthsim/imgproxy
    tag: "v3.27.2"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "1", memory: "512Mi" }
  service:
    port: 5001

# -----------------------------------------------------------------------------
# postgres-meta + Studio
# -----------------------------------------------------------------------------
meta:
  enabled: true
  image:
    repository: supabase/postgres-meta
    tag: "v0.96.3"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }
  service:
    port: 8080

studio:
  enabled: true
  image:
    repository: supabase/studio
    tag: "2026.04.27-sha-5f60601"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }
  service:
    port: 3000
  # Studio is admin-only. Default-disabled in ingress; enable + lock down
  # in your ingress overlay (auth, IP allowlist, mTLS, etc.).
  ingressEnabled: false
  # Basic-auth gate for the Studio host. Studio itself has no auth, so
  # exposing the ingress without this means anyone with the URL gets full
  # database control. Secret must contain an `auth` key with htpasswd-format
  # lines (one user:hash per line). Generate via `htpasswd -nbB <user> <pw>`.
  basicAuth:
    enabled: false
    secretName: pawtograder-studio-auth
    realm: "Pawtograder Studio"
    tlsSecretName: ""   # default: same as ingress.tls.secretName
  # The chart refuses to render studio.ingressEnabled=true without basicAuth
  # unless you flip this — an explicit "I have another auth layer (VPN,
  # oauth2-proxy, IP allowlist) in front" acknowledgement.
  allowUnauthenticatedIngress: false

# -----------------------------------------------------------------------------
# Edge Functions (Deno)
# -----------------------------------------------------------------------------
# Redis (Bottleneck rate-limiter state, webhook tracking, sync cache)
# -----------------------------------------------------------------------------
# Three modes (no per-release Redis deployment — same shape as MinIO):
#
#   external (default)
#     The chart renders nothing. Operator provisions
#     UPSTASH_REDIS_REST_URL + UPSTASH_REDIS_REST_TOKEN out-of-band via
#     pawtograder-edge-functions (or wherever the edge runtime gets its
#     envFrom secrets). Works with managed Upstash, Cloudflare R2,
#     anything that speaks the Upstash REST protocol.
#
#   shared
#     The chart renders an ExternalSecret that ESO syncs into a
#     pawtograder-redis Secret from OpenBao at
#     `kv/apps/pawtograder/redis-shared` (key: REDIS_URL). The edge
#     runtime additionally mounts pawtograder-redis via envFrom and the
#     Redis.ts factory picks the ioredis branch when REDIS_URL is set.
#
#     The shared Redis itself lives in a separate cluster-scoped
#     namespace (single instance, single password — see
#     charts/pawtograder/examples/shared-redis/ for the bootstrap
#     manifests). All previews point at the same Redis, isolated by
#     Bottleneck's key namespacing (limiter ids include the class +
#     env so collisions across previews are not a concern).
#
#   disabled
#     Chart renders nothing. Edge functions check for the env vars
#     before use and degrade gracefully (rate-limiting falls back to
#     local-only, webhook tracking returns null, etc.).
redis:
  # How web + edge functions obtain REDIS_URL (cross-replica Next.js SSR cache,
  # GitHub/Discord rate limiters, and webhook dedup). Redis state here is
  # RECONSTRUCTABLE — losing it is not data loss — so the internal Redis may run
  # without persistence.
  #   external — you provide a `pawtograder-redis` Secret with REDIS_URL out of
  #              band (Upstash, or a cluster Redis you manage yourself).
  #   shared   — sync REDIS_URL from a secret store (ESO) pointing at a
  #              cluster-wide shared Redis you run OUTSIDE this release.
  #   internal — deploy a Redis with THIS chart and wire REDIS_URL to it.
  provider: external
  shared:
    storeName: openbao
    storeKind: ClusterSecretStore
    path: apps/pawtograder/redis-shared
    refreshInterval: 1h
  # Used only when provider=internal. Deploys a single-replica Redis, owns the
  # `pawtograder-redis` Secret (REDIS_URL [+ REDIS_PASSWORD]) that web/edge mount.
  internal:
    image:
      repository: redis
      tag: "7.4.2-alpine"
      pullPolicy: IfNotPresent
    service:
      port: 6379
    # AUTH. When enabled, the chart generates a password ONCE and preserves it
    # across upgrades (lookup of the existing pawtograder-redis Secret), embeds
    # it in REDIS_URL, and starts redis with --requirepass. With GitOps/Fleet
    # the helm render runs server-side so the lookup keeps the password stable;
    # `helm template` with no cluster regenerates it (fine for dry-run only).
    # Disable for a no-auth in-namespace cache (gate with a NetworkPolicy).
    auth:
      enabled: true
      # Optional explicit override. Leave empty to auto-generate; do NOT commit
      # a real secret here in a GitOps repo.
      password: ""
    # OPTIONAL — the data is reconstructable. Off = pure in-memory (RDB+AOF
    # disabled, no volume). On = a PVC with append-only persistence.
    persistence:
      enabled: false
      storageClass: ""
      size: 8Gi
    # maxmemory bounds the pod; allkeys-lru evicts coldest keys when full —
    # safe for a cache + limiter store.
    maxmemory: "768mb"
    maxmemoryPolicy: "allkeys-lru"
    # Close client connections idle for this many seconds (0 = never). Non-zero
    # reaps sockets leaked by clients that open a connection and don't close it,
    # so they can't accumulate to maxclients ("ERR max number of clients
    # reached"). ioredis auto-reconnects, so reaping an idle connection is
    # transparent.
    timeout: 300
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "1", memory: "1Gi" }
    # Per-component hardening (NOT the global fallback): uid 999 must be pinned
    # here so drop-ALL is safe. The redis:7.4.2-alpine entrypoint only needs root
    # for its chown + su-exec steps; started directly as the image's redis user
    # (uid 999) it skips that path entirely, so the full conservative baseline
    # holds. readOnlyRootFilesystem is safe both ways: persistence-off runs
    # `--save "" --appendonly no` (writes nothing; a manual BGSAVE would error,
    # which is acceptable), and persistence-on writes only under /data, which is a
    # volume mount. To opt out for a custom image whose entrypoint needs more,
    # override either key (e.g. set it to {}).
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
    nodeSelector: {}
    tolerations: []

# -----------------------------------------------------------------------------
# The functions themselves are baked into a per-release image by the
# pawtograder build pipeline (FROM supabase/edge-runtime + COPY supabase/functions).
# Configure env vars consumed by functions in `web.envFrom`-style secrets.
edgeFunctions:
  enabled: true
  replicas: 2
  # Stakater Reloader integration. When enabled, the Deployment is annotated
  # reloader.stakater.com/auto: "true" so it rolls automatically when a Secret
  # it references changes. Important here because the edge-functions env comes
  # from a SealedSecret applied outside helm — a rotation won't change the pod
  # template, so without Reloader the pods keep the stale value until a manual
  # restart. Requires the Reloader controller cluster-wide; the annotation is
  # ignored (harmless) if it is not installed.
  reloader:
    enabled: true
  # End-to-end / load-test gates. Pawtograder edge functions check these
  # to enable test-only privileged paths (e2e helpers) and to mock the
  # GitHub integration so k6 runs don't actually call github.com.
  e2e:
    enabled: false
    mockGitHub: false
  # Names of additional Secrets to envFrom into the edge-runtime pod. Use for
  # integration credentials managed by ESO in your overlay. Each is mounted
  # optional: true — a Secret that is missing at pod start is skipped rather
  # than blocking startup, because envFrom is one-shot and all-or-nothing: one
  # absent Secret would otherwise put the whole edge tier in
  # CreateContainerConfigError with no self-heal. A pod that boots before a
  # Secret has synced therefore runs without those variables until it is
  # rolled, so keep edgeFunctions.reloader enabled and rely on the consuming
  # function to report missing config loudly (see edgeFunctions.email.enabled).
  envFromSecrets: []
  email:
    # "true" | "false" | "" (unset). Rendered as EMAIL_ENABLED, consumed by
    # supabase/functions/_shared/emailTransportConfig.ts.
    #
    # Unset infers from SMTP_HOST, preserving today's behavior everywhere. "true" makes missing
    # SMTP config a hard, reported failure instead of an indefinite silent deferral, so set it
    # wherever email is supposed to work. "false" archives notifications without sending.
    enabled: ""
  image:
    repository: ghcr.io/pawtograder/edge-functions
    tag: "" # default: chart appVersion
    pullPolicy: IfNotPresent
  policy: per_worker # per_worker | per_request | oneshot. per_request gives each
                     # request its own isolate (no concurrent co-location → no shared-heap
                     # memory pile-up under bursts); per_worker co-locates for efficiency.
  # NOTE for the pg_cron-poked background workers (notification-queue-processor,
  # github/discord-async-worker, gradebook-column-recalculate): they must NOT rely on
  # module-level state to keep one poll loop per pod, because `per_request` gives every
  # poke a fresh isolate and resets it. They bound themselves instead — a Redis lease
  # when REDIS_URL / UPSTASH_* are set, and a wall-clock-bounded drain-and-exit when they
  # are not. See supabase/functions/_shared/workerRun.ts. Consequences worth knowing:
  #   * With Redis, ONE pod holds each worker's lease and keeps a resident loop, so that
  #     pod carries one admission slot per worker for the isolate's life. Latency is the
  #     loop's own idle interval (10–15s).
  #   * Without Redis, each poke drains and exits, holding no slot between pokes, and new
  #     work waits for the next cron tick instead. Safer, slower.
  # Raising maxParallelism does not substitute for either: an unbounded loop consumes
  # whatever you give it.
  # Cap on simultaneous worker isolates (--max-parallelism). Under per_request this
  # is effectively the max concurrent requests per pod (excess queue up to
  # request-wait-timeout).
  #
  # REQUIRED, and validated by pawtograder.edgeFunctions.assertMemoryBudget: this
  # is a term in the container memory budget, and unset means "whatever the runtime
  # infers from CPU count", which cannot be checked at render time. 8 is what
  # production runs; 8 x worker.memoryLimitMb is the isolate half of the budget.
  maxParallelism: 8
  verifyJwt: false # all functions in pawtograder set this; auth handled in-function
  # "beforeunload" / EarlyDrop thresholds (% of each per-worker resource limit).
  # When a per_worker isolate crosses the ratio the runtime tells it to finish
  # the current request and retire, then replaces it with a fresh isolate — this
  # is the ONLY way per_worker memory gets reclaimed (V8 never returns heap to
  # the OS). The runtime default is 90%, which is too late: a concurrent burst
  # overshoots the hard cap before the worker drains and gets hard-killed
  # (request cancelled). supabase.com uses ~50% of any resource; matching that
  # gives workers headroom to finish in-flight requests and recycle cleanly.
  beforeUnload:
    memoryRatio: 50
    cpuRatio: 50
    wallClockRatio: 50
  # Per-isolate worker limits (the main.ts demuxer reads these from env),
  # matching supabase.com's hosted edge runtime. The runtime reuses a worker
  # across requests and retires it gracefully as it nears these limits; main.ts
  # retries retired workers on a fresh isolate. memoryLimitMb is intentionally
  # modest (hosted runs 150–256) — under load the lifecycle handling matters far
  # more than the ceiling. The 2s CPU soft limit (matching hosted's documented
  # 2s) is the key knob: it retires busy workers frequently so memory never
  # accumulates toward the 256MB cap. cpuHardMs keeps headroom above soft so an
  # in-flight request that crosses 2s can finish rather than being force-cancelled
  # (CPU time excludes async I/O, so 2s of real compute is ample here).
  # Byte budget for the eszip cache the main.ts demuxer keeps of the bundles it
  # has served. This is a real term in the container memory budget and it is the
  # one that is easy to forget: a pod holds one bundle per DISTINCT FUNCTION it
  # has ever been asked for. Unbounded, that alone exceeded the container limit
  # and OOM-killed pods after a few days' uptime (2026-08-19).
  #
  # Bundle inventory. Re-measure this rather than trusting it: nothing pins the
  # dependency graph (deno.lock is gitignored AND `rm -f`'d by the Dockerfile), so
  # the corpus drifts on its own and every figure here has a date for that reason.
  #   2026-08-28, from /home/deno/eszips in a running pod:
  #     58 bundles, 1390MiB total; min 5.5MiB / median 30.7MiB / max 43.2MiB.
  #   2026-09-01, from `docker build --target bundler` on the same tree:
  #     58 bundles, 1569MiB total; min 5.5MiB / median 36.1MiB / max 48.6MiB.
  # That is +13% in four days with no deliberate dependency change — which is the
  # argument for pinning, and the reason to re-measure before re-tuning.
  # (The much older "55 bundles, ~2.2GB, 19-59MB" came from the Dockerfile
  # bundler's own log line, which main.ts still quotes; it predates the
  # @sentry/deno pin in #934.)
  # Averaging these is how you get surprised, so size the cache off the MEDIAN:
  # at 36.1MiB, 512Mi holds ~14 of 58 and 256Mi holds ~7.
  #
  # To re-measure:
  #   docker build -f charts/pawtograder/images/edge-functions/Dockerfile \
  #     --target bundler -t eszip-check .
  #   docker run --rm --entrypoint sh eszip-check -c \
  #     'cd /home/deno/eszips && for f in *.eszip; do \
  #        printf "%s\t%s\n" "$(stat -c%s "$f")" "${f%.eszip}"; done | sort -n'
  #
  # The container budget is four terms that must be reconciled together:
  #   eszipCacheMaxMb + eszipColdLoadHeadroomMb
  #     + (maxParallelism x worker.memoryLimitMb) + ~600Mi host
  # At these defaults: 256Mi + 256Mi + (8 x 256Mi) + 600Mi = 3160Mi (~3.1Gi),
  # which is why the edge tier wants a limit at or above 4Gi. Raise this only
  # alongside that sum.
  #
  # 2026-08-28: 512 -> 256, to make the memory metric mean something again.
  #
  # The edge HPA had been pinned at maxReplicas 32 with memory 106% against a
  # 100% target while CPU sat at 5% of a 200% target — an autoscaler that can
  # only ever say "already at max" is not autoscaling, and it left no burst
  # headroom ahead of a ~2k WAU ramp. The cause is a per-pod memory FLOOR that
  # is load-INDEPENDENT and dominated by this cache:
  #   ~320Mi Deno host baseline (measured, see resources notes)
  #    512Mi eszip cache at its cap
  #   -------
  #   ~832Mi against prod's 1Gi request  => ~81% before a request is served,
  #          and measured idle sat higher still (~98%) because a pod keeps
  #          some isolates resident between requests.
  #
  # Confirmed by a natural experiment during the 2026-08-28 deploy: the pods
  # were recreated, and the SAME fleet under the SAME load went from mean
  # 1094Mi / 32 replicas pinned (pods aged 8h-2d5h) to mean 504Mi / 12 replicas
  # (pods <1h). Nothing about traffic changed — only cache warmth. The floor
  # climbs after every deploy until it crosses the target, then sticks there.
  #
  # Halving the cache takes ~256Mi off that floor, so utilization tracks isolate
  # load rather than cache occupancy. The trade is explicit and cheap: a pod
  # caches ~8 distinct functions instead of ~16, out of 58. A miss is a LOCAL
  # read from the image layer at /home/deno/eszips plus an eszip parse — not a
  # network fetch and not a transpile. main.ts falls back to raw servicePath
  # (the slow, memory-heavy path) only when a bundle is MISSING from the image,
  # which is not what eviction causes.
  #
  # Isolate sizing, corrected 2026-08-28: an earlier version of this note put the
  # load-dependent term at 8 x ~20Mi = ~160Mi, reading the "~16-20MB marginal"
  # figure out of main.ts. That figure describes the marginal cost of an ADDITIONAL
  # isolate for the SAME function once its module graph is loaded; a real isolate
  # under production load measures ~116Mi. So the load-dependent band is
  # 8 x ~116Mi = ~900Mi, and with the cache at 256 a pod runs a ~576Mi floor
  # (56% of prod's 1Gi request) up to a ~1500Mi loaded peak (146%).
  #
  # That makes memory a STRONG scaling signal here — ~900Mi of swing on a ~576Mi
  # floor. An earlier version of this note concluded the opposite ("structurally
  # weak signal at any request value") and pointed at pgmq queue depth as the real
  # fix; that conclusion rested on the ~160Mi figure and is retracted. The problem
  # was never signal strength. It was that the floor sat inside the HPA's default
  # 90-110% dead band, which is what autoscaling.targetMemoryUtilizationPercentage
  # below now addresses.
  #
  # Host baseline corrected again 2026-09-01: the ~320Mi above is wrong by half.
  # Measured on a fleet that had converged, the load-independent Deno baseline is
  # ~600Mi, so the floor with a 256Mi cache is ~860Mi rather than the ~576Mi this
  # note computed — and that wrong term is why halving the cache on 08-28 moved
  # the floor much less than its arithmetic promised. An earlier version of this
  # note also left resources.requests.memory alone as "out of scope"; it is not
  # out of scope any more, and the default is now 1.5Gi. See the note on
  # resources below, which carries the converged measurements. The two stay
  # coupled — the HPA target is a percentage OF the request, so moving one without
  # redoing the band calculation re-wedges the dead band.
  #
  # In MiB, matching worker.memoryLimitMb below. (Kept in MiB rather than bytes
  # because YAML renders a bare 536870912 as 5.36870912e+08 through Helm.)
  eszipCacheMaxMb: 256
  # Headroom for bundle bytes the cache accounting does NOT see: a bundle being
  # read on a cache miss, and one the LRU evicted (or refused as oversized) while
  # a worker creation still holds a reference to it. Those buffers are real and
  # concurrent with the cache, so the container budget has to carry them.
  #
  # main.ts holds such a reference only for the duration of
  # EdgeRuntime.userWorkers.create() rather than for the whole request, which is
  # what keeps this term small — but it is not zero, and a burst of cold requests
  # for DISTINCT functions right after a pod starts is when it peaks. 256Mi is
  # roughly four of the largest bundle in the image (58.4MiB when this was
  # written; 43.2MiB on 2026-08-28, 48.6MiB on 2026-09-01 — it moves, see the
  # inventory note above). The render-time floor of 64Mi still covers the
  # largest, with less margin than the 2026-08-28 figure suggested.
  # After warmup the working set is resident and this is not touched at all.
  # Deliberately NOT reduced alongside eszipCacheMaxMb above: this term covers
  # COLD reads, and halving the cache makes cold reads more frequent, not less.
  eszipColdLoadHeadroomMb: 256
  worker:
    memoryLimitMb: 256
    timeoutMs: 400000 # 400s worker lifetime (hosted paid-plan default)
    cpuSoftMs: 2000 # graceful-retire signal (matches hosted's 2s) — drives frequent recycling
    cpuHardMs: 5000 # hard kill; headroom above soft so in-flight requests finish
    # Memory early-drop (hosted "EarlyDrop"): isolate finishes the current request
    # and retires once memory crosses ~memoryLimitMb/lowMemoryMultiplier. 2 ≈ the
    # hosted "50% of any resource" rule (~128MB at 256MB). This lets a memory-heavy
    # request finish + return instead of being force-killed at the hard cap.
    lowMemoryMultiplier: 2
  # The memory REQUEST is what a memory-target HPA measures utilization against,
  # so on this tier it is an autoscaling input and not just a scheduling hint.
  #
  # 2026-09-01: 512Mi -> 1.5Gi. 512Mi was not merely a low number — it was below
  # the floor on ANY deployment, at ANY load, including a completely idle one.
  # The Deno host baseline for this runtime measures ~600Mi and is
  # load-INDEPENDENT: it is the runtime itself, not per-request work. So
  # utilization started above 100% before a single request was served, and a
  # memory-target HPA is pinned at maxReplicas from the moment it is enabled —
  # it cannot scale down (that needs <90% of target, given the controller's 10%
  # tolerance) and cannot scale up (already at max). Production spent weeks that
  # way, and its own values file has carried a warning since 2026-08-11 telling
  # operators not to copy this block wholesale because of exactly this value. A
  # default that has to ship with a "do not use this" note attached is a bug.
  #
  # The floor takes ~24h to CONVERGE, not the 2-3h every previous attempt at this
  # value assumed. Measured in production at 2-10m CPU (i.e. no load), request
  # 1.5Gi, eszipCacheMaxMb 256:
  #     30m  mean  459Mi (30%)     10h  mean 1069Mi (70%)
  #      2h  mean  723Mi (47%)     24h  mean 1227Mi (80%)
  #      4h  mean  898Mi (58%)     29h  mean 1268Mi (83%)
  #      6h  mean  972Mi (63%)   2d11h  mean 1253Mi (82%)  <- converged
  # Four values have now been set on this tier (512Mi -> 1Gi -> 1.5Gi -> 1.8Gi);
  # the first three were each chosen from a fleet that had not converged, and each
  # looked correct for a few hours. Anyone re-tuning this has to measure on pods
  # more than 24h old at low CPU, or they will repeat that.
  #
  # Why 1.5Gi as the CHART DEFAULT rather than the 1.8Gi prod sets for itself: the
  # floor is not a constant. It scales with how many distinct functions a pod
  # serves and how big its eszip cache is, so the default must not encode one
  # deployment's floor. Prod's converged idle floor is ~1260Mi, which puts its
  # usable request window at 1750-1920Mi (derived from the 72-88% dead band at
  # target 80: the request must exceed idle/0.72 and stay below loaded/0.88), and
  # prod overrides this to 1.8Gi in its own values. 1.5Gi is chosen here because
  # it sits comfortably above the ~600Mi load-independent baseline, so the HPA is
  # never pinned out of the box; it is a value production ran stably for days; and
  # it does not impose prod's capacity cost on smaller installs.
  #
  # Operators should measure their OWN converged floor — idle mean and min at low
  # CPU on pods >24h old — and size this from it, together with
  # autoscaling.targetMemoryUtilizationPercentage below. The target is a
  # percentage of this number, so the two cannot be set independently.
  #
  # The memory LIMIT has to hold the whole budget documented above
  # (eszipCacheMaxMb + eszipColdLoadHeadroomMb
  #   + maxParallelism x worker.memoryLimitMb + ~600Mi host), which is asserted at
  # render time by pawtograder.edgeFunctions.assertMemoryBudget.
  # 4Gi rather than 2Gi because the documented working configuration does not fit
  # 2Gi, so the old default was a combination the guardrail now rejects outright.
  # That was 2906Mi (~2.8Gi) when the cache was 512Mi; at the current 256Mi cache
  # it is 2650Mi (~2.6Gi), still well past 2Gi. The limit is deliberately NOT
  # lowered to track the cache: it is the backstop described below, and the slack
  # is the point.
  #
  # This is a backstop, not a target: with the cache bounded, a pod's steady state
  # is the cache plus admitted isolates, and the headroom exists so the runtime
  # retires an isolate rather than the kernel killing PID 1 and every request on
  # it. Limits are not scheduled (requests are), so raising it does not change
  # placement.
  resources:
    requests: { cpu: "200m", memory: "1.5Gi" }
    limits: { cpu: "2", memory: "4Gi" }
  # Horizontal autoscaling. When enabled, a HorizontalPodAutoscaler manages the
  # replica count (and the Deployment's static `replicas` is omitted so the two
  # don't fight). minReplicas should be high enough that a sudden burst spreads
  # ~1 request per isolate rather than concentrating on a few pods.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    # 2026-08-28: 100 -> 80. This is the number that actually explains the
    # pinning, and it is not "the target was too low".
    #
    # The HPA controller applies a default 10% TOLERANCE before acting, so a
    # target of 100 is really a DEAD BAND of 90-110%, not "above 100 scales up".
    # Anything landing inside that band moves nothing in either direction. With
    # the per-pod floor at ~98% of the request, the fleet could never scale DOWN
    # (that needs <90%), so once an earlier spike had driven it to maxReplicas it
    # stayed there permanently; and at 109% under load it still would not scale
    # UP (that needs >110%). Both directions were wedged by the same band.
    #
    # The band this was originally sized against -- floor ~576Mi = 56% of prod's
    # then-1Gi request, loaded peak ~1500Mi = 146% -- is HISTORICAL and both
    # numbers have since been retired. See the resources note above: the floor is
    # ~860Mi, not ~576Mi (the host baseline is ~600Mi, not ~320Mi), it takes ~24h
    # to converge, and prod measures a converged idle floor of ~1260Mi against a
    # loaded ceiling of ~1690Mi. Do not re-derive a request from the figures in
    # this paragraph.
    #
    # What survives the correction is the shape of the argument, which is why 80
    # is still right: a target of 80 puts the dead band at 72-88%, and the request
    # is sized to straddle it -- above idle/0.72 so a quiet fleet can scale down,
    # below loaded/0.88 so a busy one can scale up. With the converged numbers
    # that window is 1750-1920Mi for prod (which sets 1.8Gi in its own values), and
    # the chart default of 1.5Gi clears the ~600Mi load-independent baseline by
    # enough that a stock install is never pinned. Every install should still
    # re-measure its own floor.
    #
    # Confirmed live on the prod fleet, cache already at 256Mi:
    #   18:46   109%/100%   12 replicas   pinned
    #   18:48   109%/80%    12 replicas   target changed
    #   18:49    78%/80%    20 replicas   scaled, then settled at equilibrium
    #
    # Changing the target is not a substitute for sizing the request from
    # measured data -- see the resources note above. The two interact: this
    # target is expressed as a percentage OF the request, so re-setting the
    # request without redoing this arithmetic re-wedges the band.
    targetMemoryUtilizationPercentage: 80
    targetCPUUtilizationPercentage: 200
  service:
    port: 9000
  # Graceful drain on SIGTERM. edge-runtime intercepts SIGTERM and, up to
  # --graceful-exit-timeout, stops NEW intake and lets IN-FLIGHT handlers finish
  # before exiting (verified against v1.74.0: with the flag a 25s request that was
  # in flight at SIGTERM completed 200 and the process exited right after; at the
  # 15s default the same request was cut off with "channel closed"). It exits
  # promptly when idle (~0.3s in the same test), so this is cheap — unlike a fixed
  # preStop sleep, it only waits as long as there is work.
  #
  # Sizing: gracefulExitTimeoutSeconds >= worker.timeoutMs (400s) so the longest
  # possible in-flight request can finish; preStop is a SHORT endpoint-drop delay
  # (kong/Service drops the pod before SIGTERM, so no new intake races the drain);
  # terminationGracePeriodSeconds is only a SIGKILL BACKSTOP — it must exceed
  # preStop + gracefulExitTimeout so the kubelet never SIGKILLs mid-drain, but the
  # runtime normally exits well before it.
  gracefulExitTimeoutSeconds: 410 # --graceful-exit-timeout; >= worker.timeoutMs (400s)
  preStopSleepSeconds: 10 # short: just lets kong/endpoints drop the pod pre-SIGTERM
  terminationGracePeriodSeconds: 430 # SIGKILL backstop >= preStop + gracefulExitTimeout
  spreadAcrossNodes: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # ---------------------------------------------------------------------------
  # Supervised background-worker TIER
  # ---------------------------------------------------------------------------
  # A second edge-functions Deployment serving ONLY the four pg_cron-poked pgmq
  # consumers. Same image, same 58 bundles, same database — it differs in its
  # isolation config and its memory budget, and Kong routes those four function
  # NAMES to it by path (templates/kong-config.yaml). Everything not set here
  # inherits from edgeFunctions above.
  #
  # A tier is not a channel. A channel is an A/B of the WHOLE function set on
  # its own image tag, reached by HOST. A tier is a subset of functions on the
  # same image, reached by PATH.
  #
  # Why these four do not belong on the request tier — two measured reasons:
  #
  #  1. ADMISSION SLOTS. Three of them run in `leased` mode (see
  #     supabase/functions/_shared/workerRun.ts): one isolate per worker per
  #     lease scope parks a resident drain loop and holds one of
  #     maxParallelism's 8 slots for the isolate's life. On the request tier
  #     those slots are the same ones student requests queue behind.
  #  2. ESZIP CACHE OCCUPANCY. eszipCacheMaxMb 256 holds ~7 of 58 bundles at the
  #     36.1MiB median, and these four are 90.3MiB of them. They are poked every
  #     ~30s, so they are never
  #     LRU-evicted and permanently occupy about half of every request-tier
  #     pod's cache — on all 12-24 replicas — while serving zero user requests.
  #
  # A third, non-obvious one: today every request-tier pod contends for each
  # worker's Redis lease, so 11-23 of them do a Redis round trip per poke and
  # then return `idle`. Confining pokes to this tier removes that entirely.
  #
  # Enabling this is a Kong ROUTING change: no migration, no client change, no
  # image rebuild. Callers only ever address `/functions/v1/<name>`, and that is
  # resolved gateway-side. Setting enabled: false returns all four to the
  # request tier's `/functions/v1/` catch-all in one `helm upgrade`.
  workerTier:
    # Off by default, so an existing values file renders exactly what it renders
    # today. Also correct for the two runtimes that have no demuxer and no Kong
    # of ours: hosted supabase.com and `supabase functions serve`.
    enabled: false
    # The function names Kong routes here. This list is the ONLY source of truth
    # for the split — the routes are generated from it, so routing and tier
    # membership cannot disagree. A name NOT listed keeps hitting the request
    # tier and behaves exactly as it does today, which is what makes shortening
    # this list a safe way to move one worker back without a rollback.
    #
    # Enabled with an empty list is refused at render time: the pods would run,
    # be scraped, cost their whole memory limit and receive nothing, while the
    # four workers kept running on the request tier. Nothing would look broken.
    functions:
      - notification-queue-processor
      - github-async-worker
      - discord-async-worker
      - gradebook-column-recalculate
    # 2, and it buys AVAILABILITY, not throughput. Three of the four workers are
    # leased: exactly one isolate per worker per lease scope drains, and every
    # other poke returns immediately via `idleRun` (workerRun.ts). Replicas do
    # not parallelize the work. The second one covers a rolling update and a node
    # drain. (gradebook-column-recalculate is the exception — `preferBounded:
    # true` — and pgmq's per-message visibility timeout makes extra drainers safe
    # there, just unnecessary.)
    replicas: 2
    # Deliberately per_request, i.e. the same policy every deployed overlay runs
    # today, so enabling this tier changes WHERE the workers run and nothing
    # else. That keeps the split independently revertible.
    #
    # This tier is also where per_worker should be VALIDATED before the request
    # tier is considered (issue #926). It is the cheap place to learn it: its
    # routed function count is known at render time and small, whereas on the
    # request tier `--max-parallelism` has two plausible meanings under
    # per_worker that fail in opposite directions — see the maxParallelism note
    # above, and the per_worker assertions in _edge-functions-workload.tpl.
    policy: per_request
    # 8, matching the request tier rather than inventing a smaller number. The
    # four workers hold up to 4 resident slots (3 leased loops + 1 bounded
    # drain), and beforeUnload recycling transiently holds a retiring and a
    # replacement isolate at once. Slot exhaustion as a function of uptime is the
    # exact failure workerRun.ts was written to escape, so this is not the knob
    # to economize on; the memory it costs is bounded and this tier has 2 pods.
    maxParallelism: 8
    # The four routed bundles MEASURED 2026-09-01: notification-queue-processor
    # 14.2 + github-async-worker 36.7 + discord-async-worker 13.9 +
    # gradebook-column-recalculate 25.6 = 90.3MiB.
    #
    # The hot set is FIVE bundles, not four: `metrics` is in no route list, but
    # the ServiceMonitor scrapes /metrics on every pod of this tier and the
    # demuxer resolves that by first path segment like any other request, so that
    # bundle is loaded and stays resident at the scrape interval. The render-time
    # assertion counts it (len(functions) + 1); at 192Mi there is room for all
    # five plus growth, so this tier NEVER evicts — unlike the request tier, where
    # 256Mi holds ~7 of 58 and eviction is the steady state. Asserted at
    # render time against len(functions): a routed tier that evicts re-reads a
    # bundle it will need again seconds later, which is the opposite of the point.
    eszipCacheMaxMb: 192
    # Above the 64Mi floor (the largest bundle in the image), with margin for a
    # bundle growing. A routed tier does exactly 4 cold loads per pod lifetime,
    # at startup, so serializing them costs nothing.
    eszipColdLoadHeadroomMb: 96
    # 192 + 96 + (8 x 256) + ~600Mi host = 2936Mi. 3584Mi leaves 648Mi (18%) of
    # backstop slack; the request tier runs 3160Mi against 4Gi (23%).
    #
    # The host term is 600Mi, not the 90Mi this comment used to carry: 90 was the
    # cost at t=0 with an empty cache, but the limit is a hard cgroup ceiling, so
    # what has to fit is the converged baseline #949 measured. At 3Gi the same
    # tier would have had 136Mi of real slack while claiming 646Mi.
    #
    # Mi, not Gi, deliberately: assertMemoryBudget parses a Gi limit with
    # `trimSuffix "Gi" | int`, so a fractional value like 3.5Gi would truncate to
    # 3 and silently certify against 3072Mi.
    #
    # requests.memory is a SCHEDULING HINT here, not an autoscaling input,
    # because this tier has no HPA — so unlike the request tier (see the long
    # note above, and #949) it can be re-measured and changed without re-wedging
    # a dead band.
    resources:
      requests:
        cpu: "100m"
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 3584Mi
    # The base rule "gracefulExitTimeoutSeconds >= worker.timeoutMs" INVERTS on
    # this tier. There it protects a long in-flight USER request. Here the
    # long-lived thing is a deliberately infinite drain loop that will never
    # finish on its own, so honouring 410s would make every rollout take ~7
    # minutes per pod. Cutting it is safe: pgmq's visibility timeout makes an
    # interrupted batch visible again, and the Redis lease lapses at its 60s TTL
    # — workerRun.ts is explicitly written for a wall-clock kill that leaves the
    # lease unreleased.
    gracefulExitTimeoutSeconds: 60
    terminationGracePeriodSeconds: 90
    # worker.timeoutMs is deliberately NOT overridden. Raising it would shrink
    # the lease duty-cycle gap (#926 lists that gap as a revisit trigger), but
    # the 400s wall clock is also what currently bounds a possible
    # background-worker memory leak — which #926 lists as its own trigger. Raise
    # it only after this tier's memory panel has been flat for 24h.

# -----------------------------------------------------------------------------
# Kong (API gateway)
# -----------------------------------------------------------------------------
kong:
  enabled: true
  replicas: 2
  # Upstream keepalive. A small pool + short idle timeout keeps kong from
  # pinning load onto a stale subset of upstream pods — important for the
  # autoscaled edge-functions upstream, where the default pool (60) makes
  # bursts reuse pinned connections and starve HPA-added pods. Small pool ⇒
  # bursts open fresh connections that cilium spreads across all endpoints.
  upstreamKeepalive:
    poolSize: 16
    idleTimeoutSeconds: 15
  image:
    repository: kong
    tag: "3.9.1" # stock supabase docker-compose pin
    pullPolicy: IfNotPresent
  # Kong's nginx workers spike well past 512Mi at startup; 6Gi is plenty
  # of headroom and the prod-staging node has the RAM to spare.
  resources:
    requests: { cpu: "200m", memory: "1Gi" }
    limits: { cpu: "2", memory: "6Gi" }
  service:
    port: 8000
  terminationGracePeriodSeconds: 45
  preStopSleepSeconds: 10
  spreadAcrossNodes: true
  # maxSurge 1 means one extra kong during rollout — budget node memory for
  # replicas+1 pods (the limit above is deliberately generous).
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Web (Next.js)
# -----------------------------------------------------------------------------
web:
  enabled: true
  # E2E test bypass: only set true on preview / test deploys. See web.yaml
  # for what it controls (CSP report-only mode). NEVER in production.
  e2e:
    enabled: false
  # When true, /api/metrics refreshes the DB-backed workflow gauges
  # (workflow runs, queue/run percentiles, recent errors) on every
  # scrape. Set on AT MOST ONE pod across the deploy — multiple replicas
  # with this on multiply DB load and over-count gauges. Safe to enable
  # for single-replica installs (previews); for multi-replica prod
  # leave off here and run a dedicated 1-replica metrics-leader.
  workflowMetricsLeader: false
  replicas: 2
  image:
    repository: ghcr.io/pawtograder/web
    tag: "" # default: chart appVersion
    pullPolicy: IfNotPresent

  # Public URL of the API gateway (Kong). If apiOnSeparateHost=true, default
  # is https://api.<hostname>. Override here for unusual topologies.
  apiUrl: ""

  # ---------------------------------------------------------------------------
  # Deployment skinning / branding
  # ---------------------------------------------------------------------------
  # Re-brand the app for a self-hosted deployment: service name, tagline, logos,
  # and accent color. These are passed to the web pod as PLAIN env vars (NOT
  # NEXT_PUBLIC_*) and read server-side at request time (lib/branding.ts), so a
  # SINGLE published web image can be re-skinned per deployment with NO rebuild.
  #
  # Leave a field blank to keep the built-in Pawtograder default for it.
  #
  #   name          Product name shown in page titles, headings, and wordmarks.
  #   description   <meta name="description"> / default site description.
  #   tagline       Short line under the wordmark on the auth screens.
  #   logoLight     Logo for light mode. Either a path bundled in the image
  #                 (e.g. /branding/logo-light.png) or an absolute https:// URL
  #                 to a custom-hosted asset (rendered with a plain <img>, so no
  #                 next.config image-host allow-listing is needed).
  #   logoDark      Logo for dark mode (same rules as logoLight).
  #   favicon       Browser-tab icon. Bundled path (e.g. /branding/favicon.png)
  #                 or absolute https:// URL. Default: the bundled /favicon.ico.
  #   colorPalette  Chakra accent palette. One of: gray, red, orange, yellow,
  #                 green, teal, blue, cyan, purple, pink. Drives the brand
  #                 accent (wordmark color + default component palette).
  #
  # To AVOID hosting assets externally, "burn" custom logos/favicon into the web
  # image at build time: drop files into the repo's `public/branding/` directory
  # (served at /branding/*) before `docker build`, then point logoLight/logoDark/
  # favicon at those /branding/... paths. See the chart README "Deployment
  # skinning / branding" section.
  branding:
    name: ""
    description: ""
    tagline: ""
    logoLight: ""
    logoDark: ""
    favicon: ""
    colorPalette: ""
    # Sign-in SSO buttons. A list of providers, each rendered as a button on the
    # sign-in page in order. Leave empty ([]) to keep the built-in default (a
    # single Microsoft / Northeastern Login button). Each entry:
    #   provider  REQUIRED. Supabase/GoTrue OAuth provider id. One of: apple,
    #             azure, bitbucket, discord, facebook, figma, github, gitlab,
    #             google, kakao, keycloak, linkedin_oidc, notion, slack_oidc,
    #             spotify, twitch, workos, zoom.
    #   label     REQUIRED. Button text, e.g. "Continue with Google".
    #   icon      Optional icon key: microsoft, github, google, apple, discord,
    #             gitlab, slack, twitch, linkedin, sso (key), generic (default).
    #   scopes    Optional space-separated OAuth scopes.
    #
    # IMPORTANT: each provider listed here must ALSO be enabled in GoTrue — via
    # auth.external.{github,azure,discord} or the generic auth.externalProviders
    # list below — or the button will error on click. See the chart README
    # "Single sign-on (SSO)" section. To show NO SSO buttons (email-only), set
    # `BRAND_SSO_PROVIDERS: "[]"` via web.extraEnv.
    ssoProviders: []
    #  - provider: azure
    #    label: "Continue with Microsoft (Northeastern Login)"
    #    icon: microsoft
    #    scopes: "email User.Read"
    #  - provider: google
    #    label: "Continue with Google"
    #    icon: google

  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits: { cpu: "2", memory: "2Gi" }
  service:
    port: 3000

  terminationGracePeriodSeconds: 45
  preStopSleepSeconds: 10
  spreadAcrossNodes: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # Extra env vars passed to the Next.js pod. Use this for integration creds
  # that aren't part of the standard secret bundle (e.g. additional LLM keys).
  extraEnv: []
  # - name: FOO
  #   value: "bar"

  # Reference Secrets that should be mounted via envFrom. Use for ESO-managed
  # bundles (GitHub App key, Canvas, Discord, LLM, etc.).
  envFromSecrets: []
  # - pawtograder-github-app
  # - pawtograder-canvas
  # - pawtograder-discord
  # - pawtograder-llm

  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Ingress (cluster-agnostic; provide ingressClassName + TLS in overlay)
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: ""
  annotations: {}
  tls:
    enabled: true
    secretName: pawtograder-tls
  # Hosts default to: <hostname> for web, api.<hostname> for kong (if
  # apiOnSeparateHost). Override only if you need extra hostnames.
  extraHosts: []

# -----------------------------------------------------------------------------
# CronJobs
# -----------------------------------------------------------------------------
auditPartitions:
  enabled: true
  schedule: "0 3 * * *" # nightly
  # Kill the job if the maintenance function wedges on a lock instead of
  # letting it run forever; skip the run entirely if it couldn't start
  # within startingDeadlineSeconds of its slot.
  activeDeadlineSeconds: 900
  startingDeadlineSeconds: 1800
  image:
    repository: supabase/postgres
    tag: "17.4.1.075"

backup:
  enabled: false
  schedule: "0 4 * * *"
  # Hard ceiling on a single backup run (dump + upload). Size for your DB —
  # a run that exceeds this fails LOUDLY rather than hanging forever.
  activeDeadlineSeconds: 3600
  startingDeadlineSeconds: 1800
  image:
    repository: supabase/postgres
    tag: "17.4.1.075"
  s3:
    endpoint: ""
    region: "us-east-1"
    bucket: "pawtograder-backups"
  retentionDays: 14
  # Restore verification: a second CronJob that downloads the NEWEST backup
  # object and runs `pg_restore --list` over it — validating the archive's
  # TOC end-to-end (download integrity + dump structure) without needing a
  # scratch database. A corrupt or truncated backup fails this job, which
  # otherwise looks identical to a good one until the day you restore.
  verify:
    enabled: true
    schedule: "0 6 * * 1" # weekly, after Monday's backup
    activeDeadlineSeconds: 1800
    startingDeadlineSeconds: 1800
  # Restore DRILL: the full-restore rehearsal `verify` stops short of. It
  # restores the newest dump into a throwaway database on the LIVE postgres,
  # asserts a core table has a plausible row count, then drops the scratch DB.
  # A dump can `pg_restore --list` cleanly yet still fail to restore — this
  # catches that. Off by default (it writes to the primary under a unique DB
  # name); enable in prod and schedule clear of the backup window.
  restoreDrill:
    enabled: false
    schedule: "0 8 * * 1" # weekly, after verify
    activeDeadlineSeconds: 5400
    startingDeadlineSeconds: 1800
    startupTimeoutSeconds: 900 # max wait for the throwaway instance to finish init
    # Restore runs in a FRESH throwaway postgres instance on its own ephemeral
    # volume (not the live primary). scratchSize holds a full copy of the restored
    # DB; storageClass empty → inherit postgres.persistence.storageClass (set a
    # cheaper class, e.g. netapp-economy, to keep restore I/O off the fast tier).
    scratchSize: 100Gi
    storageClass: ""
    ttlSecondsAfterFinished: 3600 # reclaim the finished Job + its scratch PVC
    # Core table + minimum row count proving the restore holds real data.
    # public.classes exists on every install (a live prod DB has >= 1 class).
    assertTable: "public.classes"
    assertMinRows: 1
  # PITR DRILL: the ONLY check that proves point-in-time recovery. verify +
  # restoreDrill exercise the logical-dump path; this exercises wal-g base
  # backup + WAL replay. Fetches the newest base backup into a throwaway
  # ephemeral volume, replays WAL to `targetLagMinutes` in the past, promotes,
  # and asserts (1) a core table restored with data and (2) — when recencyTable
  # is set — that NO rows newer than the target replayed (real point-in-time
  # cutoff). Requires postgres.walg.enabled. Starts archive_mode=off so the
  # scratch cluster can never wal-push into the live prefix. Off by default.
  pitrDrill:
    enabled: false
    schedule: "0 9 * * 1" # weekly, after restoreDrill (08:00)
    activeDeadlineSeconds: 5400
    startingDeadlineSeconds: 1800
    startupTimeoutSeconds: 3600
    # Reclaim the finished Job + its full-size ephemeral scratch PVC this many
    # seconds after completion (0 = delete immediately), so retained Job history
    # doesn't pin multiple 100Gi scratch volumes.
    ttlSecondsAfterFinished: 3600
    # Scratch volume must hold a full copy of PGDATA. Size >= live DB size.
    scratchSize: 100Gi
    # StorageClass for the ephemeral scratch PVC. Empty → inherit
    # postgres.persistence.storageClass. Set to a cheaper/slower class (e.g.
    # netapp-economy) to keep the drill's restore I/O off the primary's fast tier.
    storageClass: ""
    # How far back to target. Must exceed archiver lag (seconds) with margin.
    targetLagMinutes: 15
    assertTable: "public.classes"
    assertMinRows: 1
    # Optional point-in-time precision check: a table with a monotonic
    # timestamptz column that sees frequent writes. When set, the drill asserts
    # ZERO rows newer than the recovery target. Leave empty to skip (row-count
    # only). e.g. recencyTable "public.audit", recencyColumn "created_at".
    recencyTable: ""
    recencyColumn: ""
  # `mc` (MinIO client) is downloaded at runtime because the
  # supabase/postgres image doesn't include it. Pin both URL and
  # SHA256 together; any mismatch fails the job before secrets are
  # used. Update both when bumping the version.
  mc:
    url: "https://dl.min.io/client/mc/release/linux-amd64/archive/mc.RELEASE.2025-08-13T08-35-41Z"
    sha256: "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891"

# -----------------------------------------------------------------------------
# ServiceAccount
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: ""
  # No pawtograder workload talks to the Kubernetes API, so the shared SA's
  # token is not mounted into pods. The secrets-bootstrap hook Job uses its
  # own dedicated SA and opts back in explicitly.
  automountToken: false

# -----------------------------------------------------------------------------
# Monitoring (Prometheus scraping + Grafana dashboards + Loki logs)
#
# Designed for clusters that already run kube-prometheus-stack:
#   - ServiceMonitor CRs are auto-discovered by the cluster's Prometheus.
#   - Grafana auto-loads ConfigMaps labeled `grafana_dashboard: "1"`
#     from any namespace via its sidecar.
# If your cluster doesn't have those CRDs, leave `enabled: false` — the
# chart skips every monitoring template instead of failing to render.
#
# Required scrape bearer tokens (REALTIME_METRICS_BEARER,
# SUPAVISOR_METRICS_BEARER, METRICS_SCRAPE_TOKEN) are generated by the
# autogenerate path or scripts/GenerateJwtKeys.ts. The chart references
# them by key from the pawtograder-jwt Secret.
# -----------------------------------------------------------------------------
monitoring:
  enabled: false
  scrapeInterval: 30s
  scrapeTimeout: 10s

  # Per-component ServiceMonitor toggles (all default on). Set one false when a
  # component doesn't expose a scrapeable /metrics endpoint in your topology, so
  # Prometheus doesn't flag it perpetually "down". e.g. storage-api serves
  # /metrics only on its admin app / in multitenant mode; disable it on a
  # single-tenant deploy.
  serviceMonitors:
    storage: true

  # Acknowledge that a postgres_exporter you manage is pointed at an externally
  # managed database. ONLY relevant with postgres.enabled=false.
  #
  # Every DB-derived series this chart ships comes from the postgres_exporter
  # SIDECAR inside the chart-managed Postgres StatefulSet (see
  # templates/postgres-statefulset.yaml). With postgres.enabled=false that pod
  # does not exist, so there is no collector — and the `metrics` edge function
  # no longer gathers them either, because doing so cost 77.7% of all database
  # execution time when Prometheus scraped it once per functions pod (32 in
  # prod). templates/validations.yaml therefore REFUSES
  # monitoring.enabled=true + postgres.enabled=false unless you set this,
  # rather than letting vacuum/buffer-cache/dead-tuple metrics vanish silently.
  #
  # Setting this true asserts you run your own exporter against the external
  # database. The queries.yaml ConfigMap still renders, so you can mount it into
  # your exporter and keep the same metric names the dashboards and alert rules
  # expect. The chart's own postgres-exporter Service and ServiceMonitor are NOT
  # rendered when postgres.enabled=false (they would select no pods and sit
  # permanently "down"), so supply your own ServiceMonitor for your exporter.
  externalPostgresExporter: false

  # Alerting rules (Prometheus Operator PrometheusRule) for backup failure /
  # staleness, ExternalSecret sync failure, and TLS cert expiry — the
  # operational alerts PRODUCTION-READINESS deferred to cluster monitoring.
  # `labels` must match the cluster Prometheus's ruleSelector (kube-prometheus-
  # stack's default is `release: <kps-release>`); set it to what your cluster
  # uses or the rules won't be picked up. See docs/operations/monitoring-alerting.md.
  prometheusRules:
    enabled: true
    labels: {}          # e.g. { release: kube-prometheus-stack }
    # In staging/production the chart REFUSES to render an enabled PrometheusRule
    # with empty `labels`, because kube-prometheus-stack's ruleSelector matches
    # `release: <name>` and an unlabeled rule is silently never loaded (every
    # alert inert). Set `labels` to your cluster's ruleSelector, or set this to
    # true to confirm your Prometheus selects all rules and skip the guard.
    allowUnselectedRules: false
    backupMaxAgeHours: 36
    certExpiryWarningDays: 14
    # Namespaces to watch for expiring cert-manager Certificates. Defaults to the release
    # namespace, which is what the rule used to hardcode — and why it could never match: the
    # wildcard TLS Certificate lives in the ingress controller's namespace, so the shipped expiry
    # alert watched a set containing no certificates at all. Add the ingress namespace here.
    certNamespaces: []
    # Notification email queue depth (messages) above which PawtograderNotificationEmailBacklog fires.
    notificationEmailBacklog: 500
    # Oldest-message age (seconds) above which PawtograderQueueOldestMessageAging fires, for any
    # queue. Scale-free, unlike the depth thresholds above, so it needs no per-term retuning.
    queueOldestSeconds: 1200
    # Growth in the Discord DLQ over an hour above which PawtograderDiscordDLQGrowing fires.
    # A rate, not a level: a poison message sits in the DLQ forever, so a level alert would fire
    # permanently and get silenced.
    discordDlqGrowthPerHour: 20
    # Growth in the gradebook row-recalculate DLQ over an hour above which
    # PawtograderGradebookRecalcDLQGrowing fires. Much lower than the other DLQ thresholds: a message
    # only lands here after eight backed-off recovery attempts, and each one is a gradebook row whose
    # stored score is stale with nothing left to recompute it.
    gradebookRecalcDlqGrowthPerHour: 5
    # How long a Discord per-guild circuit breaker may stay open before
    # PawtograderDiscordCircuitBreakerOpen fires. Must stay comfortably BELOW the breaker's shortest
    # window, which is the 30-minute permission_storm base in open_discord_circuit(): the gauge is
    # is_open, which goes false as soon as open_until passes, so any value at or above 30m cannot be
    # satisfied by a first trip and the alert is silent for the whole of the first incident. This was
    # 45m and never fired on one. Ten minutes is ten or more consecutive scrapes (so a scrape gap
    # cannot flap it) with 20 minutes of margin left inside the shortest window.
    discordCircuitOpenFor: 10m
    # How long the chart-managed Postgres StatefulSet may report ZERO ready
    # replicas before PawtograderPostgresUnavailable pages (critical).
    #
    # This is the alert that covers a wedged primary. It exists because the
    # liveness probes were removed (see postgres-statefulset.yaml): nothing
    # restarts a wedged postmaster automatically any more, so the condition has to
    # page instead. It is keyed on kube-state-metrics, NOT on anything produced
    # inside the postgres pod — the exporter sidecar and the metrics edge function
    # both die with the database, which is exactly why the pre-existing critical
    # rules cannot detect this (they are `metric > threshold` on series that
    # disappear, so they fail OPEN).
    #
    # Must outlast a NORMAL rollout or the chart pages on every deploy: the
    # StatefulSet legitimately goes not-ready on any config change. Budget is
    # roughly preStop fast shutdown (seconds) + a possible cold image pull of the
    # supabase/postgres image (1-3 min) + postgres start and readiness
    # (initialDelay 10s + up to 3x5s) — call it 3-4 min worst case on a cold node.
    # 5m clears that with margin and matches the 5m used by
    # PawtograderPostgresConnectionsSaturated and PawtograderAsyncQueueBacklog.
    # Raise it if your nodes pull images slowly; lower it only if images are always
    # warm.
    postgresUnavailableFor: 5m
    # Edge-function pod restarts in 30m above which PawtograderEdgeFunctionsRestarting fires.
    edgeFunctionRestarts30m: 2
    # Fraction of the container memory limit above which PawtograderEdgeFunctionsMemoryHigh fires.
    edgeFunctionMemoryRatio: 0.85
    # Fraction of a node's ALLOCATABLE memory, used by this release's own pods, above which
    # PawtograderEdgeFunctionsNodeMemoryHigh fires. Covers the axis every other rule here misses:
    # the kernel can OOM-kill a pod that is nowhere near its own limit, because the NODE is full.
    #
    # Counts only this namespace's usage, so it is a floor on how full the node is, not the whole
    # picture -- a node filled by another tenant will not fire it. In exchange the rule is scoped to
    # nodes we actually run on, and depends only on kube-state-metrics + cadvisor, the same
    # exporters the rest of this rule group already needs.
    nodeMemoryRatio: 0.85
    # Postgres connection-budget saturation (used/max_connections), percent.
    connectionUsagePercentWarning: 80   # PawtograderPostgresConnectionsHigh fires above this
    connectionUsagePercentCritical: 90  # PawtograderPostgresConnectionsSaturated fires above this
    # Streaming-standby replay lag (bytes) above which PawtograderReplicaLagHigh
    # fires (only when postgres.replica.enabled). Primary current LSN − standby
    # replay_lsn; ~0 on a healthy standby. 100 MiB tolerates a bulk write/migration
    # burst without flapping while still catching a standby that is falling behind.
    replicationLagBytesWarning: 104857600  # 100 MiB

  # Alertmanager routing SCAFFOLD (templates/alertmanager-config.yaml). Renders a
  # prometheus-operator AlertmanagerConfig CR that Grafana Alloy's
  # mimir.alerts.kubernetes syncs into Mimir. Routes by the `severity` label our
  # rules set; ships placeholder webhook receivers reading URLs from a Secret.
  # Off by default. Enable, set `labels` to match Alloy's alertmanagerconfig_
  # selector, create the webhook Secret, and swap receivers for the real channel.
  alertmanagerConfig:
    enabled: false
    labels: {}                       # e.g. { alertmanager: mimir } — match Alloy's selector
    webhookSecretName: pawtograder-alertmanager
    groupWait: "30s"
    groupInterval: "5m"
    repeatInterval:
      default: "4h"
      critical: "1h"
      warning: "12h"

  # postgres_exporter sidecar in the postgres pod. Connects via TCP to
  # localhost:5432 with supabase_admin. The custom queries ConfigMap is
  # rendered by templates/monitoring.yaml (label
  # `app.kubernetes.io/component=postgres-exporter`).
  postgresExporter:
    image:
      repository: quay.io/prometheuscommunity/postgres-exporter
      tag: "v0.18.0"
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: "20m",  memory: "32Mi" }
      limits:   { cpu: "200m", memory: "128Mi" }

  # Grafana dashboards shipped by the chart. Each is a ConfigMap with
  # label `grafana_dashboard: "1"` so the kps-grafana sidecar mounts
  # them automatically. Disable individual dashboards if your platform
  # team owns them out-of-band.
  dashboards:
    stackOverview:    true
    postgresDeepDive: true
    realtimeFanout:   true
    edgeFunctions:    true
    appBusiness:      true
    rateLimiting:     true
    edgeSoak:         true
    # Depth AND oldest-message age for every pgmq queue, side by side. Depth alone cannot tell a
    # busy queue from a stalled one, and depth thresholds need retuning each term; age does not.
    queuesAndWorkers: true

  # Logs are NOT deployed by this chart. Log collection (Alloy
  # DaemonSet shipping into a central Loki) is a cluster-level concern
  # and lives in /home/jon/work/k8s/apps/monitoring/. The chart's only
  # responsibility for logs is emitting structured pino-style JSON from
  # the web app's stdout; the cluster Alloy joins pod labels and ships
  # to Loki for you. Querying: Grafana Explore → Loki datasource →
  # {namespace="pawtograder-preview-pr-<id>"}.

# -----------------------------------------------------------------------------
# Tests
# -----------------------------------------------------------------------------
# Helm test hooks. `helm test <release>` (and CI after a deploy) runs these; a
# non-zero exit fails the release. The smoke test is a fast in-cluster serve
# check (web readiness path + GoTrue /health through Kong) — the automated
# post-deploy gate PRODUCTION-READINESS §5 tracked as missing. It complements,
# and does NOT replace, the human smoke checklist in
# docs/operations/production-install.md (sign-in, gradebook read, realtime).
tests:
  smoke:
    enabled: true
    # curl + sh, small and dependency-free.
    image: curlimages/curl:8.11.1
    # Must cover both checks' worst-case retry budget (2 × 30 × (5s curl + 2s
    # sleep) ≈ 420s) so a slow-but-recovering rollout isn't killed mid-retry.
    activeDeadlineSeconds: 480
    resources:
      requests: { cpu: "10m", memory: "16Mi" }
      limits:   { cpu: "100m", memory: "64Mi" }
